  function pageRefs(parts, q) {
    const id = parts[1];
    if (!id) {
      return {
        tab: 'refs', crumbs: [['참조표 모음']], title: '참조표 모음',
        html: `<div class="page-head"><h1>참조표 모음</h1><p class="purpose">대응 트리와 상관없이 기준표를 바로 엽니다. 날짜에 따라 바뀌는 표는 기준일로 자동 판별합니다.</p></div>
          <div class="ref-list">${C.REFS.map(r => refCard(r.id)).join('')}</div>`,
      };
    }
    const r = REF_BY_ID.get(id);
    if (!r) return pageNotFound();
    const from = q.get('from');
    const fromStep = from && STEP_BY_ID.get(from);
    const crumbs = fromStep
      ? [['대응 트리', '#/respond/' + fromStep.id], [`${fromStep.no}. ${fromStep.title}`, '#/respond/' + fromStep.id], [`${r.src} 확인 중`]]
      : [['참조표 모음', '#/refs'], [r.title]];
    return {
      tab: fromStep ? 'respond' : 'refs', crumbs, title: r.title,
      html: `
        <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
          <div class="page-head"><span class="art-no">${esc(r.src)}</span><h1>${esc(r.title)}</h1><p class="purpose plain">${esc(r.purpose)}</p></div>
          ${starBtn('ref:' + r.id, r.title)}
        </div>
        ${fromStep ? `<div class="row"><a class="btn small fire" href="#/respond/${fromStep.id}">← ${fromStep.no}. ${esc(fromStep.short)} 단계로 돌아가기</a></div>` : ''}
        ${refTable(id)}`,
    };
  }

  // ── 학습 모드 ─────────────────────────────────────
  function pageLearn(parts) {
    const n = parts[1];
    if (n === undefined) {
      return {
        tab: 'more', crumbs: [['학습 모드']], title: '학습 모드',
        html: `<div class="page-head"><h1>학습 모드</h1><p class="purpose">조문이 왜 이렇게 짜였는지를 순서대로 익힙니다. 대응 트리와 같은 조문을 근거로 씁니다.</p></div>
          <div class="list">${C.LEARN.map(p => `<a href="#/learn/${p.id}"><div class="l"><span><span class="art-no">${p.id}부</span> ${esc(p.title)}</span><small>${esc(p.sub)}</small></div><span class="chev">›</span></a>`).join('')}</div>`,
      };
    }
    const p = C.LEARN.find(x => String(x.id) === n);
    if (!p) return pageNotFound();
    const prev = C.LEARN.find(x => x.id === p.id - 1), next = C.LEARN.find(x => x.id === p.id + 1);
    return {
      tab: 'more', crumbs: [['학습 모드', '#/learn'], [`${p.id}부 ${p.title}`]], title: `학습 ${p.id}부`,
      html: `
        <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
          <div class="page-head"><span class="art-no">${p.id}부</span><h1>${esc(p.title)}</h1><p class="purpose plain">${esc(p.sub)}</p></div>
          ${starBtn('learn:' + p.id, p.title)}
        </div>

  function snippet(text, terms) {
    const lower = text.toLowerCase();
    let pos = -1;
    for (const t of terms) { const p = lower.indexOf(t); if (p >= 0 && (pos < 0 || p < pos)) pos = p; }
    const start = Math.max(0, pos - 30);
    let s = (start > 0 ? '…' : '') + text.slice(start, start + 110).replace(/\s+/g, ' ') + (text.length > start + 110 ? '…' : '');
    s = esc(s);
    for (const t of terms) s = s.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
    return s;
  }
  function pageSearch(parts, q) {
    const query = (q.get('q') || '').trim();
    let results = '';
    if (query) {
      searchIndex = searchIndex || buildIndex();
      const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
      const hits = searchIndex.filter(e => { const h = (e.title + ' ' + e.text).toLowerCase(); return terms.every(t => h.includes(t)); });
      const groups = ['대응 트리', '예방 체크리스트', '참조표', '학습 모드', '조문 원문'];
      results = hits.length ? groups.map(g => {
        const list = hits.filter(h => h.kind === g);
        if (!list.length) return '';
        return `<section class="stack"><h2 class="section-title">${g} ${list.length}</h2><div class="list">${list.slice(0, 40).map(h => {
          const inner = `<div class="l result"><span>${esc(h.title)}</span><span class="snip">${snippet(h.text, terms)}</span></div><span class="chev">›</span>`;
          if (h.art) return `<a href="javascript:void 0" data-act="art" data-id="${h.art}">${inner}</a>`;
          const href = h.href;
          return `<a href="${href}" ${h.anchor ? `data-anchor="${h.anchor}"` : ''}>${inner}</a>`;
        }).join('')}</div></section>`;
      }).join('') : `<div class="empty">“${esc(query)}”에 맞는 결과가 없습니다. 띄어쓰기를 줄이거나 다른 낱말로 찾아보세요.</div>`;
    }
    return {
      tab: 'more', crumbs: [['검색']], title: '검색',
      html: `<div class="page-head"><h1>검색</h1><p class="purpose">대응 단계, 체크리스트, 참조표, 학습 내용, 법·영·규칙 조문 전체에서 찾습니다.</p></div>

        ${results}`,
      after: () => { if (!query) $('#search-q')?.focus(); },
    };
  }

            <li>조문: 국가법령정보센터에서 받은 PDF(법률 제21622호, 대통령령 제36066호, 농림축산식품부령 제753호)를 추출해 수록. 추출 과정에서 줄바꿈 띄어쓰기가 일부 다를 수 있으니 공문 인용 전 원문을 대조하세요.</li>
            <li>산림청장 고시(대응단계별 동원 기준, 반별 임무 등)와 행정규칙은 수록하지 않았습니다.</li>
            <li>판정 계산기는 조문을 그대로 옮긴 보조 도구이며 최종 판단과 책임은 지휘관에게 있습니다.</li>
            <li>법령·행정규칙 원문은 저작권법 제7조에 따라 보호 대상이 아닌 공공저작물입니다.</li>
          </ul>
          <p class="small muted">조문 데이터 생성일 ${esc(LAWS.generatedAt)}</p>
        </section>`,
    };
  }

  function pageNotFound() {
    return { tab: 'home', crumbs: [['찾을 수 없음']], title: '찾을 수 없음', html: '<div class="empty">없는 화면입니다. <a href="#/">홈으로</a></div>' };
  }

  // ── 원문 시트 ─────────────────────────────────────
  function renderSheet() {
    const root = $('#sheet-root');
    if (!ui.sheet) { root.innerHTML = ''; document.body.style.overflow = ''; return; }
    const a = ART.get(ui.sheet.id);
    const states = versionStates(a);
    const cur = states.find(s => s.state === 'current');
    const upcoming = states.filter(s => s.state === 'upcoming');
    if (ui.sheet.tab === undefined || ui.sheet.tab === null) ui.sheet.tab = cur ? cur.i : upcoming[0].i;
    const shown = states[ui.sheet.tab];
    const law = LAWS.laws[a.law];

    let banner = '';
    if (!cur) banner = `<div class="upcoming"><b>⏳ 아직 시행 전인 조문입니다</b><span>${fmt(upcoming[0].v.from)}부터 시행됩니다 (D-${dayDiff(refDate(), upcoming[0].v.from)}).</span></div>`;
    else if (upcoming.length && shown.state === 'current') banner = `<div class="upcoming"><b>⏳ ${fmt(upcoming[0].v.from)}부터 이렇게 바뀝니다</b><span>아래 “${fmt(upcoming[0].v.from)} 시행” 탭에서 개정 조문을 확인하세요.</span></div>`;
    else if (shown.state === 'upcoming') banner = `<div class="upcoming"><b>⏳ 시행 예정 조문</b><span>${fmt(shown.v.from)}부터 적용됩니다. 기준일(${fmt(refDate())})에는 적용되지 않습니다.</span></div>`;
    else if (shown.state === 'past') banner = `<div class="effective-now">기준일에는 적용되지 않는 <b>종전 조문</b>입니다. 행위 시점에 따라 적용될 수 있습니다.</div>`;

    const tabName = s => {
      if (s.state === 'current') return (s.v.from === BASE_FROM ? '현행' : `${fmt(s.v.from)} 시행`) + ' · 현재 적용';
      if (s.state === 'upcoming') return `${fmt(s.v.from)} 시행 예정`;
      return `${versionName(s.v)} (종전)`;
    };
    root.innerHTML = `
      <div class="sheet-backdrop" data-act="sheet-backdrop">
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <div class="sheet-head">
            <div class="t"><div class="law">${esc(law.name)} · ${esc(a.chapter)}${a.section ? ' · ' + esc(a.section) : ''}</div><h2 id="sheet-title">${esc(a.label)}(${esc(shown.v.title)})</h2></div>
            ${starBtn('art:' + a.id, a.label)}
            <button type="button" class="icon-btn" data-act="sheet-close" aria-label="닫기">${ICON.close}</button>
          </div>
          <div class="sheet-body">
            ${states.length > 1 ? `<div class="sheet-tabs seg" role="tablist">${states.map(s => `<button type="button" role="tab" data-act="sheet-tab" data-i="${s.i}" aria-pressed="${s.i === shown.i}">${esc(tabName(s))}</button>`).join('')}</div>` : ''}
            ${banner}
            <div class="art-body">${articleBody(a, shown.v.body)}</div>
            <div class="row"><a class="btn small ghost" href="#/laws/${a.law}" data-act="sheet-close-nav">${esc(law.name)} 전체 목록</a><a class="btn small ghost" href="${esc(C.NOTEBOOK.url)}" target="_blank" rel="noopener">이 조문 해석을 NotebookLM에서 ↗</a></div>
          </div>
        </div>
      </div>`;
    document.body.style.overflow = 'hidden';
    root.querySelector('.sheet-head .icon-btn[data-act="sheet-close"]').focus({ preventScroll: true });
  }
  function openArticle(id) {
    if (!ART.has(id)) return;
    ui.sheet = { id, tab: null, returnFocus: document.activeElement };
    renderSheet();
  }
  function closeSheet() {
    const back = ui.sheet?.returnFocus;
    ui.sheet = null;
    renderSheet();
    if (back && document.contains(back)) back.focus({ preventScroll: true });
  }

  // ── 렌더 ─────────────────────────────────────────
  function render() {
    const raw = location.hash.replace(/^#\/?/, '');
    const [path, qs] = raw.split('?');
    const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
    const q = new URLSearchParams(qs || '');
    const pages = { '': pageHome, prevent: pagePrevent, respond: pageRespond, refs: pageRefs, learn: pageLearn, search: pageSearch, favs: pageFavs, laws: pageLaws, more: pageMore, settings: pageSettings, install: pageInstall };
    const fn = pages[parts[0] || ''] || pageNotFound;
    const page = fn(parts, q);
    if (!page) return;
    document.body.classList.toggle('incident-on', !!inc() && inc().mode === 'live');
    document.body.classList.toggle('drill-on', !!inc() && inc().mode === 'drill');
    renderTopbar(page.crumbs);
    renderTabbar(page.tab);
    $('#main').innerHTML = page.html;
    document.title = page.title === '홈' ? '산불현장지휘 매뉴얼' : `${page.title} · 산불현장지휘 매뉴얼`;
    if ((parts[0] || '') !== '') { store.last = { hash: location.hash, title: page.title }; save(); }
    if (ui.lastPath !== path) { window.scrollTo(0, 0); ui.lastPath = path; }
    if (page.after) page.after();
  }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

  // 확인창: 브라우저 confirm()은 Artifact 같은 샌드박스 iframe에서 조용히 false를 돌려주므로 직접 그린다
  function askConfirm({ title, body, ok }, onOk) {
    let root = document.getElementById('dialog-root');
    if (!root) { root = document.createElement('div'); root.id = 'dialog-root'; document.body.appendChild(root); }
    ui.dialog = { onOk, returnFocus: document.activeElement };
    root.innerHTML = `
      <div class="sheet-backdrop dialog-backdrop" data-act="dialog-backdrop">
        <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-body">
          <h2 id="dlg-title">${esc(title)}</h2>
          <p id="dlg-body">${esc(body)}</p>
          <div class="dialog-actions">
            <button type="button" class="btn" data-act="dialog-cancel">취소</button>
            <button type="button" class="btn fire" data-act="dialog-ok">${esc(ok)}</button>
          </div>
        </div>
      </div>`;
    root.querySelector('[data-act="dialog-cancel"]').focus({ preventScroll: true });
  }
  function closeDialog() {
    const root = document.getElementById('dialog-root');
    if (root) root.innerHTML = '';
    const back = ui.dialog?.returnFocus;
    ui.dialog = null;
    if (back && document.contains(back)) back.focus({ preventScroll: true });
  }

  function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }

  // ── 상태 변경 ─────────────────────────────────────
  function setBind(bind, value) {
    const I = rec();
    if (!I) return;
    const [a, b] = bind.split('.');
    if (b === undefined) I.inputs[a] = value;
    else I.inputs[a][b] = value;
    save();
  }

  document.addEventListener('click', e => {
    const anchorLink = e.target.closest('a[data-anchor]');
    if (anchorLink) { ui.pendingAnchor = anchorLink.dataset.anchor; }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const d = el.dataset;
    switch (act) {
      case 'art': e.preventDefault(); openArticle(d.id); break;
      case 'ref': {
        e.preventDefault();
        const step = location.hash.match(/^#\/respond\/([\w-]+)/);
        if (ui.sheet) closeSheet();
        location.hash = `#/refs/${d.id}${step ? '?from=' + step[1] : ''}`;
        break;
      }
      case 'sheet-close': closeSheet(); break;
      case 'sheet-close-nav': ui.sheet = null; renderSheet(); break;
      case 'sheet-backdrop': if (e.target === el) closeSheet(); break;
      case 'sheet-tab': ui.sheet.tab = +d.i; renderSheet(); break;
      case 'fav': {
        const k = d.key;
        store.favs = isFav(k) ? store.favs.filter(x => x !== k) : [...store.favs, k];
        save();
        el.setAttribute('aria-pressed', isFav(k));
        toast(isFav(k) ? '즐겨찾기에 추가했습니다' : '즐겨찾기에서 뺐습니다');
        break;
      }
      case 'onboard-hide': store.onboardSeen = true; save(); render(); break;
      case 'onboard-show': store.onboardSeen = false; save(); location.hash = '#/'; render(); break;
      case 'check': {
        const cur = store.checklist[d.id];
        store.checklist[d.id] = cur?.done ? { done: false } : { done: true, at: Date.now() };
        save(); rerenderKeepScroll();
        break;
      }
      case 'dialog-ok': { const fn = ui.dialog?.onOk; closeDialog(); if (fn) fn(); break; }
      case 'dialog-cancel': closeDialog(); break;
      case 'dialog-backdrop': if (e.target === el) closeDialog(); break;
      case 'check-reset':
        askConfirm({ title: '체크 전체 초기화', body: '예방 체크리스트의 완료 표시를 모두 지웁니다.', ok: '초기화' }, () => {
          store.checklist = {}; save(); rerenderKeepScroll(); toast('체크를 초기화했습니다');
        });
        break;
      case 'incident-start': {
        // 열람 중 선택·입력한 값은 새 기록으로 옮긴다
        const viewed = ui.view;
        startIncident(d.mode, location.hash);
        if (viewed) { inc().choice = viewed.choice; inc().inputs = viewed.inputs; save(); }
        const target = '#/respond/' + (d.step || 'report');
        if (location.hash === target) render(); else location.hash = target;
        break;
      }
      case 'undo-start': {
        const back = ui.undo?.returnHash;
        store.incident = null; ui.undo = null; save(); renderUndo();
        toast('취소했습니다 · 대응 기록을 지웠습니다');
        const target = back && back !== '#/respond/start' ? back : '#/';
        if (location.hash === target) render(); else location.hash = target;
        break;
      }
      case 'incident-end':
        askConfirm({
          title: `${inc()?.mode === 'drill' ? '훈련' : '대응'} 기록 종료`,
          body: '입력값·체크·시각이 모두 지워지고 평시로 돌아갑니다. 필요한 내용은 10단계의 보고 초안을 먼저 복사해 두세요.',
          ok: '기록 지우고 종료',
        }, () => {
          store.incident = null; ui.undo = null; save(); renderUndo();
          go('#/'); toast('대응 기록을 종료했습니다');
        });
        break;
      case 'choice': rec().choice[d.step] = d.id; save(); rerenderKeepScroll(); break;
      case 'step-check': {
        const c = rec().checks[d.step] = rec().checks[d.step] || {};
        if (c[d.id]) delete c[d.id]; else c[d.id] = Date.now();
        save(); rerenderKeepScroll();
        break;
      }
      case 'alert-check': {
        const I = rec();
        const c = I.inputs.alertChecks[I.inputs.alert] = I.inputs.alertChecks[I.inputs.alert] || {};
        if (c[d.i]) delete c[d.i]; else c[d.i] = Date.now();
        save(); rerenderKeepScroll();
        break;
      }
      case 'step-done': {
        const I = rec();
        if (I.done[d.step]) { delete I.done[d.step]; save(); rerenderKeepScroll(); break; }
        I.done[d.step] = Date.now(); save();
        const i = C.STEPS.findIndex(s => s.id === d.step);
        const next = C.STEPS[i + 1];
        if (next) { toast(`${i + 1}단계 완료 · 다음 단계로 이동`); location.hash = '#/respond/' + next.id; }
        else rerenderKeepScroll();
        break;
      }
      case 'seg': setBind(d.bind, d.value); rerenderKeepScroll(); break;
      case 'agency': {
        const ag = rec().inputs.agencies;
        if (ag[d.no]?.at) delete ag[d.no]; else ag[d.no] = { at: Date.now() };
        save(); rerenderKeepScroll();
        break;
      }
      case 'copy': {
        const ta = document.getElementById(d.target);
        const done = () => toast('복사했습니다');
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand('copy'); done(); });
        else { ta.select(); document.execCommand('copy'); done(); }
        break;
      }
      case 'date-reset': store.dateOverride = ''; save(); searchIndex = null; render(); toast('기준일을 오늘로 되돌렸습니다'); break;
      case 'law-del': store.customLaws.splice(+d.i, 1); save(); rerenderKeepScroll(); break;
      case 'install': {
        const p = ui.installPrompt;
        if (!p) break;
        p.prompt();
        p.userChoice.finally(() => { ui.installPrompt = null; rerenderKeepScroll(); });
        break;
      }
    }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (!el.dataset.bind || el.type === 'checkbox' || el.tagName === 'SELECT') return;
    setBind(el.dataset.bind, el.value);
    const [group] = el.dataset.bind.split('.');
    if (group === 'command') { $('#verdict-command').innerHTML = verdictCommand(); const h = $('#cmd-area-hint'); if (h) h.textContent = areaHint(el.value); }
    if (group === 'stage') $('#verdict-stage').innerHTML = verdictStage();
    if (group === 'letter') $('#letter-out').value = letterText();
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.bind && (el.type === 'checkbox' || el.tagName === 'SELECT')) {
      setBind(el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value);
      if (el.tagName === 'SELECT') { $('#letter-out').value = letterText(); return; }
      rerenderKeepScroll();
      return;
    }
    const act = el.dataset.actChange;
    if (act === 'agency-flag') {
      const st = rec().inputs.agencies[el.dataset.no];
      if (st) { st[el.dataset.flag] = el.checked; save(); rerenderKeepScroll(); }
    }
    if (act === 'date-override') {
      store.dateOverride = el.value && el.value !== localIso() ? el.value : '';
      save(); searchIndex = null; render();
      toast(store.dateOverride ? `기준일을 ${fmt(store.dateOverride)}로 가정합니다` : '기준일을 오늘로 되돌렸습니다');
    }
  });

  document.addEventListener('submit', e => {
    const form = e.target;
    if (form.dataset.form === 'search') {
      e.preventDefault();
      const v = new FormData(form).get('q').toString().trim();
      location.hash = '#/search?q=' + encodeURIComponent(v);
    }
    if (form.dataset.form === 'law-add') {
      e.preventDefault();
      const f = new FormData(form);
      const name = f.get('name').toString().trim();
      if (!name) return;
      store.customLaws.push({ name, meta: f.get('meta').toString().trim(), memo: f.get('memo').toString().trim() });
      save(); rerenderKeepScroll(); toast('근거법령 목록에 추가했습니다');
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.dialog) { closeDialog(); return; }
    if (e.key === 'Escape' && ui.sheet) closeSheet();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('a.xref')) { e.preventDefault(); openArticle(e.target.dataset.id); }
  });

  window.addEventListener('hashchange', e => {
    ui.prevHash = new URL(e.oldURL).hash || '#/';
    if (ui.sheet) { ui.sheet = null; renderSheet(); }
    render();
    if (ui.pendingAnchor) {
      const t = document.getElementById(ui.pendingAnchor);
      ui.pendingAnchor = null;
      if (t) t.scrollIntoView({ block: 'center' });
    }
  });

  setInterval(() => {
    document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = elapsed(+el.dataset.elapsed); });
  }, 20000);

  render();
})();
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
</body>
</html>
