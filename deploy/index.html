안전조치를 명령할 때에는 다음 각 호의 사항이 적힌 안전조치 명령서를 해당 토지의 소유자ㆍ점유자 또는 관리인에게 발급해야 한다.\n1. 현지점검의 결과\n2. 안전조치를 명령하는 이유\n3. 안전조치를 해야 하는 사항\n4. 안전조치의 방법\n5. 안전조치의 기한\n6. 안전조치를 한 후 산림재난방지기관에 통보해야 하는 사항"}]},{"id":"D-16","law":"D","no":"16","label":"제16조","title":"산사태취약지역의 토지 등 매수ㆍ교환","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태취약지역의 토지 등 매수ㆍ교환","body":"법 제26조제1항에서 “산사태취약지역과 연접한 토지 등 대통령령으로 정하는 산사태취약지역 인근의 토지”란 다음 각 호의 어느 하나에 해당하는 토지를 말한다.\n1. 산사태취약지역과 연접한 토지\n2. 산사태취약지역으로 둘러싸여 있는 토지"}]},{"id":"D-17","law":"D","no":"17","label":"제17조","title":"중앙산림병해충예찰ㆍ방제대책본부의 설치ㆍ운영","chapter":"제3장 산림재난 예방","section":"제3절 산림병해충 예찰","versions":[{"from":"2026-02-01","title":"중앙산림병해충예찰ㆍ방제대책본부의 설치ㆍ운영","body":"① 법 제27조제1항에 따른 중앙산림병해충예찰ㆍ방제대책본부의 장을 보좌하기 위하여 부본부장을 두며, 부본부장은 산림청 차장이 된다.\n② 중앙산림병해충예찰ㆍ방제대책본부의 장은 산림병해충 방제대책을 총괄하고, 산림병해충 예찰(산림병해충이 발생할 우려가 있거나 발생한 지역에 대하여 발생 여부, 발생 정도, 피해 상황 등을 조사하거나 진단하는 모든 활동을 말한다. 이하 같다), 확산 방지 및 산림병해충 피해목(被害木)의 제거ㆍ처리 등을 위하여 부문별로 실무대책반을 설치ㆍ운영할 수 있다.\n③ 중앙산림병해충예찰ㆍ방제대책본부는 다음 각 호의 임무를 수행한다.\n1. 시행계획에 따른 세부 계획 수립\n2. 지역별 산림병해충 방제사업 지원\n3. 산림병해충 방제사업에 대한 주기적 점검 및 지도\n4. 관계 중앙행정기관과의 협조체계 구축\n5. 산림병해충 방제와 관련된 대국민 홍보\n6. 산림병해충 피해목 발견을 위한 전국 예찰계획 추진\n7. 그 밖에 전국 단위 산림병해충 방제사업에 관한 사항\n④ 중앙산림병해충예찰ㆍ방제대책본부의 운영기간은 매년 6월 1일부터 8월 31일까지로 한다. 다만, 중앙산림병해충예찰ㆍ방제대책본부의 장은 산림병해충의 발생 상황에 따라 그 기간을 변경할 수 있다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 중앙산림병해충예찰ㆍ방제대책본부의 구성 및 운영에 필요한 사항은 중앙산림병해충예찰ㆍ방제대책본부의 장이 정한다."}]},{"id":"D-18","law":"D","no":"18","label":"제18조","title":"지역산림병해충예찰ㆍ방제대책본부의 설치ㆍ운영","chapter":"제3장 산림재난 예방","section":"제3절 산림병해충 예찰","versions":[{"from":"2026-02-01","title":"지역산림병해충예찰ㆍ방제대책본부의 설치ㆍ운영","body":"① 법 제27조제2항에 따른 지역산림병해충예찰ㆍ방제대책본부의 장을 보좌하기 위하여 부본부장을 두되, 지역산림병해충예찰ㆍ방제대책본부의 장이 다음 각 호의 사람 중에서 지정하는 사람이 된다.\n1. 해당 지방자치단체의 부단체장\n2. 지방산림청의 과장급 직위의 공무원\n② 지역산림병해충예찰ㆍ방제대책본부의 장은 산림재난방지유관기관의 장으로 구성되는 산림병해충 방제 지역협의회를 운영하고, 산림병해충의 방제사업을 총괄하며, 지역주민에 대한 홍보와 산림병해충 예찰, 확산 방지 및 산림병해충 피해목의 제거ㆍ처리 등을 위하여 부문별로 실무대책반을 설치ㆍ운영할 수 있다.\n③ 지역산림병해충예찰ㆍ방제대책본부는 다음 각 호의 임무를 수행한다.\n1. 지역시행계획에 따른 세부 계획 수립\n2. 산림재난방지유관기관과의 협조체계 구축\n3. 지역주민에 대한 산림병해충 관련 홍보 및 주민신고제도 운영\n4. 산림병해충 피해목의 방제사업 실시 및 제거목 처리\n5. 산림병해충 피해목 발견을 위한 공동예찰ㆍ진단\n6. 안전사고 예방대책 수립\n7. 그 밖에 지역 단위 산림병해충 방제사업에 관한 사항\n④ 지역산림병해충예찰ㆍ방제대책본부의 운영기간은 매년 6월 1일부터 8월 31일까지로 한다. 다만, 지역산림병해충예찰ㆍ방제대책본부의 장은 산림병해충의 발생 상황에 따라 그 기간을 변경할 수 있다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 지역산림병해충예찰ㆍ방제대책본부의 구성 및 운영에 필요한 사항은 지역산림병해충예찰ㆍ방제대책본부의 장이 정한다."}]},{"id":"D-19","law":"D","no":"19","label":"제19조","title":"산불경보 발령 및 조치","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불경보 발령 및 조치","body":"① 법 제30조제1항에 따른 산불재난 국가위기경보(이하 “산불경보”라 한다)의 발령기준은 별표 1과 같다.\n② 법 제30조제2항에서 “대통령령으로 정하는 산불경보별 조치기준”이란 별표 2의 기준을 말한다.\n③ 법 제30조제1항에 따른 산불경보의 발령을 위하여 국립산림과학원장은 다음 각 호의 사항을 산림청장에게 제공해야 한다.\n1. 법 제14조제1항에 따른 산불위험지수(이하 “산불위험지수”라 한다)\n2. 제21조제1항제2호에 따른 대형 산불의 위험 정도\n④ 제1항부터 제3항까지에서 규정한 사항 외에 산불경보에 필요한 사항은 산림청장이 정한다."}]},{"id":"D-20","law":"D","no":"20","label":"제20조","title":"산불대응 단계 발령","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불대응 단계 발령","body":"법 제32조제1항 전단에서 “산불의 피해 면적, 기상 상태 등 대통령령으로 정하는 기준”이란 별표 3의 기준을 말한다."}]},{"id":"D-21","law":"D","no":"21","label":"제21조","title":"산불 진화 통합지휘","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불 진화 통합지휘","body":"① 법 제34조제1항 본문에 따른 중소형 산불(이하 “중소형 산불”이라 한다) 및 같은 조 제2항 본문에 따른 대형 산불(이하 “대형 산불”이라 한다)의 기준은 다음 각 호와 같다.\n1. 중소형 산불: 산림의 피해면적이 100만제곱미터 미만인 산불\n2. 대형 산불: 산림의 피해면적이 100만제곱미터 이상인 산불\n② 법 제34조제1항에 따라 중소형 산불의 진화를 통합지휘하는 특별자치시장ㆍ특별자치도지사(제주특별자치도지사를 말한다)ㆍ시장ㆍ군수ㆍ구청장 또는 지방산림청장은 그 중소형 산불이 대형 산불로 확산될 때에는 같은 조 제2항 본문에 따라 시ㆍ도지사가 통합지휘할 수 있도록 즉시 시ㆍ도지사에게 그 사실을 알리고 산불의 진화와 관련한 모든 사항을 시ㆍ도지사에게 인계해야 한다.\n③ 법 제34조제2항 단서에 따라 시ㆍ도지사가 한 군데에서 발생한 대형 산불의 진화를 통합지휘하는 중에 관할 지역 중 다른 한 군데 이상에서 대형 산불이 발생한 경우에는 다른 한 군데 이상의 통합지휘권을 시장ㆍ군수ㆍ구청장에게 위임할 수 있다.\n④ 법 제34조제3항 후단에 따라 시ㆍ도지사 또는 산림청장은 산불이 다음 각 호의 어느 하나에 해당하는 경우에는 지리적 여건, 피해 상황 등을 고려하여 시장ㆍ군수ㆍ구청장 또는 시ㆍ도지사에게 해당 산불의 통합지휘권을 위임할 수 있다.\n1. 중소형 산불인 경우\n2. 전국 또는 시ㆍ도에서 동시다발적으로 산불이 발생한 경우\n3. 그 밖에 시ㆍ도지사 또는 산림청장이 효율적인 산불 진화를 위해 통합지휘권을 위임할 필요가 있다고 인정하는 경우\n⑤ 법 제34조제4항에서 “대통령령으로 정하는 기준에 해당하는 산불”이란 다음 각 호의 산불을 말한다.\n1. 「재난 및 안전관리 기본법」 제60조에 따른 특별재난지역 선포 요건을 충족하는 규모의 피해를 발생시킬 가능성이 있는 산불\n2. 그 밖에 산불의 피해 면적, 기상 상태 등을 고려하여 산림청장이 진화를 통합지휘할 필요가 있는 산불"}]},{"id":"D-22","law":"D","no":"22","label":"제22조","title":"협조 요청 등","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"협조 요청 등","body":"① 법 제36조제1항제7호에서 “대통령령으로 정하는 산림재난 관련 기관 및 단체”란 다음 각 호의 기관 및 단체를 말한다.\n1. 「산림조합법」 제2조제2호에 따른 지역조합과 같은 조 제4호에 따른 중앙회\n2. 민간항공기 운영자\n3. 그 밖에 산림보호, 재난대응 또는 자연환경 보전을 목적으로 설립된 기관 및 단체\n② 제1항제2호의 자에게 민간항공기의 지원을 요청한 산불현장 통합지휘본부의 장은 운항비용을 지급하고 손실이 발생할 경우 보상해야 한다.\n③ 법 제36조제1항에 따라 산불현장 통합지휘본부의 장이 같은 항 각 호의 기관 또는 단체의 장에게 산불 진화 등에 필요한 장비 및 인력의 협조를 요청하는 경우에는 요청 목적ㆍ사유, 장비ㆍ인력의 규모, 요청기간 등을 명시한 서면으로 해야 한다. 다만, 긴급한 경우에는 우선 말이나 유선으로 하고, 사후에 서면으로 처리해야 한다.\n④ 법 제36조제1항에 따른 협조를 위하여 발생하는 경비는 산불현장 통합지휘본부의 장이 예산의 범위에서 부담한다.\n⑤ 제3항 및 제4항에서 규정한 사항 외에 산불 진화 협조 요청과 관련된 세부적인 사항은 산림청장이 정한다."}]},{"id":"D-23","law":"D","no":"23","label":"제23조","title":"산불진화단의 구성ㆍ운영","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불진화단의 구성ㆍ운영","body":"① 법 제37조제1항에 따른 산불진화단은 다음 각 호의 기관에 설치할 수 있다.\n1. 산림항공본부 및 산림항공관리소\n2. 지방산림청 및 국유림관리소\n3. 지방자치단체\n② 산불진화단은 산불진화단장 1명을 포함한 10명 내외로 구성하며, 산불진화단장 및 단원은 법 제37조제1항에 따른 공무원 중 산림청장 및 산림재난방지기관의 장이 지명한다.\n③ 산불진화단은 1개의 공중진화대와 2개 또는 3개의 지상진화조로 구성한다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 산불진화단의 구성ㆍ운영에 필요한 사항은 산림청장이 정한다."}]},{"id":"D-24","law":"D","no":"24","label":"제24조","title":"산불예방진화대의 구성ㆍ운영","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불예방진화대의 구성ㆍ운영","body":"① 법 제37조제2항에 따른 산불예방진화대는 1개 조를 10명 내외로 구성한다.\n② 산불예방진화대는 다음 각 호의 임무를 수행한다.\n1. 산불방지 지도 및 산불 요인 사전 제거 등 예방사업\n2. 산불 진화 및 뒷불 감시\n3. 산불 진화 장비의 유지ㆍ관리 등 산불방지와 관련된 업무\n③ 제1항 및 제2항에서 규정한 사항 외에 산불예방진화대의 구성ㆍ운영에 필요한 사항은 산림청장이 정한다."}]},{"id":"D-25","law":"D","no":"25","label":"제25조","title":"산불재난특수진화대의 구성ㆍ운영","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불재난특수진화대의 구성ㆍ운영","body":"① 법 제37조제2항에 따른 산불재난특수진화대는 1개 조를 12명 내외로 구성한다.\n② 산불재난특수진화대는 제24조제2항 각 호의 임무 및 다음 각 호의 임무를 수행한다.\n1. 대형 산불로 확산될 우려가 있는 산불 진화\n2. 접근이 쉽지 않은 지역에서의 산불 진화\n3. 관할 지역 외의 지역에서의 산불 진화 지원\n4. 산불 진화 교육ㆍ대응훈련 및 산불 예방활동\n③ 제1항 및 제2항에서 규정한 사항 외에 산불재난특수진화대의 구성ㆍ운영에 필요한 사항은 산림청장이 정한다."}]},{"id":"D-26","law":"D","no":"26","label":"제26조","title":"산사태 위기경보의 발령 등","chapter":"제4장 산림재난 대응 등","section":"제2절 산사태등 대응","versions":[{"from":"2026-02-01","title":"산사태 위기경보의 발령 등","body":"① 산림청장은 법 제39조제1항에 따른 산사태재난 국가위기경보(이하 “산사태 위기경보”라 한다)를 관심, 주의, 경계, 심각으로 구분하여 발령한다.\n② 산림재난방지기관 및 산림재난방지유관기관의 장은 산사태 위기경보가 발령되면 제1항의 산사태 위기경보 구분에 따라 입산 통제, 대피명령, 비상연락망 정비, 산사태취약지역 순찰 및 재난자막방송 등 필요한 조치를 해야 한다.\n③ 제1항 및 제2항에 따른 산사태 위기경보의 발령기준 및 조치기준은 별표 4와 같다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 산사태 위기경보의 발령기준 및 조치 등에 필요한 사항은 산림청장이 정한다."}]},{"id":"D-27","law":"D","no":"27","label":"제27조","title":"산사태등 긴급점검 대상","chapter":"제4장 산림재난 대응 등","section":"제2절 산사태등 대응","versions":[{"from":"2026-02-01","title":"산사태등 긴급점검 대상","body":"① 법 제40조제1항 전단에서 “대통령령으로 정하는 시설 및 지역”이란 다음 각 호의 시설 및 지역을 말한다.\n1. 산림청장 또는 산림재난방지기관의 장이 산사태등의 발생 우려 또는 발생에 대응하기 위해 산사태등 긴급점검(이하 이 조에서 “긴급점검”이라 한다)이 필요하다고 인정하는 시설 및 지역\n2. 관계 중앙행정기관(「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관을 포함한다. 이하 이 조에서 “관계 행정기관등”이라 한다)이 산사태등의 발생 우려 또는 발생에 대응하기 위해 긴급점검이 필요하다고 인정하는 시설 및 지역\n② 관계 행정기관등은 긴급점검을 실시할 때에는 미리 긴급점검 대상 시설 또는 지역의 관계인에게 긴급점검의 목적ㆍ날짜 등을 서면으로 통지해야 한다. 다만, 서면 통지로는 긴급점검의 목적을 달성할 수 없는 경우에는 말이나 유선으로 통지할 수 있다.\n③ 산림청장 또는 산림재난방지기관의 장은 긴급점검 대상 시설 및 지역이 국가안전보장과 관련된 경우 국가정보원장에게 긴급점검의 실시와 관련하여 협조를 요청할 수 있다.\n④ 법 제40조제4항에 따라 관계 행정기관등의 장은 긴급점검을 종료한 날부터 15일 이내에 그 결과를 산림청장 또는 산림재난방지기관의 장에게 서면으로 통보해야 한다."}]},{"id":"D-28","law":"D","no":"28","label":"제28조","title":"산림병해충 방제비용 지원","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 방제비용 지원","body":"① 법 제43조제6항에 따라 산림재난방지기관의 장은 같은 조 제1항에 따른 조치 명령을 이행한 산림소유자등(산림에 있는 식물과 산림이 아닌 지역에 있는 수목의 소유자ㆍ점유자ㆍ관리인, 판매자 또는 산림사업 종사자 등을 말한다)이 그 명령 이행을 위해 사용한 농약대금, 인건비 등이 있으면 예산의 범위에서 지원할 수 있다.\n② 제1항에 따른 비용 지원의 기준 및 방법 등 필요한 사항은 산림청장이 정하여 고시한다."}]},{"id":"D-29","law":"D","no":"29","label":"제29조","title":"방제사업 설계ㆍ감리","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"방제사업 설계ㆍ감리","body":"① 법 제45조제1항에서 “대통령령으로 정하는 규모의 방제사업”이란 사업 대상 면적이 1백만제곱미터 이상인 산림병해충 방제사업을 말한다.\n② 산림재난방지기관의 장은 산림병해충 발생 및 확산 가능성이 높아 방제사업이 중요하다고 인정하는 지역에서 방제사업을 하려는 경우 설계ㆍ감리 실시를 고려해야 한다.\n③ 법 제45조제2항제3호에서 “대통령령으로 정하는 자”란 다음 각 호의 자를 말한다.\n1. 「산림보호법」 제21조의9제1항 및 같은 법 시행령 별표 1의6에 따른 1종 나무병원\n2. 「산림조합법」 제2조제2호에 따른 지역조합 또는 같은 조 제4호에 따른 중앙회"}]},{"id":"D-30","law":"D","no":"30","label":"제30조","title":"산림병해충 특별방제구역에서 필요한 조치사항","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 특별방제구역에서 필요한 조치사항","body":"법 제46조제4항에 따라 산림재난방지기관의 장이 산림병해충 특별방제구역에서 신속하게 예찰ㆍ방제하기 위하여 할 수 있는 조치는 다음 각 호와 같다.\n1. 산림병해충에 감염된 나무를 긴급하게 베어내는 조치\n2. 제1호에 따라 베어낸 나무의 반출을 금지하는 조치. 이 경우 그 사실을 산림소유자에게 지체 없이 알려야 한다.\n3. 지역산림병해충예찰ㆍ방제대책본부의 설치ㆍ운영(제18조제4항에 따른 운영기간이 아닌 경우로 한정한다)"}]},{"id":"D-31","law":"D","no":"31","label":"제31조","title":"산림병해충예찰방제단의 구성ㆍ운영","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충예찰방제단의 구성ㆍ운영","body":"① 법 제47조제2항에 따른 산림병해충예찰방제단은 1개 단을 4명으로 구성한다. 다만, 지역 여건에 따라 3명 이상 5명 이하로 구성할 수 있다.\n② 산림병해충예찰방제단은 다음 각 호의 임무를 수행한다.\n1. 소나무재선충병의 발생 예찰ㆍ조사 및 방제\n2. 참나무시들음병, 솔껍질깍지벌레, 솔잎혹파리, 돌발해충 등 각종 산림병해충의 발생 예찰ㆍ조사 및 방제\n3. 산림병해충 도급사업의 현장지도 및 준공검사 보조\n4. 산림병해충 방제 산물의 수집ㆍ반출ㆍ가공\n③ 제1항 및 제2항에서 규정한 사항 외에 산림병해충예찰방제단의 구성ㆍ운영에 필요한 사항은 산림청장이 정한다."}]},{"id":"D-32","law":"D","no":"32","label":"제32조","title":"산불 조사의 범위 및 내용 등","chapter":"제5장 산림재난 조사 및 복구","section":"제1절 산불 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산불 조사의 범위 및 내용 등","body":"① 법 제48조제1항에 따른 산불조사(이하 “산불 조사”라 한다)의 범위는 다음 각 호와 같다.\n1. 산불의 발화 원인, 발화 지점, 확산 경로 등에 대한 조사\n2. 산불로 인한 사상자 및 재산피해 등에 대한 조사\n3. 산불 관련 법 위반자를 검거하기 위한 증거 조사\n② 산불 조사는 기상 여건 등 불가피한 경우를 제외하고는 산불이 발생한 날 또는 진화된 날에 실시하는 것을 원칙으로 한다.\n③ 산불 조사는 다음 각 호의 순서에 따라서 실시한다.\n1. 산불피해지 현장조사 일정 등 계획 수립\n2. 발화 지점 보존지역 확인\n3. 현장 관찰 및 기록\n4. 증거물 수집ㆍ채취\n5. 조사보고서 작성\n④ 제1항부터 제3항까지에서 규정한 사항 외에 산불 조사의 범위 및 내용과 절차에 관하여 필요한 세부 사항은 산림청장이 정한다."}]},{"id":"D-33","law":"D","no":"33","label":"제33조","title":"산불전문조사반의 구성ㆍ운영","chapter":"제5장 산림재난 조사 및 복구","section":"제1절 산불 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산불전문조사반의 구성ㆍ운영","body":"① 법 제48조제3항에 따른 산불전문조사반은 반장 1명을 포함한 5명 내외로 구성하며, 반원은 산림청장 또는 산림재난방지기관의 장이 다음 각 호의 어느 하나에 해당하는 사람 중에서 임명 또는 위촉한다.\n1. 산불 조사ㆍ연구ㆍ교육 분야에서 2년 이상 근무한 경력이 있는 사람\n2. 산림재난 업무에 종사하는 공무원 중 사법(司法) 실무에 3년 이상 근무한 경력이 있는 사람\n3. 산림재난 업무에 3년 이상 근무한 공무원 중 산림교육원에서 1주 이상 산불 관련 전문교육을 이수한 공무원\n4. 국내외의 산불 조사ㆍ감식 관련 기관에서 산불 조사ㆍ감식 전문교육을 이수한 사람\n② 산불전문조사반은 다음 각 호의 임무를 수행한다.\n1. 제32조제1항 각 호의 조사\n2. 산불 조사 장비의 관리ㆍ운영\n3. 그 밖에 산불 조사에 관한 사항\n③ 산불전문조사반은 산불 조사 결과를 산림청장 또는 산림재난방지기관의 장에게 지체 없이 보고해야 한다.\n④ 산림청장 및 산림재난방지기관의 장은 제3항에 따른 보고를 받은 경우 대형 산불 또는 방화에 의한 산불 관련법 위반자를 검거하도록 관할 경찰관서에 요청할 수 있다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 산불전문조사반의 구성ㆍ운영에 필요한 사항은 산림청장이 정한다."}]},{"id":"D-34","law":"D","no":"34","label":"제34조","title":"산불 대응의 분석ㆍ평가","chapter":"제5장 산림재난 조사 및 복구","section":"제1절 산불 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산불 대응의 분석ㆍ평가","body":"① 산림청장은 법 제48조제4항에 따라 산불 발생 시 대응과정을 다음 각 호의 사항을 포함하여 분석ㆍ평가해야 한다.\n1. 산불 대응 시기의 적절성\n2. 산불 대응 수단의 적합성\n3. 시행계획의 적절성\n4. 산불 대응의 준비 및 실행 관련 개선 필요 사항\n5. 그 밖에 산불 대응과정의 분석ㆍ평가를 위하여 필요하다고 산림청장이 인정하는 사항\n② 산림청장은 제1항에 따른 분석ㆍ평가를 위하여 필요한 경우에는 산림재난방지기관의 장 및 산림재난방지유관기관의 장에게 자료의 제출을 요청할 수 있다. 이 경우 요청을 받은 산림재난방지기관의 장 및 산림재난방지유관기관의 장은 특별한 사유가 없으면 그 요청에 따라야 한다.\n③ 산림청장은 제1항에 따른 평가를 효율적으로 시행하기 위하여 산불 전문가로 구성된 평가단을 운영할 수 있다.\n④ 제3항에 따른 평가단의 구성ㆍ운영에 관한 사항은 산림청장이 정한다."}]},{"id":"D-35","law":"D","no":"35","label":"제35조","title":"산사태등 조사의 실시 절차 및 방법","chapter":"제5장 산림재난 조사 및 복구","section":"제2절 산사태등 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산사태등 조사의 실시 절차 및 방법","body":"① 법 제50조제1항에 따른 산사태등의 발생 원인 및 피해 현황 등에 관한 조사(이하 “산사태등 조사”라 한다)는 다음 각 호의 순서에 따라서 실시한다.\n1. 산사태등 조사 일정 등 계획 수립\n2. 산사태등 피해지 현장조사 등 조사\n3. 산사태등 피해 복구계획 등을 포함한 조사보고서 작성\n② 산사태등 조사는 현장조사, 관계인 등에 대한 질문, 자료의 수집 등의 방법으로 실시한다.\n③ 제1항 및 제2항에서 규정한 사항 외에 산사태등 조사의 실시 절차 및 방법에 관하여 필요한 세부 사항은 산림청장이 정한다."}]},{"id":"D-36","law":"D","no":"36","label":"제36조","title":"산사태등 대응의 분석ㆍ평가","chapter":"제5장 산림재난 조사 및 복구","section":"제2절 산사태등 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산사태등 대응의 분석ㆍ평가","body":"① 산림청장은 법 제50조제2항에 따라 산사태등 발생 시 대응과정을 다음 각 호의 사항을 포함하여 분석ㆍ평가해야 한다.\n1. 산사태등 대응 시기의 적절성\n2. 산사태등 대응 수단의 적합성\n3. 시행계획의 적절성\n4. 산사태등 대응의 준비 및 실행 관련 개선 필요 사항\n5. 그 밖에 산사태등 대응과정의 분석ㆍ평가를 위하여 필요하다고 산림청장이 인정하는 사항\n② 산림청장은 제1항에 따른 분석ㆍ평가를 위하여 필요한 경우에는 산림재난방지기관의 장 및 산림재난방지유관기관의 장에게 자료의 제출을 요청할 수 있다. 이 경우 요청을 받은 산림재난방지기관의 장 및 산림재난방지유관기관의 장은 특별한 사유가 없으면 그 요청에 따라야 한다.\n③ 산림청장은 제1항에 따른 평가를 효율적으로 시행하기 위하여 산사태등 전문가로 구성된 평가단을 운영할 수 있다.\n④ 제3항에 따른 평가단의 구성ㆍ운영에 관한 사항은 산림청장이 정한다."}]},{"id":"D-37","law":"D","no":"37","label":"제37조","title":"산사태등 피해 복구 등","chapter":"제5장 산림재난 조사 및 복구","section":"제2절 산사태등 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산사태등 피해 복구 등","body":"① 산림청장 또는 산림재난방지기관의 장은 법 제51조제1항에 따라 산사태등으로 피해가 발생한 산림재난피해지를 복구하려는 경우 해당 토지의 소유자ㆍ점유자 또는 관리인에게 다음 각 호의 내용이 포함된 산사태등 피해 복구계획을 서면으로 통지해야 한다.\n1. 산사태등 피해 복구 기간 및 방법\n2. 산사태등 피해 현황 및 복구 필요성\n3. 산사태등 피해 복구 대상 토지의 면적\n4. 그 밖에 산사태등 피해 복구에 필요한 사항\n② 법 제51조제2항제2호에서 “대통령령으로 정하는 정당한 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n1. 토지의 소유자ㆍ점유자 또는 관리인이 복구를 이미 시행한 경우\n2. 피해가 자연적으로 복구되어 복구할 필요성이 적은 경우\n3. 그 밖에 산사태등 피해 복구의 필요성이 적다고 산림청장 또는 산림재난방지기관의 장이 인정하는 경우"}]},{"id":"D-38","law":"D","no":"38","label":"제38조","title":"산림병해충 대응의 분석ㆍ평가","chapter":"제5장 산림재난 조사 및 복구","section":"제3절 산림병해충 조사","versions":[{"from":"2026-02-01","title":"산림병해충 대응의 분석ㆍ평가","body":"① 산림청장은 법 제52조제2항에 따라 산림병해충이 발생한 지역의 산림병해충 대응과정을 다음 각 호의 사항을 포함하여 분석ㆍ평가해야 한다.\n1. 산림병해충 대응 시기의 적절성\n2. 산림병해충 대응 수단의 적합성\n3. 시행계획의 적절성\n4. 산림병해충 대응의 준비 및 실행 관련 개선 필요 사항\n5. 그 밖에 산림병해충 대응과정의 분석ㆍ평가를 위하여 필요하다고 산림청장이 인정하는 사항\n② 산림청장은 제1항에 따른 분석ㆍ평가를 위하여 필요한 경우에는 산림재난방지기관의 장과 산림재난방지유관기관의 장에게 자료의 제출을 요청할 수 있다. 이 경우 요청을 받은 산림재난방지기관의 장과 산림재난방지유관기관의 장은 특별한 사유가 없으면 그 요청에 따라야 한다.\n③ 제1항 및 제2항에서 규정한 사항 외에 산림병해충 대응과정의 분석ㆍ평가에 필요한 세부 사항은 산림청장이 정 한다."}]},{"id":"D-39","law":"D","no":"39","label":"제39조","title":"산악기상관측망 구축ㆍ운영","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"산악기상관측망 구축ㆍ운영","body":"① 산림청장은 법 제54조제1항에 따른 산악기상관측망(이하 “산악기상관측망”이라 한다)을 구축할 때에는 다음 각 호의 사항을 고려해야 한다.\n1. 산지 접근성\n2. 산림재난 위험성\n3. 다른 기상관측시설과의 중복성\n4. 그 밖에 산악기상관측망 구축에 필요하다고 산림청장이 인정하는 사항\n② 산림청장은 산악기상관측망을 설치하려는 장소가 다음 각 호의 어느 하나에 해당하는 경우에는 관계 중앙행정기관 또는 지방자치단체의 장에게 산악기상관측망의 설치를 위한 협조를 요청할 수 있다.\n1. 「개발제한구역의 지정 및 관리에 관한 특별조치법」 제3조에 따라 지정된 개발제한구역\n2. 「군사기지 및 군사시설 보호법」 제2조제6호에 따른 군사기지 및 군사시설 보호구역\n3. 「도시공원 및 녹지 등에 관한 법률」 제2조제5호에 따른 녹지\n4. 「산림보호법」 제7조제1항에 따라 지정된 산림보호구역\n5. 「산지관리법」 제4조제1항제1호에 따른 보전산지\n6. 「자연공원법」 제18조제1항제1호에 따른 공원자연보존지구\n7. 「자연환경보전법」 제12조에 따라 지정된 생태ㆍ경관보전지역\n③ 관계 중앙행정기관 또는 지방자치단체의 장은 제2항에 따라 협조를 요청받은 경우에는 특별한 사유가 없으면 협 조해야 한다.\n④ 산림청장은 산악기상관측망이 최적의 기상관측환경을 확보ㆍ유지할 수 있도록 필요한 시책을 마련하고 추진해야 한다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 산악기상관측망 구축 내용ㆍ방법 및 운영에 관한 세부 사항은 기상관측표준화에 관한 법령을 준용한다."}]},{"id":"D-40","law":"D","no":"40","label":"제40조","title":"산림재난방지 국제협력사업의 경비 지원 등","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 국제협력사업의 경비 지원 등","body":"① 법 제57조제4항 후단에 따라 산림재난과 관련한 국제협력 사업의 경비를 지원받으려는 자는 다음 각 호의 사항이 포함된 사업계획서를 작성하여 산림청장 또는 지방자치단체의 장에게 제출해야 한다.\n1. 사업의 개요 및 내용\n2. 사업의 필요경비 산출 명세\n3. 사업의 활용계획\n② 산림청장 또는 지방자치단체의 장은 제1항에 따라 사업계획서를 제출받은 경우에는 그 타당성을 심사한 후 결과를 신청인에게 알려야 한다.\n③ 법 제57조제5항 전단에서 “대통령령으로 정하는 기관”이란 다음 각 호의 기관을 말한다.\n1. 「고등교육법」 제2조제1호에 따른 대학\n2. 국립ㆍ공립 연구기관\n3. 한국산림재난안전기술공단\n4. 산림재난 관련 기업 또는 단체의 연구기관"}]},{"id":"D-41","law":"D","no":"41","label":"제41조","title":"한국산림재난안전기술공단의 설립","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"한국산림재난안전기술공단의 설립","body":"법 제58조제1항에 따른 한국산림재난안전기술공단(이하 “공단”이라 한다)의 설립등기에는 다음 각 호의 사항이 포함되어야 한다.\n1. 목적\n2. 명칭\n3. 주된 사무소의 소재지\n4. 임원의 성명 및 주소\n5. 자산의 총액"}]},{"id":"D-42","law":"D","no":"42","label":"제42조","title":"정관","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"정관","body":"법 제59조제1항제11호에서 “대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다.\n1. 조직 구성 및 운영에 관한 사항\n2. 해산에 관한 사항\n3. 그 밖에 공단의 운영에 관한 중요 사항"}]},{"id":"D-43","law":"D","no":"43","label":"제43조","title":"지도ㆍ감독","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"지도ㆍ감독","body":"① 법 제65조제1항제3호에서 “대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다.\n1. 경영지침의 이행에 관한 사항\n2. 연간 사업실적 및 결산에 관한 사항\n② 산림청장은 법 제65조에 따라 공단을 지도ㆍ감독하기 위하여 관련된 자료의 제출을 명하거나 소속 공무원으로 하여금 현지를 확인하거나 관계인에게 질문을 하도록 할 수 있다.\n③ 산림청장은 제2항에 따른 지도ㆍ감독 결과에 따라 필요한 경우 공단의 운영 등과 관련한 명령을 할 수 있다.\n④ 공단은 제3항에 따른 명령을 받은 경우 그 명령을 이행하고 그 결과를 산림청장에게 보고해야 한다."}]},{"id":"D-44","law":"D","no":"44","label":"제44조","title":"사상자에 대한 보상금 지급기준 등","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"사상자에 대한 보상금 지급기준 등","body":"① 산림청장 또는 산림재난방지기관의 장은 법 제67조에 따라 산림재난방지 또는 인명구조작업으로 발생한 사망 또는 부상에 대해 별표 5에 따라 요양보상ㆍ장애보상ㆍ장례보상 또는 유족보상을 할 수 있다.\n② 제1항에 따른 보상을 받으려는 사람은 다음 각 호의 기한 내에 농림축산식품부령으로 정하는 바에 따라 보상을 청구해야 한다.\n1. 요양보상: 재해를 입은 날부터 180일까지\n2. 장애보상: 장애 진단을 받은 날부터 180일까지\n3. 장례 또는 유족보상: 사망한 날부터 180일까지\n③ 산림청장 또는 산림재난방지기관의 장은 제2항에 따른 보상 청구를 받으면 별표 5의 기준에 따른 지급 대상인지를 확인하고 그 지급기준에 따라 보상금을 지급한다. 다만, 다른 법령에 따라 보상금을 지급받은 사람에 대해서는그 보상금에 상당하는 금액을 제외하고 보상금을 지급할 수 있다."}]},{"id":"D-45","law":"D","no":"45","label":"제45조","title":"포상금의 지급","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"포상금의 지급","body":"① 법 제69조에 따른 포상금은 다음 각 호의 범위에서 지급한다.\n1. 법 제69조제1호에 따른 포상금: 500만원\n2. 법 제69조제2호 및 제3호에 따른 포상금: 200만원\n3. 법 제69조제4호에 따른 포상금: 100만원\n② 제1항에서 규정한 사항 외에 포상금 지급의 세부 기준ㆍ방법 및 절차 등에 관하여 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"D-46","law":"D","no":"46","label":"제46조","title":"영상정보처리기기의 연계ㆍ통합 활용 대상 기관","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"영상정보처리기기의 연계ㆍ통합 활용 대상 기관","body":"법 제71조제2항제9호에서 “대통령령으로 정하는 기관”이란 다음 각 호의 기관을 말한다.\n1. 「한국도로교통공단법」에 따른 한국도로교통공단\n2. 「한국수자원공사법」에 따른 한국수자원공사\n3. 「한국전력공사법」에 따른 한국전력공사\n4. 그 밖에 산림재난방지 및 산림의 보호를 위하여 산림청장이 영상정보처리기기의 연계ㆍ통합이 필요하다고 인정하는 공공기관"}]},{"id":"D-47","law":"D","no":"47","label":"제47조","title":"권한 등 위임 및 위탁","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"권한 등 위임 및 위탁","body":"① 법 제73조제1항에 따라 다음 각 호의 산림청장의 권한은 지방산림청장에게 위임한다.\n1. 법 제49조제1항에 따른 산불로 피해가 발생한 산림재난피해지의 복구\n2. 법 제51조제1항에 따른 산사태등으로 피해가 발생한 산림재난피해지의 복구\n② 법 제73조제1항에 따라 다음 각 호의 산림청장의 권한은 국립산림과학원장에게 위임한다.\n1. 법 제9조제1항에 따른 산림재난 위험도평가 실시\n2. 법 제9조제2항에 따른 산림재난 위험지도 제작\n3. 법 제11조제1항에 따른 산림재난정보시스템의 구축ㆍ운영\n4. 법 제11조제2항 전단에 따른 자료 제출 요청\n5. 법 제14조제1항에 따른 산불위험지수 계산\n6. 법 제54조제2항에 따른 산악기상관측망 구축ㆍ운영 등에 관한 기본계획의 수립ㆍ시행\n③ 법 제73조제2항에 따라 다음 각 호의 시ㆍ도지사의 권한은 시장(「제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법」에 따른 행정시장을 포함한다)ㆍ군수ㆍ구청장에게 위임한다.\n1. 법 제21조제2항에 따른 산사태등 발생 우려지역 실태조사 실시\n2. 법 제25조제2항에 따른 산사태취약지역 및 대피소 현지점검 실시\n④ 법 제73조제3항에 따라 다음 각 호의 지방산림청장의 권한은 국유림관리소장에게 위임한다.\n1. 법 제18조제2항제1호에 따른 산림 또는 산림인접지역에서 불을 피우거나 불을 가지고 들어가는 행위에 대한 허가\n2. 법 제18조제4항에 따른 산림에 들어가는 사람이 화기, 인화 물질 및 발화 물질 등을 지니는 것에 대한 금지 조치\n3. 법 제20조제2항에 따른 산사태등 예방에 필요한 조치\n4. 법 제34조제1항에 따른 중소형 산불 진화의 통합지휘\n5. 위임된 사항에 관한 법 제79조에 따른 과태료의 부과ㆍ징수\n⑤ 법 제73조제4항에 따라 같은 항 각 호의 산림청장 또는 산림재난방지기관의 장의 업무(같은 항 제1호의 업무 중시ㆍ도지사의 업무는 제외한다)는 공단에 위탁한다."}]},{"id":"D-48","law":"D","no":"48","label":"제48조","title":"징계 요구 통보 등","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"징계 요구 통보 등","body":"① 법 제74조제1항 전단에 따른 통보는 징계 등 요구의 대상자, 대상 행위 및 이유 등을 구 체적으로 명시한 서면으로 해야 한다.\n② 법 제74조제1항에 따라 징계 등의 요구를 통보받은 기관의 장은 자체조사를 실시하여 징계 등 적절한 조치를 하고, 징계 등의 요구를 통보받은 날부터 60일 이내에 징계 등을 요구한 산림청장 및 산림재난방지기관의 장에게 조 치내용을 알려야 한다. 다만, 자체조사가 완료되지 않는 등 특별한 사유가 있는 경우에는 30일을 넘지 않는 범위에서 그 기간을 연장할 수 있다.\n③ 법 제74조제3항에 따라 사실의 증명에 필요한 조사를 하는 공무원은 관련 자료를 제출하게 하거나 관련 공무원 또는 직원과 면담을 할 수 있다."}]},{"id":"D-49","law":"D","no":"49","label":"제49조","title":"과태료의 부과기준","chapter":"제9장 벌칙","section":"","versions":[{"from":"2026-02-01","title":"과태료의 부과기준","body":"법 제79조제1항부터 제4항까지의 규정에 따른 과태료의 부과기준은 별표 6과 같다."}]},{"id":"R-1","law":"R","no":"1","label":"제1조","title":"목적","chapter":"제1장 총칙","section":"","versions":[{"from":"2026-02-01","title":"목적","body":"이 규칙은 「산림재난방지법」 및 같은 법 시행령에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다."}]},{"id":"R-2","law":"R","no":"2","label":"제2조","title":"산림재난 위험도평가ㆍ위험지도 제작","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난 위험도평가ㆍ위험지도 제작","body":"① 「산림재난방지법」(이하 “법”이라 한다) 제9조제1항에 따른 산림재난 위험도평가는 법 제4조에 따른 장소 또는 대상에 대하여 실시해야 한다.\n② 산림재난 위험도평가는 다음 각 호의 사항을 고려하여 실시해야 한다.\n1. 산림재난 발생 요인\n2. 산림재난 확산 요인\n3. 산림의 생태 구조\n4. 건축물 등 산림재난으로 인해 피해가 우려되는 대상\n5. 산림재난방지에 영향을 미치는 도로(「산림자원의 조성 및 관리에 관한 법률」 제2조제1호라목에 따른 임도를 포함한다), 사방시설 등 재난관리자원 등에 관한 사항\n6. 국가유산, 원자력발전소 등 중요 시설에 관한 사항\n7. 산림재난에 영향을 미치는 기후 변화와 관련된 사항\n8. 그 밖에 산림재난 위험도평가를 위하여 필요하다고 국립산림과학원장이 인정하는 사항\n③ 산림재난 위험지도는 지역별 산림재난 위험 등급 및 위험구역이 표시되도록 제작해야 한다.\n④ 산림청장은 법 제9조제2항에 따라 산림재난 위험지도를 전자파일 형태로 산림재난방지기관의 장 및 산림재난방지유관기관의 장에게 배포해야 한다. 다만, 법 제11조에 따른 산림재난정보시스템에 산림재난 위험지도를 게재하는 것으로 산림재난 위험지도 배포를 갈음할 수 있다.\n⑤ 제3항 및 제4항에서 규정한 사항 외에 산림재난 위험지도 제작의 방법ㆍ내용 및 절차 등에 관하여 필요한 사항은 산림청장이 정한다."}]},{"id":"R-3","law":"R","no":"3","label":"제3조","title":"건축신고 등의 검토","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"건축신고 등의 검토","body":"「산림재난방지법 시행령」(이하 “영”이라 한다) 제6조제1항에서 “농림축산식품부령으로 정하는 서류”란 다음 각 호의 서류를 말한다.\n1. 「건축법 시행규칙」 제6조에 따른 건축ㆍ대수선ㆍ용도변경 (변경)허가 신청서 사본 또는 같은 규칙 제12조에 따른 건축ㆍ대수선ㆍ용도변경 (변경)신고서 사본\n2. 그 밖에 산림재난방지를 위하여 검토가 필요하다고 산림청장이 인정하는 서류"}]},{"id":"R-4","law":"R","no":"4","label":"제4조","title":"산림재난 관련 정보","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난 관련 정보","body":"법 제11조제1항제5호에서 “농림축산식품부령으로 정하는 산림재난 관련 정보”란 다음 각 호의 정보를 말한다.\n1. 법 제54조제1항에 따른 산악기상관측망의 수집 정보\n2. 「산림자원의 조성 및 관리에 관한 법률」 제33조의2에 따른 산림위성 관측망의 수집 정보\n3. 산림재난피해지 현황 정보\n4. 산림재난피해지 복구 관련 정보\n5. 산림 수계 및 유역 정보\n6. 그 밖에 산림재난과 관련하여 산림청장이 필요하다고 인정하는 정보"}]},{"id":"R-5","law":"R","no":"5","label":"제5조","title":"산불조심기간 등의 공고","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불조심기간 등의 공고","body":"① 산림청장은 법 제14조제1항에 따른 산불위험지수를 법 제11조제1항에 따른 산림재난정보시스템을 통해 국민에게 알려야 한다.\n② 법 제14조제3항에 따라 산림청장 또는 지방자치단체의 장은 산불조심기간이나 산불특별대책기간을 정하는 경우에는 다음 각 호의 사항을, 산불조심기간이나 산불특별대책기간을 변경하거나 해제한 경우에는 그 변경 내용이나 해제 내용을 지체 없이 해당 기관의 인터넷 홈페이지 등에 공고해야 한다.\n1. 산불조심기간 또는 산불특별대책기간\n2. 산불 발견 시 신고 요령\n3. 산불방지와 관련한 유의 사항"}]},{"id":"R-6","law":"R","no":"6","label":"제6조","title":"산불방지협의회의 구성ㆍ운영","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불방지협의회의 구성ㆍ운영","body":"① 법 제15조제4항에 따라 중앙산불방지대책본부의 장은 산불방지에 관한 다음각 호의 사항을 협의하기 위하여 산림재난방지유관기관 소속 공무원으로 구성된 중앙산불방지협의회를 구성ㆍ운영할 수 있다.\n1. 산불방지 활동에 관한 사항\n2. 산불 발생 시 산불 진화 인력 및 장비의 지원에 관한 사항\n3. 산불방지를 위한 인력, 조직 및 예산 확보의 협조에 관한 사항\n② 중앙산불방지협의회는 다음 각 호의 사람으로 구성한다.\n1. 영 제2조제2항제1호 및 제2호에 따른 기관의 과장급 공무원\n2. 영 제2조제2항제3호에 따른 기관의 영관급 공무원\n③ 중앙산불방지협의회의 위원장은 산림청 차장이 되고, 산림청의 고위공무원단에 속하는 공무원 중 산불방지 업무를 담당하는 일반직공무원을 부위원장으로 한다.\n④ 중앙산불방지협의회의 사무를 처리하기 위하여 간사 1명을 두며, 간사는 산림청의 산불방지 업무를 담당하는 과장이 된다.\n⑤ 중앙산불방지협의회의 위원장은 필요할 때마다 수시로 회의를 개최할 수 있다.\n⑥ 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사ㆍ특별자치도지사(이하 “시ㆍ도지사”라 한다) 또는 시장ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)은 산불방지에 관한 다음 각 호의 사항을 협의하기 위하여 관할 지역의 산림재난방지유관기관으로 구성되는 지역산불방지협의회를 구성ㆍ운영할 수 있다.\n1. 산불방지 활동에 관한 사항\n2. 산불 발생 시 산불 진화 인력 및 장비의 지원에 관한 사항\n3. 산불방지를 위한 인력, 조직 및 예산 확보 협조에 관한 사항\n⑦ 지역산불방지협의회는 다음 각 호의 사람으로 구성한다.\n1. 관할 지역 지방산림청장 또는 국유림관리소장\n2. 관할 지역 산림재난방지유관기관의 과장급 공무원\n⑧ 지역산불방지협의회의 위원장은 특별시ㆍ광역시ㆍ특별자치시ㆍ도ㆍ특별자치도(이하 “시ㆍ도”라 한다) 또는 시ㆍ군ㆍ구(자치구를 말한다. 이하 같다)의 부단체장이 되고, 부위원장은 시ㆍ도 또는 시ㆍ군ㆍ구의 산불방지 업무를 담당하는 실장, 국장 또는 과장이 된다.\n⑨ 지역산불방지협의회의 사무를 처리하기 위하여 간사 1명을 두며, 간사는 시ㆍ도 또는 시ㆍ군ㆍ구의 산불방지 업무를 담당하는 과장 또는 직원이 된다.\n⑩ 지역산불방지협의회의 위원장은 필요할 때마다 수시로 회의를 개최할 수 있다."}]},{"id":"R-7","law":"R","no":"7","label":"제7조","title":"산불 진화 장비의 종류","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불 진화 장비의 종류","body":"법 제16조제3항에서 “농림축산식품부령으로 정하는 산불 진화 장비”란 별표 1의 산불 진화 장비를 말한다."}]},{"id":"R-8","law":"R","no":"8","label":"제8조","title":"산불방지 사업의 종류","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불방지 사업의 종류","body":"법 제16조제5항에서 “산불방지에 관한 연구ㆍ조사 등 농림축산식품부령으로 정하는 산불방지 사업”이란 다음 각 호의 사업을 말한다.\n1. 산불방지에 관한 연구ㆍ조사\n2. 산불 진화 시설의 설치ㆍ운영\n3. 산불감시초소의 설치ㆍ운영\n4. 산불방지 안전공간의 조성\n5. 산불예방을 위한 숲가꾸기\n6. 내화수림대(耐火樹林帶: 불에 잘 견디는 숲) 조성\n7. 영농부산물 수거ㆍ파쇄\n8. 그 밖에 산불방지에 필요하다고 산림청장이 인정하는 사업"}]},{"id":"R-9","law":"R","no":"9","label":"제9조","title":"산불 발생 위험지역에 대한 실태조사","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불 발생 위험지역에 대한 실태조사","body":"① 법 제17조제2항제3호에서 “농림축산식품부령으로 정하는 산불 예방에 필요한 조치”란 다음 각 호의 조치를 말한다.\n1. 제8조 각 호의 산불방지 사업의 실시\n2. 임도의 정비\n3. 산불감시원의 배치\n4. 산불 진화 장비의 배치\n5. 산불 발생 위험지역 주민의 비상연락망 구축, 대피소 지정 등 사전 대피체계 구축\n6. 그 밖에 산불 예방에 필요하다고 산림재난방지기관의 장이 인정하는 조치\n② 법 제17조제3항에 따른 실태조사의 내용은 다음과 같다.\n1. 산불 발생 위험지역의 현황\n2. 산불 발생 위험지역의 산불 발생 이력\n3. 산불 발생 위험지역의 산불 진화 시설 및 산불 진화 장비 현황\n4. 그 밖에 산림재난방지기관의 장이 필요하다고 인정하는 사항\n③ 실태조사는 제1호에 따른 방법을 원칙으로 하되, 제2호에 따른 방법을 병행할 수 있다.\n1. 현지 직접조사\n2. 드론ㆍ항공기ㆍ인공위성 등을 통한 원격탐사, 의견조사, 자료ㆍ문헌조사 등을 통한 간접조사\n④ 제1항부터 제3항까지에서 규정한 사항 외에 실태조사에 필요한 사항은 산림청장이 정한다."}]},{"id":"R-10","law":"R","no":"10","label":"제10조","title":"산불 예방을 위한 행위 제한","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불 예방을 위한 행위 제한","body":"① 법 제18조제1항제3호에서 “농림축산식품부령으로 정하는 기간”이란 영 제9조에 따른 산불조심기간을 말한다.\n② 법 제18조제2항제1호에 따라 산림 또는 산림인접지역에서 불을 피우거나 불을 가지고 들어가려는 사람은 별지 제1호서식의 불피우기 허가 신청서를 특별자치시장ㆍ특별자치도지사(제주특별자치도지사를 말한다. 이하 같다)ㆍ시장ㆍ군수ㆍ구청장 또는 국유림관리소장에게 제출해야 한다.\n③ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 국유림관리소장은 제2항에 따른 허가 신청을 받은 경우에는 다음 각 호의 사항을 확인하여 적합하다고 인정하면 별지 제2호서식의 불피우기 허가증을 신청인에게 내 주고 인접한 산림의 소유자ㆍ점유자 또는 관리인에게 그 허가 상황을 별지 제3호서식에 따라 통지해야 한다.\n1. 불피우기 참여 인력 및 장비 확보 상황\n2. 인명 또는 재산 피해 방지 대책\n3. 그 밖에 부주의로 인한 산불 확산 가능성\n④ 제3항에 따라 불피우기 허가를 한 경우 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 국유림관리소장은 그 허가를 받은 자에게 안전조치 등 필요한 허가 조건을 붙일 수 있으며, 필요한 경우 인력 또는 장비를 지 원하는 등 산불예방대책을 마련해야 한다.\n⑤ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 국유림관리소장은 법 제18조제4항에 따라 화기(火器), 인화(引火) 물질 및 발화(發火) 물질을 지니는 것을 금지하는 경우에는 금지장소와 금지기간을 해당 기관의 게시판 및 인터넷 홈페이지 등에 공고하고, 등산로 입구에 현수막 또는 입간판을 설치하여 산림에 들어가는 사람이 금지 내용을 알 수 있도록 해야 한다."}]},{"id":"R-11","law":"R","no":"11","label":"제11조","title":"산사태등 예방","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태등 예방","body":"법 제21조제3항제4호에서 “농림축산식품부령으로 정하는 산사태등 예방에 필요한 조치”란 다음 각 호의 조치를 말한다.\n1. 산사태 및 토석류(이하 “산사태등”이라 한다) 발생 우려지역 주민의 비상연락망 구축, 대피소 지정 등 사전 대피체계 구축\n2. 임도의 정비\n3. 그 밖에 산사태등 예방을 위하여 산림청장이 필요하다고 인정하는 조치"}]},{"id":"R-12","law":"R","no":"12","label":"제12조","title":"산사태등 발생 우려지역에 대한 조사의 내용 등","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태등 발생 우려지역에 대한 조사의 내용 등","body":"① 법 제21조제1항에 따른 기초조사 및 같은 조 제2항에 따른 실태조사는 다음 각 호의 구분에 따른 사항을 포함해야 한다.\n1. 기초조사: 다음 각 목의 사항\n가. 산사태등 발생 우려지역의 위치ㆍ규모\n나. 산사태등 발생 우려지역의 유형별 분류\n2. 실태조사: 다음 각 목의 사항\n가. 산사태등 발생 우려지역의 토석 유출ㆍ붕괴ㆍ침식의 정도\n나. 산사태등 발생 우려지역의 토지ㆍ산림 현황 등 산사태등의 발생 원인 요소별 특성\n다. 그 밖에 산림재난방지기관의 장이 필요하다고 인정하는 사항\n② 법 제21조제1항에 따른 기초조사는 다음 각 호의 어느 하나에 해당하는 방법으로 한다.\n1. 현지 직접조사\n2. 드론ㆍ항공기ㆍ인공위성 등을 통한 원격탐사, 의견조사, 자료ㆍ문헌조사 등을 통한 간접조사\n③ 법 제21조제1항제2호에 따른 실태조사는 제2항제1호에 따른 방법을 원칙으로 하되, 같은 항 제2호에 따른 방법을 병행할 수 있다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 산사태등 발생 우려지역에 대한 조사의 내용ㆍ방법 등에 관하여 필요한 사항은 산림청장이 정한다."}]},{"id":"R-13","law":"R","no":"13","label":"제13조","title":"산사태취약지역 지정ㆍ고시 등","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태취약지역 지정ㆍ고시 등","body":"① 산림재난방지기관의 장은 법 제22조제2항 각 호 외의 부분에 따라 산사태취약지역 지정예정지를 공고하는 경우 축척 6천분의 1 이상의 지적이 표시된 산사태취약지역 지정예정지의 지형도(「토지이용규제 기본법」 제12조에 따른 국토이용정보체계에 지적이 표시된 지형도의 데이터베이스가 구축되어 있지 않거나 지형과 지적의 불일치로 지형도 활용이 곤란한 경우에는 지적도를 말한다)를 산림재난방지기관에 비치하여 해당 토지의 소유자ㆍ점유자 또는 관리인 등이 열람할 수 있도록 해야 한다.\n② 산림재난방지기관의 장은 법 제22조제2항 각 호 외의 부분에 따라 산사태취약지역 지정예정지에 대하여 해당 기관의 게시판 및 인터넷 홈페이지 등에 30일 이상 공고해야 한다.\n③ 법 제22조제2항제4호에서 “농림축산식품부령으로 정하는 사항”이란 다음 각 호의 사항을 말한다.\n1. 토지소유자의 성명ㆍ주소\n2. 지정 예정 연월일\n3. 지정예정지 도면\n4. 산사태취약지역에서의 행위 제한 및 산사태취약지역의 관리에 관한 사항\n④ 법 제22조제3항에 따라 산사태취약지역의 지정과 관련하여 이의신청을 하려는 자는 별지 제4호서식의 산사태취약지역 지정 이의신청서에 신청 이유에 관한 서류를 첨부하여 산림재난방지기관의 장에게 제출해야 한다.\n⑤ 산림재난방지기관의 장은 법 제22조제5항 본문, 같은 조 제6항 또는 제8항에 따라 산사태취약지역을 지정ㆍ변경하거나 해제한 경우에는 다음 각 호의 사항을 고시하고, 별지 제5호서식의 산사태취약지역 지정ㆍ변경ㆍ해제 대 장과 별지 제6호서식의 산사태취약지역 지정ㆍ변경ㆍ해제 구역 도면을 작성ㆍ보관해야 한다. 이 경우 산림재난방지기관의 장은 별지 제6호서식의 산사태취약지역 지정ㆍ변경ㆍ해제 구역 도면을 산림재난방지기관에 비치하여 해당 토지의 소유자ㆍ점유자 또는 관리인 등이 도면을 열람할 수 있도록 해야 한다.\n1. 지정ㆍ변경 또는 해제 사유\n2. 지정ㆍ변경 또는 해제 연월일\n3. 지정ㆍ변경 또는 해제 대상지의 지번ㆍ지목ㆍ면적ㆍ도면\n⑥ 산림청장은 법 제22조제10항에 따른 대피소 지정 및 대피소 표지판 설치 기준에 관한 지침을 마련하여 산림재난방지기관의 장에게 통보해야 한다.\n⑦ 법 제22조제11항에 따른 산사태취약지역 표지판은 별표 2의 산사태취약지역 표지판 설치 기준에 따른다."}]},{"id":"R-14","law":"R","no":"14","label":"제14조","title":"산사태취약지역 지정위원회 운영 등","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태취약지역 지정위원회 운영 등","body":"① 영 제14조제6항에 따라 지방산림청장 소속 산사태취약지역 지정위원회(이하 “지정위원회”라 한다)는 다음 각 호의 방법에 따라 운영한다.\n1. 지정위원회의 위원장은 지정위원회를 대표하고 업무를 총괄하며, 회의를 소집하고 그 의장이 된다.\n2. 지정위원회의 위원장이 부득이한 사유로 그 직무를 수행할 수 없는 경우에는 부위원장이 위원장의 직무를 대행 한다.\n3. 지정위원회는 재적위원 과반수의 출석으로 개의(開議)하고 출석위원 과반수의 찬성으로 의결한다.\n4. 제1호부터 제3호까지에서 규정한 사항 외에 지정위원회 운영에 필요한 사항은 지방산림청장이 정한다.\n② 지정위원회의 위원은 다음 각 호의 어느 하나에 해당하는 경우에는 해당 안건의 심의ㆍ의결에서 제척(除斥)된다.\n1. 위원이 해당 안건에 관하여 자문, 연구, 용역 또는 감정(鑑定)을 한 경우\n2. 위원이나 그 배우자가 해당 안건에 관한 토지의 소유자ㆍ지정권자ㆍ지역권자ㆍ전세권자 또는 임차권자인 경우\n③ 지정위원회의 위원이 제2항 각 호에 따른 제척사유에 해당하는 경우에는 스스로 해당 안건의 심의ㆍ의결에서 회 피해야 한다.\n④ 지방산림청장은 지정위원회의 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해임하거나 해 촉할 수 있다.\n1. 심신쇠약으로 직무를 수행할 수 없게 된 경우\n2. 직무태만, 품위손상, 그 밖의 사유로 위원으로 적합하지 않다고 인정되는 경우\n3. 제2항 각 호의 어느 하나에 해당함에도 불구하고 회피하지 않은 경우\n⑤ 지정위원회에 출석한 위원에게는 예산의 범위에서 수당과 여비를 지급할 수 있다. 다만, 공무원인 위원이 그 소관 업무와 직접적으로 관련되어 출석하는 경우에는 그렇지 않다."}]},{"id":"R-15","law":"R","no":"15","label":"제15조","title":"안전조치 명령","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"안전조치 명령","body":"① 영 제15조에 따른 안전조치 명령서는 별지 제7호서식에 따른다.\n② 법 제25조제3항에 따라 안전조치 명령을 받은 자는 안전조치를 이행하고 별지 제8호서식의 안전조치 결과 통보서에 안전조치 결과를 증명하는 서류나 사진을 첨부하여 영 제15조에 따른 안전조치 명령서를 발급한 산림재난방지기관의 장에게 제출해야 한다."}]},{"id":"R-16","law":"R","no":"16","label":"제16조","title":"산림병해충 예찰의 방법ㆍ시기 등","chapter":"제3장 산림재난 예방","section":"제3절 산림병해충 예찰","versions":[{"from":"2026-02-01","title":"산림병해충 예찰의 방법ㆍ시기 등","body":"① 법 제28조제2항에 따라 산림재난방지기관의 장은 산림청장이 정하여 고시하는 산림병해충별 발생조사 시기에 다음 각 호의 방법으로 산림병해충을 예찰해야 한다. 다만, 새로운 산림병해충이 발생하거나 발생할 우려가 있는 경우 또는 갑자기 산림병해충이 발생한 경우에는 연중 실시할 수 있다.\n1. 항공예찰: 항공기에서 촬영장비를 이용하거나 탑승자가 맨눈으로 예찰\n2. 지상예찰: 지상에서 예찰조사요원이 장비를 이용하거나 맨눈으로 예찰\n② 산림청장 또는 산림재난방지기관의 장은 산림병해충 예찰 결과에 따라 방제계획을 수립하여 방제해야 한다.\n③ 제1항 및 제2항에서 규정한 사항 외에 산림병해충 예찰의 방법ㆍ시기와 예찰 결과에 대한 조치사항 등에 관하여 필요한 세부 사항은 산림청장이 정한다."}]},{"id":"R-17","law":"R","no":"17","label":"제17조","title":"산림병해충 발생 위험지역 실태조사의 내용 등","chapter":"제3장 산림재난 예방","section":"제3절 산림병해충 예찰","versions":[{"from":"2026-02-01","title":"산림병해충 발생 위험지역 실태조사의 내용 등","body":"① 법 제29조제1항에 따른 산림병해충 발생 위험지역 실태조사는 산림청장이 정하여 고시하는 산림병해충별 발생조사 시기에 다음 각 호의 방법으로 한다.\n1. 현지 직접조사\n2. 드론ㆍ항공기ㆍ인공위성 등을 통한 원격탐사, 의견조사, 자료ㆍ문헌조사 등을 통한 간접조사\n② 제1항에 따른 실태조사에는 다음 각 호의 내용이 포함되어야 한다.\n1. 산림병해충의 발생 상황 및 분포에 대한 조사\n2. 긴급방제 산림병해충, 신규발생 산림병해충, 외래ㆍ돌발 산림병해충의 발생 상황 및 분포에 대한 조사\n3. 농림지에 동시에 발생하여 피해를 주는 산림병해충 발생 상황 및 분포에 대한 조사\n③ 제1항 및 제2항에서 규정한 사항 외에 실태조사의 내용ㆍ방법 등에 필요한 관하여 세부 사항은 산림청장이 정한다."}]},{"id":"R-18","law":"R","no":"18","label":"제18조","title":"산불 발생 보고 등","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불 발생 보고 등","body":"① 산림재난방지기관의 장은 법 제31조제1항 및 제2항에 따라 산불 발생 신고를 접수했거나 산림재난방지유관기관으로부터 통보받은 경우 이를 지체 없이 산림청장에게 보고해야 한다.\n② 법 제31조제1항 및 제2항에 따라 산불 발생 신고 또는 그 통보를 받은 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 및 국유림관리소장은 산불 진화를 위해 산림항공기의 지원이 필요한 경우 시ㆍ도지사 또는 지방산림청장을 거쳐 산림청장에게 산림항공기 지원을 요청해야 한다. 다만, 특별자치시장ㆍ특별자치도지사는 직접 산림청장에게 요청해야 한다.\n③ 군항공기, 경찰항공기 및 민간항공기의 조종사 등은 항공기 운항 중에 산불을 발견한 때에는 지체 없이 관제탑을 통하여 산림청 또는 산림재난방지기관에 이를 알려야 한다."}]},{"id":"R-19","law":"R","no":"19","label":"제19조","title":"산불 진화 우선순위 및 보고","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불 진화 우선순위 및 보고","body":"① 법 제31조제3항에 따라 산불을 진화할 때에는 다음 각 호의 순서에 따라 진화해야 한다.\n1. 인명 보호\n2. 국가기간산업시설, 군사시설 및 국가유산의 보호\n3. 가옥 등 재산 보호\n4. 산림보호구역, 채종림(採種林: 종자 생산을 목적으로 하는 산림), 시험림 등 중요 산림자원의 보호\n5. 그 밖에 산림지역의 산불 확산 방지\n② 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 및 국유림관리소장은 산불 진화를 완료한 후 산불 발생 및 피해 상황을 별지 제9호서식에 따라 작성하여 시ㆍ도지사 또는 지방산림청장을 거쳐 산림청장에게 즉시 보고해야 한다. 다만, 특별자치시장ㆍ특별자치도지사는 직접 산림청장에게 즉시 보고해야 한다."}]},{"id":"R-20","law":"R","no":"20","label":"제20조","title":"산불대응 단계의 발령 방법 등","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불대응 단계의 발령 방법 등","body":"① 산림청장은 법 제32조제1항 전단에 따라 법 제11조에 따른 산림재난정보시스템을 통해 산불대응 단계를 발령하고 그 사실을 국민에게 알려야 한다. 다만, 부득이한 경우 팩스 또는 유선ㆍ무선 장비 등을 통해 산불대응 단계를 발령할 수 있다.\n② 산불 진화를 위한 인력 및 장비(이하 “산불진화자원”이라 한다)는 산불대응 단계별로 구분하여 동원하며, 구체적인 기준은 산림청장이 정하여 고시한다.\n③ 제1항 및 제2항에서 규정한 사항 외에 산불 대응 단계의 발령 방법 등에 관하여 필요한 세부적인 사항은 산림청장이 정한다."}]},{"id":"R-21","law":"R","no":"21","label":"제21조","title":"산불현장 통합지휘본부의 구성ㆍ임무 등","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불현장 통합지휘본부의 구성ㆍ임무 등","body":"① 법 제35조제2항에 따른 산불현장 통합지휘본부의 장(이하 “산불현장 통합지휘본부장” 이라 한다)은 산불 진화 전략 수립, 산불진화자원 배치, 산불 상황 전파, 홍보, 의료구호 지원 등을 포함한 산불 진화 대책을 마련해야 한다.\n② 산불현장 통합지휘본부장은 산불현장 통합지휘본부에 산불 및 진화 상황 관리를 위하여 상황총괄반, 지상진화반, 공중진화반, 보급지원반, 홍보대책반을 편성ㆍ운영해야 한다.\n③ 산림재난방지기관의 산림부서의 장은 원활한 산불 진화 지휘를 위하여 산불현장 통합지휘본부장을 보좌해야 한다.\n④ 산불현장 통합지휘본부장은 산불 발생 현장에 지원된 산림항공기, 산림재난방지유관기관의 항공기 또는 민간항공기를 총괄지휘하기 위하여 공중진화반의 공중진화반장을 산림항공본부장 또는 산림항공본부장이 지정하는 사람으로 임명할 수 있다.\n⑤ 산불 진화에 지원된 항공기의 조종사, 정비사 등 항공기 관계자(이하 “승무원”이라 한다)가 공중진화 또는 항공기의 급유ㆍ계류(繫留: 옥외에 정류한 항공기를 움직이지 않도록 고정하는 일) 또는 정비를 할 때에는 공중진화반장의 지시에 따라야 한다.\n⑥ 산불현장 통합지휘본부장은 산불 발생ㆍ진화ㆍ피해 상황 등을 파악하여 산림청장에게 수시로 보고해야 한다.\n⑦ 제2항에 따른 반별 임무 등에 관한 사항은 산림청장이 정한다."}]},{"id":"R-22","law":"R","no":"22","label":"제22조","title":"산림무선통신망의 구축ㆍ운영","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산림무선통신망의 구축ㆍ운영","body":"① 산림청장은 법 제35조에 따른 산불현장 통합지휘본부의 원활한 운영 및 산불 발생 현장에 대한 효율적 통합지휘체계 구축을 위하여 산림무선통신망을 구축ㆍ운영해야 한다.\n② 산림재난방지기관의 장 또는 산림항공본부장은 채널복합형 산림무선통신망을 이용하는 무선통신기를 사용할 경우 산림청장으로부터 고유번호를 부여받아 사용해야 한다.\n③ 산불 진화 현장에서의 무선통신은 다음 각 호의 순서에 따른다.\n1. 산불현장 통합지휘본부에서의 송수신\n2. 산불 진화용 항공기에서의 송수신\n3. 공중 및 지상 진화대에서의 송수신\n④ 산불 진화에 참여하는 항공기의 조종사는 항상 재난비상 주파수를 개방하여 산불현장 통합지휘본부와 통신이 유지되도록 해야 한다."}]},{"id":"R-23","law":"R","no":"23","label":"제23조","title":"산불예방진화대 등의 구성원","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불예방진화대 등의 구성원","body":"법 제37조제2항에서 “농림축산식품부령으로 정하는 산불진화교육과 훈련을 받은 사람”이란 제42조제4항에 따른 산림재난방지 교육 중 산불방지 분야 교육을 받은 사람을 말한다."}]},{"id":"R-24","law":"R","no":"24","label":"제24조","title":"산사태등 발생 보고","chapter":"제4장 산림재난 대응 등","section":"제2절 산사태등 대응","versions":[{"from":"2026-02-01","title":"산사태등 발생 보고","body":"① 산림재난방지기관의 장은 법 제38조제1항 및 제2항에 따라 산사태등 신고를 접수했거나 산림재난방지유관기관으로부터 통보받은 경우 이를 지체 없이 산림청장에게 보고해야 한다.\n② 제1항에서 규정한 사항 외에 산사태등 발생 상황 파악 및 안전조치 등에 필요한 세부사항은 산림청장이 정한다."}]},{"id":"R-25","law":"R","no":"25","label":"제25조","title":"산사태대응팀의 구성ㆍ운영","chapter":"제4장 산림재난 대응 등","section":"제2절 산사태등 대응","versions":[{"from":"2026-02-01","title":"산사태대응팀의 구성ㆍ운영","body":"① 산림재난방지기관의 장은 법 제41조제1항에 따른 산사태대응팀(이하 “산사태대응팀”이라 한다)을 다음 각 호의 기관에 설치할 수 있다.\n1. 지방산림청 및 국유림관리소\n2. 지방자치단체\n② 산사태대응팀은 팀장 1명을 포함한 5명 내외로 구성하며, 산사태대응팀장 및 팀원은 제1항에 따라 설치된 기관의 소속 공무원 중 산림청장 및 산림재난방지기관의 장이 지명한다."}]},{"id":"R-26","law":"R","no":"26","label":"제26조","title":"산사태현장예방단의 구성ㆍ운영","chapter":"제4장 산림재난 대응 등","section":"제2절 산사태등 대응","versions":[{"from":"2026-02-01","title":"산사태현장예방단의 구성ㆍ운영","body":"① 법 제41조제2항에서 “농림축산식품부령으로 정하는 산사태등에 관한 교육 및 훈련을 받은 사람”이란 제42조제4항에 따른 산림재난방지 교육 중 산사태등 예방 분야 교육을 받은 사람을 말한다.\n② 법 제41조제2항에 따른 산사태현장예방단(이하 “산사태현장예방단”이라 한다)은 다음 각 호의 임무를 수행한다.\n1. 산사태취약지역 등의 재해예방을 위한 순철, 점검 및 응급조치\n2. 산사태취약지역 주변 주민대피 등 안전조치\n3. 산사태등방지 관련 주민안내 및 홍보활동 지원\n③ 산사태현장예방단은 1개 단을 4명 내외로 구성한다.\n④ 산사태현장예방단원은 관할 지역의 주민 중에서 산림재난방지기관의 장이 선발한다.\n⑤ 제2항부터 제4항까지에서 규정한 사항 외에 산사태현장예방단의 구성ㆍ운영에 필요한 사항은 산림청장이 정한다."}]},{"id":"R-27","law":"R","no":"27","label":"제27조","title":"산림병해충 발생 보고","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 발생 보고","body":"① 산림재난방지기관의 장은 법 제42조제1항 및 제2항에 따라 산림병해충 신고를 접수했거나 산림재난방지유관기관으로부터 통보받은 경우 이를 지체 없이 산림청장에게 보고해야 한다.\n② 제1항에서 규정한 사항 외에 산림병해충 발생 상황 파악 및 조치에 필요한 세부 사항은 산림청장이 정한다."}]},{"id":"R-28","law":"R","no":"28","label":"제28조","title":"산림병해충 방제명령 등","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 방제명령 등","body":"① 산림재난방지기관의 장이 법 제43조제1항에 따라 산림병해충 방제에 필요한 조치를 명할 때에는 별지 제10호서식의 산림병해충 방제조치명령서를 발급해야 한다.\n② 제1항에 따른 조치 명령을 받은 산림에 있는 식물과 산림이 아닌 지역에 있는 수목의 소유자ㆍ점유자ㆍ관리인, 판매자 또는 산림사업 종사자 등(이하 “산림소유자등”이라 한다)은 별지 제11호서식의 산림병해충 방제계획서에 방 제설계서를 첨부하여 산림재난방지기관의 장에게 제출해야 한다.\n③ 제2항에 따른 산림병해충 방제계획서를 받은 산림재난방지기관의 장은 산림병해충 방제계획서의 방제 방법 등에 대해 적정성을 검토한 후 승인 여부를 산림소유자등에게 서면(전자문서를 포함한다. 이하 같다)으로 알려야 한다."}]},{"id":"R-29","law":"R","no":"29","label":"제29조","title":"산림병해충 방제명령의 이행 등","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 방제명령의 이행 등","body":"① 법 제43조제1항에 따른 조치 명령을 받은 산림소유자등이 승인받은 방제계획을 이행한 때에는 별지 제12호서식의 산림병해충 방제완료서를 해당 조치를 명한 산림재난방지기관에 제출해야 한다. 이 경우 법 제43조제1항제2호 또는 제3호에 따른 조치 명령을 받은 산림소유자등은 별지 제13호서식의 산림병해충 방제명령 해제신청서를 함께 제출해야 한다.\n② 제1항에 따라 산림소유자등으로부터 산림병해충 방제완료서 또는 산림병해충 방제명령 해제신청서를 받은 산림재난방지기관의 장은 이행결과를 확인하고 방제가 완료되었다고 인정할 때에는 산림소유자등에게 서면으로 알려야 한다."}]},{"id":"R-30","law":"R","no":"30","label":"제30조","title":"방제명령의 이행기간","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"방제명령의 이행기간","body":"① 법 제43조제7항에서 “농림축산식품부령으로 정하는 기한”이란 법 제43조제1항에 따라 조치 명령을 받은 날부터 90일을 말한다.\n② 산림재난방지기관의 장은 법 제43조제1항에 따른 조치 명령을 받은 산림소유자등의 방제명령 이행 대상이 다음각 호의 어느 하나에 해당하는 경우 조치 명령을 받은 산림소유자등의 요청에 따라 조치 명령의 이행기간을 연장할 수 있다.\n1. 섬 지역(육지와 연결된 섬 지역 및 제주특별자치도는 제외한다)에 위치하는 경우\n2. 천재지변 등 산림재난방지기관이 인정한 부득이한 사유가 발생한 경우"}]},{"id":"R-31","law":"R","no":"31","label":"제31조","title":"산림병해충의 방제 점검 등","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충의 방제 점검 등","body":"산림재난방지기관의 장이 법 제44조제1항에 따른 방제작업을 실시한 경우에는 그 방제작업 결과에 대한 점검을 실시한 후 분기마다 그 점검 결과를 산림청장에게 보고해야 한다."}]},{"id":"R-32","law":"R","no":"32","label":"제32조","title":"방제사업의 설계","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"방제사업의 설계","body":"① 법 제45조제1항에 따른 설계는 기본설계와 실시설계로 구분하고, 기본설계를 한 후 이에 기초하여 실시설계를 한다. 다만, 산림재난방지기관의 장이 방제사업의 신속한 추진이 필요한 경우 등 기본설계를할 필요가 없다고 인정하는 경우에는 기본설계를 하지 않고 기본설계의 내용을 포함하여 실시설계를 할 수 있다.\n② 방제작업 기본설계에는 다음 각 호의 사항이 포함되어야 한다.\n1. 방제 대상지의 위치와 사업면적\n2. 해당 산림에 대한 산림소유자의 요구사항\n3. 실시설계의 방침 및 방제사업의 예산 규모\n4. 그 밖에 방제사업 기본설계에 필요한 사항\n③ 방제작업 실시설계에는 다음 각 호의 사항이 포함되어야 한다.\n1. 방제 대상지별 작업 방법\n2. 사업비 산출 내역\n3. 방제작업의 필요인력 및 장비 운용 계획\n4. 산림병해충 발생 현황 및 방제계획 도면\n5. 그 밖에 방제사업 실시에 필요한 사항\n④ 방제사업의 세부적인 설계기준과 그 밖에 사업 시행 요령 및 사업비 산출기준 등은 산림청장이 정한다."}]},{"id":"R-33","law":"R","no":"33","label":"제33조","title":"방제사업의 감리","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"방제사업의 감리","body":"① 법 제45조제2항에 따른 방제사업의 감리자는 다음 각 호의 감리기준을 고려하여 감리업무를 해야 한다.\n1. 설계도서가 해당 지형 등에 적합한지 여부\n2. 산림병해충 방제 약제의 적정 사용 여부\n3. 방제사업자가 관계 법령 및 설계도서에 따라 적합하게 방제하는지 여부\n4. 방제 현장에서의 재해 예방 및 안전관리 지도\n5. 설계 변경의 타당성 검토\n6. 그 밖에 감리 및 방제사업 계약으로 정하는 사항\n② 방제사업의 감리자 선정기준 및 세부적인 감리기준, 그 밖에 감리의 시행 요령은 산림청장이 정한다."}]},{"id":"R-34","law":"R","no":"34","label":"제34조","title":"산림병해충 특별방제구역 지정ㆍ해제 등","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 특별방제구역 지정ㆍ해제 등","body":"① 산림청장은 법 제46조제1항 및 제5항에 따라 산림병해충 특별방제구역(이하 “특별방제구역”이라 한다)을 지정하거나 지정을 해제하려는 경우에는 다음 각 호의 사항을 관보에 고시해야 한다.\n1. 지정 기간(지정의 경우로 한정한다)\n2. 소재지\n3. 구역 면적\n4. 지정 또는 지정해제 사유\n② 산림재난방지기관의 장은 법 제46조제3항에 따라 특별방제구역 지정ㆍ해제의 고시내용을 전국적으로 보급되거나 해당 지역을 주된 보급지역으로 하는 일간신문, 산림재난방지기관의 인터넷 홈페이지, 방송 등을 통하여 해당 산림소유자등에게 알릴 수 있다."}]},{"id":"R-35","law":"R","no":"35","label":"제35조","title":"산불피해 복구 등","chapter":"제5장 산림재난 조사 및 복구","section":"제1절 산불 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산불피해 복구 등","body":"① 법 제49조제1항에 따라 산림재난방지기관의 장은 산불로 피해가 발생한 산림재난피해지(이하 이 조에서 “산불피해지”라 한다)에서 토사 유출 등 피해가 없도록 응급조치를 하고, 다음 각 호의 사항을 고려하여 복구 계획을 수립ㆍ시행해야 한다.\n1. 법 제48조제1항에 따른 산불 조사의 결과\n2. 산사태등으로 인한 추가적인 피해 가능성\n3. 산불피해지의 입지 특성, 산림경영 현황 및 산림기능\n4. 그 밖에 산림재난방지기관의 장이 필요하다고 인정하는 사항\n② 산림재난방지기관의 장은 복구된 산불피해지에 대해 주기적으로 사후 관리를 실시하고, 산불피해지 복구와 관련된 정보를 관리해야 한다."}]},{"id":"R-36","law":"R","no":"36","label":"제36조","title":"산사태등 피해 복구 등","chapter":"제5장 산림재난 조사 및 복구","section":"제2절 산사태등 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산사태등 피해 복구 등","body":"① 산림재난방지기관의 장은 영 제37조제1항에 따라 산사태등 피해 복구계획을 통지하는 경우 별지 제14호서식의 토지사용 동의서를 첨부해야 한다.\n② 산림재난방지기관의 장은 법 제51조제2항에 따라 산사태등 피해 복구계획 통지 및 토지사용 동의 요청을 하는 경우에는 20일 이상의 기간을 정하여 그 기간 내에 토지의 소유자ㆍ점유자 또는 관리인이 동의 여부를 결정할 수 있도록 해야 한다.\n③ 토지의 소유자ㆍ점유자 또는 관리인이 토지 사용에 동의하는 경우 별지 제14호서식의 토지사용 동의서에 「본인서명사실 확인 등에 관한 법률」에 따른 본인서명사실확인서(동의자가 개인인 경우만 해당한다) 또는 법인인감증명서(동의자가 법인인 경우만 해당한다)를 첨부하여 산림재난방지기관의 장에게 제출해야 한다."}]},{"id":"R-37","law":"R","no":"37","label":"제37조","title":"산림병해충 조사 방법 및 통보","chapter":"제5장 산림재난 조사 및 복구","section":"제3절 산림병해충 조사","versions":[{"from":"2026-02-01","title":"산림병해충 조사 방법 및 통보","body":"① 법 제52조제1항에 따른 산림병해충 조사는 다음 각 호의 방법으로 실시해야 한다.\n1. 현지 직접조사\n2. 드론ㆍ항공기ㆍ인공위성 등을 통한 원격탐사, 의견조사, 자료ㆍ문헌조사 등을 통한 간접조사\n② 산림청장은 법 제52조제2항에 따른 산림병해충 대응과정의 분석ㆍ평가 결과를 매년 11월 30일까지 산림재난방지기관의 장에게 통보해야 한다.\n③ 제1항 및 제2항에서 규정한 사항 외에 산림병해충 조사 및 산림병해충 대응과정 분석ㆍ평가의 결과 통보 등에 필요한 사항은 산림청장이 정한다."}]},{"id":"R-38","law":"R","no":"38","label":"제38조","title":"산림병해충 방제효과의 조사","chapter":"제5장 산림재난 조사 및 복구","section":"제3절 산림병해충 조사","versions":[{"from":"2026-02-01","title":"산림병해충 방제효과의 조사","body":"① 법 제53조제1항에 따른 방제효과 조사 시기는 별표 3과 같다.\n② 방제효과 조사에는 다음 각 호의 내용이 포함되어야 한다.\n1. 산림병해충 발생 현황 및 방제 방법\n2. 방제 방법별 병해충 피해목(被害木) 발생률 등 산림청장이 정하는 방제효과 측정 결과\n③ 제1항 및 제2항에서 규정한 사항 외에 방제효과 조사의 시기 및 내용 등에 관하여 필요한 사항은 산림청장이 정 한다."}]},{"id":"R-39","law":"R","no":"39","label":"제39조","title":"산림항공기의 운용","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"산림항공기의 운용","body":"법 제55조제1항제4호에서 “농림축산식품부령으로 정하는 사항”이란 다음 각 호의 사항을 말한다.\n1. 산불 진화\n2. 산림병해충 방제를 위한 약제 및 비료 살포\n3. 산림 공중 순찰 및 단속\n4. 산림 정화\n5. 국가 또는 지방자치단체가 하는 산림사업의 현지확인ㆍ조사, 자재 및 인원의 수송\n6. 그 밖에 산림행정을 위하여 산림청장이 필요하다고 인정하는 사항"}]},{"id":"R-40","law":"R","no":"40","label":"제40조","title":"산림항공기 지원 요청","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"산림항공기 지원 요청","body":"법 제55조제1항 각 호에 따른 활동 등을 위해 산림항공기를 지원받으려는 기관의 장 또는 산불현장 통합지휘본부장은 별지 제15호서식의 산림항공기 지원요청서에 다음 각 호의 서류를 첨부하여 산림청장에게 요청해야 한다. 다만, 제39조제1호의 활동을 위해 산림항공기를 지원받으려는 경우에는 구두(口頭)로 요청할 수 있다.\n1. 위치도\n2. 화물 명세 또는 탑승자 명단(성명, 생년월일, 주소, 직업이 포함되어야 한다)\n3. 별지 제16호서식의 탑승자 서약서[승무원 외의 사람(관계 공무원 및 산불ㆍ사고에 따른 구조를 받기 위하여 탑승하는 사람은 제외한다)이 탑승하는 경우만 해당한다]"}]},{"id":"R-41","law":"R","no":"41","label":"제41조","title":"비행 지시","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"비행 지시","body":"① 산림청장이 제40조에 따른 요청에 따라 산림항공기를 지원하려는 경우에는 별지 제17호서식의 비행지시서에 따라 산림항공기 운항을 지시해야 한다. 다만, 제39조제1호의 활동을 위해 지원을 요청받은 경우에는 구두로 산림항공기 운항을 지시할 수 있다.\n② 산림청장은 산불위험이 예상되는 지역에 대해서는 기간을 정하여 산림항공기를 미리 이동ㆍ배치할 수 있다.\n③ 제1항 및 제2항에서 규정한 사항 외에 산림항공기의 운영계획ㆍ정비 및 사고 처리 등에 필요한 사항은 산림청장이 정한다."}]},{"id":"R-42","law":"R","no":"42","label":"제42조","title":"산림재난방지 교육","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 교육","body":"① 산림청장은 법 제56조제1항에 따라 매년 12월 31일까지 산림재난별로 산림재난방지 교육계획을 수립ㆍ실시해야 한다.\n② 법 제56조제2항제5호에서 “농림축산식품부령으로 정하는 사람”이란 산림재난방지를 위하여 고용된 사람을 말한다.\n③ 법 56조제3항에서 “제58조에 따른 한국산림재난안전기술공단 등 농림축산식품부령으로 정하는 기관”이란 다음각 호의 기관을 말한다.\n1. 법 제58조에 따른 한국산림재난안전기술공단\n2. 산림청 소속 교육기관\n3. 지방자치단체 소속 교육기관\n4. 「산림조합법」 제2조제4호에 따른 중앙회 소속 교육기관\n④ 산림청장 또는 산림재난방지기관의 장은 법 제56조제2항 각 호에 해당하는 사람이 다음 각 호의 내용에 관한 교육 중 직무와 관련된 교육을 매년 10시간 이상 받도록 해야 한다. 다만, 법 제13조에 따라 산림재난대응단을 구성ㆍ운영하는 경우 산림재난대응단에 속한 법 제56조제2항제2호부터 제4호까지의 규정에 해당하는 사람은 해당 교육을 매년 8시간 이상 받도록 할 수 있다.\n1. 법 제37조제2항에 따른 산불예방진화대 및 산불재난특수진화대의 임무 및 역할\n2. 산사태현장예방단의 임무 및 역할\n3. 법 제47조제2항에 따른 산림병해충예찰방제단의 임무 및 역할\n4. 산림재난방지를 위한 점검 및 응급조치 요령\n5. 산림재난 예방ㆍ대응ㆍ조사 및 복구 요령\n⑤ 법 제56조제2항에 따른 교육은 집합교육과 온라인교육을 병행하여 실시할 수 있다."}]},{"id":"R-43","law":"R","no":"43","label":"제43조","title":"예산과 결산","chapter":"제7장 한국산림재난안전기술공단","section":""     check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

  const isFav = key => store.favs.includes(key);
  const starBtn = (key, label) => `<button type="button" class="icon-btn star" data-act="fav" data-key="${esc(key)}" aria-pressed="${isFav(key)}" aria-label="${esc(label)} 즐겨찾기">${ICON.star}</button>`;

  // ── 조문 버전 ─────────────────────────────────────
  function versionStates(a, date = refDate()) {
    let cur = -1;
    a.versions.forEach((v, i) => { if (v.from <= date) cur = i; });
    return a.versions.map((v, i) => ({ v, i, state: i === cur ? 'current' : v.from > date ? 'upcoming' : 'past' }));
  }
  const versionName = v => (v.from === BASE_FROM ? '개정 전 조문' : `${fmt(v.from)} 시행`);

  function linkRefs(html, law) {
    return html.replace(/(「[^」]*」\s*)?(같은 법 |법 |영 )?제(\d+)조(?:의(\d+))?/g, (m, ext, prefix, no, sub) => {
      if (ext || prefix === '같은 법 ') return m;
      const target = prefix === '법 ' ? 'L' : prefix === '영 ' ? 'D' : law;
      const id = `${target}-${no}${sub ? '-' + sub : ''}`;
      if (!ART.has(id)) return m;
      return `${prefix || ''}<a class="xref" data-act="art" data-id="${id}" tabindex="0">제${no}조${sub ? '의' + sub : ''}</a>`;
    });
  }
  function articleBody(a, body) {
    return body.split('\n').map(p => {
      const cls = /^\d+\.\s/.test(p) ? 'h1' : /^[가-하]\.\s/.test(p) ? 'h2' : '';
      let h = esc(p).replace(/&lt;(개정|신설)[^&]*&gt;|\[본조신설[^\]]*\]|삭제&lt;[^&]*&gt;/g, m => `<span class="amend">${m}</span>`);
      h = linkRefs(h, a.law);
      return `<p class="${cls}">${h}</p>`;
    }).join('');
  }

  // ── 대응 기록 ─────────────────────────────────────
  function newIncident(mode) {
    return { mode, startedAt: Date.now(), current: 'report', choice: {}, checks: {}, done: {}, inputs: { command: { area: '', span: 'one', owner: 'public', national: false, multiLarge: false }, stage: { area: '', wind: '', hours: '', facilities: '', smallTotal: false }, alert: '', alertChecks: {}, agencies: {}, letter: { to: '', purpose: '', equipment: '', personnel: '', period: '', place: '' } } };
  }
  // inc(): 저장되는 실제·훈련 기록 / rec(): 화면이 쓰는 기록(기록이 없으면 저장하지 않는 열람용 기록)
  const inc = () => store.incident;
  const rec = () => store.incident || (ui.view = ui.view || newIncident('view'));
  const isViewing = () => !store.incident;
  const modeLabel = () => (!inc() ? '평시' : inc().mode === 'live' ? '산불 대응 중' : '훈련 모드');
  const respondTabLabel = () => (!inc() ? '대응' : inc().mode === 'live' ? '대응 중' : '훈련 중');

  // 기록 시작 직후 잘못 눌렀을 때 되돌릴 수 있는 시간
  const UNDO_MS = 10000;
  function startIncident(mode, returnHash) {
    store.incident = newIncident(mode);
    ui.view = null;
    ui.undo = { until: Date.now() + UNDO_MS, returnHash: returnHash || '#/' };
    save();
    renderUndo();
  }
  function renderUndo() {
    const bar = $('#undo');
    if (!bar) return;
    const u = ui.undo;
    const left = u && inc() ? Math.ceil((u.until - Date.now()) / 1000) : 0;
    if (left <= 0) {
      ui.undo = null;
      bar.hidden = true;
      document.body.classList.remove('undo-on');
      clearInterval(renderUndo.timer); renderUndo.timer = null;
      return;
    }
    if (bar.hidden) {
      // 버튼은 한 번만 만들고 초만 갱신한다 — 매초 다시 그리면 누르는 도중 버튼이 바뀌어 탭이 사라질 수 있다
      bar.innerHTML = `<span><b>${inc().mode === 'live' ? '실제 산불' : '훈련'} 대응 기록을 시작했습니다.</b> <span class="muted"><span data-undo-left></span>초 안에 취소할 수 있습니다</span></span><button type="button" class="btn small" data-act="undo-start">잘못 눌렀어요 — 취소</button>`;
      bar.hidden = false;
      document.body.classList.add('undo-on');
    }
    bar.querySelector('[data-undo-left]').textContent = left;
    if (!renderUndo.timer) renderUndo.timer = setInterval(renderUndo, 1000);
  }

  // ── 판정 로직 ─────────────────────────────────────
  const STAGE_NAMES = ['초기 대응', '확산 대응 1단계', '확산 대응 2단계'];

  function judgeCommand(s) {
    const area = parseFloat(s.area);
    const hasArea = Number.isFinite(area);
    const large = hasArea && area >= 100;
    const why = [], notes = [];
    let who;
    if (s.span === 'province') {
      who = '산림청장';
      why.push('둘 이상의 시·도에 걸쳐 발생 [[L-34|법 제34조③]]');
      notes.push('지리적 여건·피해 상황을 고려해 시·도지사에게 위임할 수 있음 [[D-21|영 제21조④]]');
    } else if (large) {
      who = '시·도지사';
      why.push(`산림 피해면적 ${area}ha ≥ 100ha(100만㎡) → 대형 산불 [[L-34|법 제34조②]] [[D-21|영 제21조①]]`);
      if (s.span === 'county') why.push('둘 이상의 시·군·구에 걸침 → 시·도지사 [[L-34|법 제34조③]]');
      if (s.multiLarge) notes.push('관할 안 다른 곳에도 대형 산불 → 한 곳 이상의 지휘권을 시장·군수·구청장에게 위임할 수 있음 [[D-21|영 제21조③]]');
    } else if (s.span === 'county') {
      who = '시·도지사';
      why.push('둘 이상의 시·군·구에 걸쳐 발생 [[L-34|법 제34조③]]');
      notes.push('중소형 산불이면 시장·군수·구청장에게 위임할 수 있음 [[D-21|영 제21조④1]]');
    } else if (s.owner === 'mixed') {
      who = '시장·군수·구청장';
      why.push('국유림·공유림·사유림에 걸쳐 발생 → 시장·군수·구청장이 통합지휘해야 함 [[L-34|법 제34조① 단서]]');
    } else if (s.owner === 'national') {
      who = '지방산림청장';
      why.push('국유림에서 난 중소형 산불 → 관할 지방산림청장 [[L-34|법 제34조①]]');
      notes.push('중소형 산불 통합지휘 권한은 국유림관리소장에게 위임되어 있음 [[D-47|영 제47조④4]]');
    } else {
      who = '시장·군수·구청장';
      why.push('공유림·사유림에서 난 중소형 산불 → 관할 시장·군수·구청장(특별자치시장·특별자치도지사 포함) [[L-34|법 제34조①]]');
    }
    if (!large && s.span !== 'province') {
      if (hasArea) why.push(`산림 피해면적 ${area}ha < 100ha → 중소형 산불 [[D-21|영 제21조①]]`);
      else notes.push('산림 피해면적을 입력하지 않아 중소형 산불로 가정했습니다.');
      notes.push('100ha 이상으로 커지면 즉시 시·도지사에게 알리고 모든 사항을 인계 [[D-21|영 제21조②]]');
    }
    if (s.span === 'one' && !large) notes.push('산림별 관할 행정청은 「산림자원의 조성 및 관리에 관한 법률」 제4·5조를 따름 [[L-5|법 제5조]]');
    if (s.national) notes.unshift('대형 산불이 국가재난으로 확대될 우려(특별재난지역 선포 요건 규모) → 산림청장이 직접 통합지휘할 수 있음 [[L-34|법 제34조④]] [[D-21|영 제21조⑤]]');
    return { who, why, notes, area: hasArea ? area : null };
  }

  function judgeStage(s) {
    const n = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : null; };
    const area = n(s.area), wind = n(s.wind), hours = n(s.hours), fac = n(s.facilities);
    if (area === null) return null;
    const lvArea = area < 10 ? 0 : area < 100 ? 1 : 2;
    const reasons = [`산불영향구역 ${area}ha → <b>${STAGE_NAMES[lvArea]}</b> (비고 1: 피해 면적이 원칙)`];
    let max = lvArea;
    if (wind !== null) {
      const lv = wind < 3 ? 0 : wind < 11 ? 1 : 2;
      if (lv > lvArea) { reasons.push(`평균풍속 초속 ${wind}m → ${STAGE_NAMES[lv]} 해당 → <b>상위 단계로 발령 가능</b> (비고 2)`); max = Math.max(max, lv); }
      else reasons.push(`평균풍속 초속 ${wind}m → ${STAGE_NAMES[lv]} 해당 (원칙 단계보다 높지 않음)`);
    }
    if (fac !== null && fac > 0) {
      if (s.smallTotal) { reasons.push(`시설피해 우려 + 산불발생 지역 시설 전체 20동 미만 → <b>확산 대응 2단계 발령 가능</b> (비고 3 단서)`); max = 2; }
      else {
        const lv = fac < 20 ? 1 : 2;
        reasons.push(`주요 시설 ${fac}동 피해 우려 → <b>시설피해 기준 ${STAGE_NAMES[lv]}로 발령 가능</b> (비고 3)`);
        max = Math.max(max, lv);
      }
    } else if (fac === 0) reasons.push('시설피해 우려 없음');
    if (hours !== null) {
      const lv = hours < 5 ? 0 : hours < 48 ? 1 : 2;
      reasons.push(`진화예상시간 ${hours}시간 → 표의 ${STAGE_NAMES[lv]} 칸. 비고에 별도 적용 규정이 없어 판단 참고치로 봅니다.`);
    }
    return { base: lvArea, max, reasons };
  }

          <div class="cell"><div class="k">기준일</div><div class="v">${fmt(date)}</div><div class="s">${store.dateOverride ? '가정 날짜 · <a href="#/settings">오늘로 되돌리기</a>' : '기기 날짜 기준 자동 판별'}</div></div>
          ${seasonCell}${revCell}
        </div>
        ${lastLink ? `<div class="row">${lastLink}</div>` : ''}
        <section class="panel">
          <h2 class="section-title">근거법령</h2>
          <div class="laws-list">
            ${C.SOURCES.map(s => `<div class="law"><div><b>${esc(s.name)}</b><div class="meta">${esc(s.meta)}</div><div class="meta">${esc(s.note)}</div></div><a class="btn small ghost" href="#/laws/${s.law}">원문</a></div>`).join('')}
            ${custom}
          </div>
          <p class="small muted">${esc(C.CITED_ONLY)}</p>
          <details class="more">
            <summary>근거법령 추가</summary>
            <form class="stack" data-form="law-add" style="margin-top:8px">
              <div class="fields">
                <div class="field"><label for="law-name">법령명</label><input class="input" id="law-name" name="name" required placeholder="예: 산불방지 업무처리 규정"></div>
                <div class="field"><label for="law-meta">번호·일자</label><input class="input" id="law-meta" name="meta" placeholder="예: 산림청 훈령 제○호, 2026. ○. ○."></div>
                <div class="field full"><label for="law-memo">메모</label><input class="input" id="law-memo" name="memo" placeholder="적용 범위 등"></div>
              </div>
              <p class="small muted">추가한 법령은 이 기기에만 목록으로 저장되며, 판정 로직에는 반영되지 않습니다.</p>
              <div class="row"><button class="btn small primary" type="submit">추가</button></div>
            </form>
          </details>
        </section>
        <section class="stack">
          <h2 class="section-title">자주 여는 표</h2>
          <div class="ref-list">${['jurisdiction', 'stage', 'alert-actions', 'fines'].map(refCard).join('')}</div>
        </section>`,
    };
  }

  const refCard = id => { const r = REF_BY_ID.get(id); return `<a class="ref-link" href="#/refs/${r.id}"><span class="src">${esc(r.src)}</span><b>${esc(r.title)}</b><span>${esc(r.purpose)}</span></a>`; };

  // ── 페이지: 예방 체크리스트 ─────────────────────────
  function pagePrevent() {
    const date = refDate();
    const season = seasonInfo(date);
    const active = C.CHECKLIST.filter(it => isEffective(it.effectiveFrom, date));
    const doneCount = active.filter(it => store.checklist[it.id]?.done).length;
    const pct = active.length ? Math.round(doneCount / active.length * 100) : 0;

    const autoStatus = it => {
      if (it.auto === 'season') {
        return season.on
          ? `<div class="auto-status alert">기준일 ${fmt(date)}은 <b>${season.name} 산불조심기간</b>(기본값)입니다 · ${fmt(season.end)}까지</div>`
          : `<div class="auto-status">기준일 ${fmt(date)}은 기본 산불조심기간이 아닙니다 · 다음 ${season.next.name} ${fmt(season.next.start)} (D-${dayDiff(date, season.next.start)})</div>`;
      }
      if (it.auto === 'hq') {
        return season.on
          ? '<div class="auto-status alert">지금은 산불조심기간 — 대책본부가 설치·운영 중이어야 합니다.</div>'
          : `<div class="auto-status">산불조심기간 시작(${fmt(season.next.start)}) 전까지 설치 준비</div>`;
      }
      return '';
    };

    const items = C.CHECKLIST.map(it => {
      const future = !isEffective(it.effectiveFrom, date);
      const st = store.checklist[it.id];
      const done = !future && st?.done;
      const upcoming = it.upcoming && !isEffective(it.upcoming.from, date)
        ? `<div class="upcoming"><b>⏳ ${fmt(it.upcoming.from)}부터 이렇게 바뀝니다</b><span>${txt(it.upcoming.text)}</span></div>` : '';
      return `
        <article class="check-item ${done ? 'done' : ''} ${future ? 'future' : ''}" id="chk-${it.id}">
          ${future
            ? `<span class="toggle" aria-hidden="true" style="border-style:dashed"></span>`
            : `<button type="button" class="toggle" data-act="check" data-id="${it.id}" aria-pressed="${!!done}" aria-label="${esc(it.title)} ${done ? '미완료로 되돌리기' : '완료 표시'}">${ICON.check}</button>`}
          <div class="body">
            <h3>${future ? `<span class="tag tip">⏳ ${fmt(it.effectiveFrom)} 시행</span>` : ''}${esc(it.title)}</h3>
            ${autoStatus(it)}
            ${done ? `<div class="done-note">완료 · ${fmtStamp(st.at)}</div>` : `<p class="action-now">${txt(it.action)}</p>`}
            <div class="cites">${rich(it.cites)}</div>
            ${upcoming}
            ${it.more ? `<details class="more"><summary>세부 기준</summary><ul>${it.more.map(m => `<li>${txt(m)}</li>`).join('')}</ul></details>` : ''}
          </div>
        </article>`;
    }).join('');

    return {
      tab: 'prevent', crumbs: [['예방 체크리스트']], title: '예방 체크리스트',
      html: `
        <div class="page-head">
          <h1>예방 체크리스트</h1>
          <p class="purpose">산불조심기간 여부와 관계없이 예방·대비 의무를 점검합니다. 미완료 항목에는 지금 할 일이 표시됩니다.</p>
        </div>
        <section class="panel">
          <div class="progress"><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><b>${pct}%</b></div>
          <p class="small muted">${active.length}개 중 ${doneCount}개 완료 · 시행 전 항목은 진행률에서 제외 · 체크 상태는 이 기기에만 저장</p>
        </section>
        <div class="stack">${items}</div>
        <div class="row"><button type="button" class="btn small ghost" data-act="check-reset">체크 전체 초기화</button></div>
        <div class="sticky-fire"><a class="btn fire block" href="${inc() ? '#/respond/' + inc().current : '#/respond/start'}">${inc()?.mode === 'drill' ? '훈련 기록 이어가기' : `산불 발생 인지 → 대응 트리 ${inc() ? '이어가기' : '바로 시작'}`}</a></div>`,
    };
  }

  // ── 페이지: 대응 트리 ──────────────────────────────
  function dd(kind, title, items) {
    if (!items || !items.length) return '';
    return `<section class="dd ${kind}"><h3><span class="dot"></span>${title}</h3><ul>${items.map(it => `<li>${it.k ? `<span class="tag ${it.k}">${KIND_LABEL[it.k]}</span>` : ''}${txt(it.t)}${it.c ? ` <span class="cites">${rich(it.c)}</span>` : ''}</li>`).join('')}</ul></section>`;
  }

  function checkRows(stepId, items) {
    const state = rec().checks[stepId] || {};
    return `<div class="checks">${items.map(it => {
      const on = state[it.id];
      return `<div class="check-row ${on ? 'on' : ''}">
        <button type="button" class="toggle fire-toggle" data-act="step-check" data-step="${stepId}" data-id="${it.id}" aria-pressed="${!!on}" aria-label="${esc(stripTokens(it.t))}">${ICON.check}</button>
        <div><div class="txt">${it.k ? `<span class="tag ${it.k}">${KIND_LABEL[it.k]}</span>` : ''}${txt(it.t)} ${it.c ? `<span class="cites">${rich(it.c)}</span>` : ''}</div>${on ? `<div class="when">확인 ${fmtStamp(on)}</div>` : ''}</div>
      </div>`;
    }).join('')}</div>`;
  }

  const seg = (bind, value, options, cls = '') => `<div class="seg ${cls}" role="group">${options.map(([v, label, extra]) => `<button type="button" class="${extra || ''}" data-act="seg" data-bind="${bind}" data-value="${esc(v)}" aria-pressed="${value === v}">${esc(label)}</button>`).join('')}</div>`;

  function calcCommand() {
    const s = rec().inputs.command;
    return `<section class="calc" id="calc-command">
      <h3>지휘권 판정</h3>
      <div class="fields">
        <div class="field"><label for="cmd-area">산림 피해면적</label><div class="input-unit"><input class="input" id="cmd-area" type="number" inputmode="decimal" min="0" step="0.1" data-bind="command.area" value="${esc(s.area)}" placeholder="예: 35"><span>ha</span></div><span class="hint" id="cmd-area-hint">${areaHint(s.area)}</span></div>
        <div class="field"><span class="lbl">발생 범위</span>${seg('command.span', s.span, [['one', '한 시·군·구 안'], ['county', '둘 이상 시·군·구'], ['province', '둘 이상 시·도']])}</div>
        <div class="field full"><span class="lbl">산림 소유</span>${seg('command.owner', s.owner, [['public', '공유림·사유림'], ['national', '국유림만'], ['mixed', '국유·공유·사유림에 걸침']])}</div>
        <div class="field full">
          <label class="checkline"><input type="checkbox" id="cmd-multi" data-bind="command.multiLarge" ${s.multiLarge ? 'checked' : ''}>같은 시·도 안 다른 곳에서도 대형 산불이 발생했다</label>
          <label class="checkline"><input type="checkbox" id="cmd-national" data-bind="command.national" ${s.national ? 'checked' : ''}>특별재난지역 선포 요건을 충족할 규모의 피해 가능성이 있다</label>
        </div>
      </div>
      <div id="verdict-command">${verdictCommand()}</div>
    </section>`;
  }
  const areaHint = v => { const x = parseFloat(v); return Number.isFinite(x) ? `= ${Math.round(x * 10000).toLocaleString('ko-KR')}㎡ · 대형 기준 100ha(100만㎡)` : '1ha = 10,000㎡ · 대형 기준 100ha(100만㎡)'; };
  function verdictCommand() {
    const r = judgeCommand(rec().inputs.command);
    return `<div class="verdict">
      <div class="small muted">통합지휘권자</div>
      <div class="who">${esc(r.who)}</div>
      <ul>${r.why.map(w => `<li>${rich(w)}</li>`).join('')}</ul>
      ${r.notes.length ? `<div class="notes"><ul>${r.notes.map(w => `<li>${rich(w)}</li>`).join('')}</ul></div>` : ''}
    </div>`;
  }

  function calcStage() {
    const s = rec().inputs.stage;
    const f = (id, bind, label, unit, ph) => `<div class="field"><label for="${id}">${label}</label><div class="input-unit"><input class="input" id="${id}" type="number" inputmode="decimal" min="0" step="0.1" data-bind="${bind}" value="${esc(s[bind.split('.')[1]])}" placeholder="${ph}"><span>${unit}</span></div></div>`;
    return `<section class="calc" id="calc-stage">
      <h3>대응 단계 판정 <span class="cites">[[T:stage]]</span></h3>
      <div class="fields">
        ${f('stg-area', 'stage.area', '피해 면적(산불영향구역)', 'ha', '예: 30')}
        ${f('stg-wind', 'stage.wind', '기상 상태(평균 풍속)', 'm/s', '예: 8')}
        ${f('stg-hours', 'stage.hours', '진화예상시간', '시간', '예: 12')}
        ${f('stg-fac', 'stage.facilities', '피해 우려 주요 시설', '동', '없으면 0')}
        <div class="field full"><label class="checkline"><input type="checkbox" id="stg-small" data-bind="stage.smallTotal" ${s.smallTotal ? 'checked' : ''}>산불발생 지역의 시설 전체 규모가 20동 미만이다</label><span class="hint">“주요 시설” = 주택 + 산불상황관제시스템에 등재된 국가유산·원자력발전소 등 국가 중요시설</span></div>
      </div>
      <div id="verdict-stage">${verdictStage()}</div>
    </section>`.replace('[[T:stage]]', citeHtml('T:stage'));
  }
  function verdictStage() {
    const r = judgeStage(rec().inputs.stage);
    if (!r) return '<div class="verdict"><div class="small muted">산불영향구역(ha)을 입력하면 단계를 판정합니다.</div></div>';
    return `<div class="verdict">
      <div class="stage-scale">${STAGE_NAMES.map((n, i) => `<div class="s ${i === r.base ? 'base' : ''} ${i === r.max && r.max > r.base ? 'max' : ''}"><div class="lab">${i === r.base ? '원칙' : i === r.max && r.max > r.base ? '발령 가능' : ''}</div><b>${n}</b></div>`).join('')}</div>
      <ul>${r.reasons.map(x => `<li>${x}</li>`).join('')}</ul>
      <p class="small muted">발령은 산림청장이 합니다. 이 판정은 보고·건의용 참고입니다.</p>
    </div>`;
  }

  function calcAlert() {
    const cur = rec().inputs.alert;
    const row = C.T_ALERT.find(r => r.lv === cur);
    const checks = rec().inputs.alertChecks[cur] || {};
    return `<section class="calc" id="calc-alert">
      <h3>현재 산불경보</h3>
      ${seg('alert', cur, C.T_ALERT.map(r => [r.lv, r.lv, r.cls]), 'levels')}
      ${row ? `<div class="verdict">
        <div class="lv ${row.cls}">${row.lv}</div>
        <div class="why"><b>발령기준</b> ${esc(row.criteria)} ${citeHtml('T:alert-criteria')}</div>
        <div class="why"><b>배치·비상대기</b> ${esc(row.staff)} ${citeHtml('T:alert-actions')}</div>
        <div class="checks">${row.other.map((o, i) => {
          const on = checks[i];
          return `<div class="check-row ${on ? 'on' : ''}"><button type="button" class="toggle fire-toggle" data-act="alert-check" data-i="${i}" aria-pressed="${!!on}" aria-label="${esc(o)}">${ICON.check}</button><div><div class="txt"><span class="tag must">의무</span>${esc(o)}</div>${on ? `<div class="when">이행 ${fmtStamp(on)}</div>` : ''}</div></div>`;
        }).join('')}</div>
      </div>` : '<p class="small muted">발령된 경보 단계를 고르면 이행할 조치가 나옵니다.</p>'}
    </section>`;
  }

  function calcCooperate() {
    const ag = rec().inputs.agencies;
    const L = rec().inputs.letter;
    const pendingPaper = C.T_COOP.filter(a => ag[a.no]?.at && ag[a.no]?.phone && !ag[a.no]?.paper).length;
    const rows = C.T_COOP.map(a => {
      const st = ag[a.no] || {};
      return `<div class="check-row ${st.at ? 'on' : ''}">
        <button type="button" class="toggle fire-toggle" data-act="agency" data-no="${a.no}" aria-pressed="${!!st.at}" aria-label="${esc(a.name)} 요청">${ICON.check}</button>
        <div class="stack" style="gap:4px">
          <div class="txt"><b>${esc(a.name)}</b>${a.scope ? ` <span class="small muted">${esc(a.scope)}</span>` : ''} <span class="cites">${rich(a.c)}</span></div>
          ${st.at ? `<div class="row small"><span class="when">요청 ${fmtStamp(st.at)}</span>
            <label class="checkline"><input type="checkbox" data-act-change="agency-flag" data-no="${a.no}" data-flag="phone" ${st.phone ? 'checked' : ''}>긴급 유선 요청</label>
            <label class="checkline"><input type="checkbox" data-act-change="agency-flag" data-no="${a.no}" data-flag="paper" ${st.paper ? 'checked' : ''}>서면 처리 완료</label></div>` : ''}
        </div>
      </div>`;
    }).join('');
    return `<section class="calc" id="calc-cooperate">
      <h3>요청 기관 체크</h3>
      ${pendingPaper ? `<div class="auto-status alert">사후 서면 처리가 남은 유선 요청 ${pendingPaper}건 ${citeHtml('D-22|영 제22조③')}</div>` : ''}
      <div class="checks">${rows}</div>
      <h3 style="margin-top:6px">협조 요청 문안 만들기 <span class="tag tip">실무</span></h3>
      <p class="small muted">영 제22조③의 필수 기재사항(목적·사유, 장비·인력 규모, 요청기간)을 채우는 참고 문안입니다. 법정 서식이 아닙니다.</p>
      <div class="fields">
        <div class="field"><label for="let-to">요청 대상</label><select class="input" id="let-to" data-bind="letter.to"><option value="">선택</option>${C.T_COOP.map(a => `<option ${L.to === a.name ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
        <div class="field"><label for="let-period">요청기간</label><input class="input" id="let-period" data-bind="letter.period" value="${esc(L.period)}" placeholder="예: 3. 14. 06:00 ~ 진화 완료 시"></div>
        <div class="field full"><label for="let-purpose">요청 목적·사유</label><input class="input" id="let-purpose" data-bind="letter.purpose" value="${esc(L.purpose)}" placeholder="예: ○○군 ○○면 산불 확산 방지 및 주민 대피로 통제"></div>
        <div class="field"><label for="let-eq">장비 규모</label><input class="input" id="let-eq" data-bind="letter.equipment" value="${esc(L.equipment)}" placeholder="예: 소방차 5대"></div>
        <div class="field"><label for="let-pp">인력 규모</label><input class="input" id="let-pp" data-bind="letter.personnel" value="${esc(L.personnel)}" placeholder="예: 40명"></div>
        <div class="field full"><label for="let-place">집결지·연락처</label><input class="input" id="let-place" data-bind="letter.place" value="${esc(L.place)}" placeholder="예: ○○초등학교 운동장, 통합지휘본부 010-0000-0000"></div>
      </div>
      <textarea class="input template-out" id="letter-out" readonly aria-label="협조 요청 문안">${esc(letterText())}</textarea>
      <div class="row"><button type="button" class="btn small" data-act="copy" data-target="letter-out">문안 복사</button></div>
    </section>`;
  }
  function letterText() {
    const L = rec().inputs.letter;
    const blank = v => v || '(          )';
    const lines = [
      '[산불 진화 협조 요청]',
      `수신: ${blank(L.to)}의 장`,
      '발신: 산불현장 통합지휘본부장',
      '근거: 「산림재난방지법」 제36조, 같은 법 시행령 제22조',
      '',
      `1. 요청 목적·사유: ${blank(L.purpose)}`,
      `2. 장비 규모: ${blank(L.equipment)}`,
      `3. 인력 규모: ${blank(L.personnel)}`,
      `4. 요청기간: ${blank(L.period)}`,
      `5. 집결지·연락처: ${blank(L.place)}`,
      '6. 경비: 협조에 드는 경비는 통합지휘본부장이 예산 범위에서 부담합니다(시행령 제22조④).',
    ];
    if (L.to === '민간항공기 운영자') lines.push('7. 민간항공기 운항비용을 지급하고, 손실이 발생하면 보상합니다(시행령 제22조②).');
    if (L.to === '소방관서') lines.push('※ 「소방기본법」 제16조의2제1항에 따른 소방지원활동 범위의 요청입니다.');
    lines.push('', '※ 긴급하여 유선으로 먼저 요청한 경우 이 문서로 사후 처리합니다.');
    return lines.join('\n');
  }

  function reportDraft() {
    const I = rec().inputs;
    const cmd = judgeCommand(I.command);
    const stg = judgeStage(I.stage);
    const owner = { public: '공유림·사유림', national: '국유림', mixed: '국유·공유·사유림 혼재' }[I.command.owner];
    const agencies = C.T_COOP.filter(a => I.agencies[a.no]?.at).map(a => a.name).join(', ');
    const teams = rec().checks.icp?.teams ? '5개 반 편성 완료' : '반 편성 (  )';
    const b = '(    )';
    return [
      '[산불 발생 및 피해 상황 보고 초안] ※ 별지 제9호서식 항목 순서 · 빈칸은 확인 후 기재',
      `1. 일시: 가. 발화 ${b} ${isViewing() ? "" : `(앱 인지 기록 ${fmtStamp(rec().startedAt)})`}  나. 주불진화종료 ${b}  다. 잔불진화종료 ${b}  라. 뒷불감시종료 ${b}`,
      `2. 장소: ${b} (GPS ${b}) - 발화 지점: ${b} - 입산통제구역 지정 여부: ${b}`,
      `3. 소유 구분: ${owner} (소관 ${b})`,
      `4. 발생 원인: ${b}`,
      `5. 피해 상황: 산림 피해면적 ${cmd.area !== null ? cmd.area + 'ha' : b} / 산림 외 피해 ${b} / 피해액 합계 ${b}천원`,
      `6. 동원 인원: 총 ${b}명 (공무원, 진화대원(전문·공중·지상·보조), 경찰, 소방대, 군인, 그 밖의 인원)`,
      `7. 가해자: ${b}`,
      `8. 산불 발생 신고인: 가. 신고시간 ${b}  나. 신고인 ${b}`,
      `9. 진화지휘자: ${cmd.who} ${b}`,
      `10. 동원 장비: ${b}${agencies ? ` / 협조 요청 기관: ${agencies}` : ''}`,
      `11. 뒷불감시 책임자: ${b}`,
      `12. 뒷불감시 조치사항: ${b}`,
      `13. 산불현장 통합지휘본부 운영 결과: ${teams}${stg ? ` / 대응 단계 판단: ${STAGE_NAMES[stg.max]}` : ''}${I.alert ? ` / 산불경보: ${I.alert}` : ''} / 문제점·개선방안 ${b}`,
      '14. 그 밖의 사항: 끝.',
    ].join('\n');
  }

  function stepCard(step) {
    const I = rec();
    const phase = C.PHASES.find(p => p.steps.includes(step.id));
    const choice = step.choices?.find(c => c.id === I.choice[step.id]);
    const idx = C.STEPS.indexOf(step);
    const prev = C.STEPS[idx - 1], next = C.STEPS[idx + 1];
    const doneAt = I.done[step.id];

    let body = '';
    if (step.choices) {
      body += `<div class="choices">${step.choices.map(c => `<button type="button" class="choice" data-act="choice" data-step="${step.id}" data-id="${c.id}" aria-pressed="${choice?.id === c.id}">${esc(c.label)}</button>`).join('')}</div>`;
      if (choice) {
        body += dd('do', '지금 할 일', choice.do) + dd('dont', '하면 안 되는 일', choice.dont);
        if (choice.upcoming) {
          body += isEffective(choice.upcoming.from)
            ? dd('do', '함께 확인', [{ k: 'must', t: choice.upcoming.text, c: choice.upcoming.c }])
            : `<div class="upcoming"><b>⏳ ${fmt(choice.upcoming.from)}부터 이렇게 바뀝니다</b><span>${txt(choice.upcoming.text)} ${rich(choice.upcoming.c || '')}</span></div>`;
        }
        if (choice.handoverChecks) body += `<section class="dd note"><h3><span class="dot"></span>인계 확인 항목 <span class="tag tip">실무</span></h3>${checkRows(step.id, C.HANDOVER_CHECKS.map((t, i) => ({ id: 'h' + i, t })))}</section>`;
      }
    }
    if (step.calc === 'command') body += calcCommand();
    if (step.calc === 'stage') body += calcStage();
    if (step.calc === 'alert') body += calcAlert();
    if (step.calc === 'cooperate') body += calcCooperate();
    if (step.checks) body += `<section class="dd note"><h3><span class="dot"></span>확인 목록</h3>${checkRows(step.id, step.checks)}</section>`;
    if (step.table) body += `<div class="stack"><h3 class="section-title">${esc(REF_BY_ID.get(step.table).title)}</h3>${refTable(step.table)}</div>`;
    if (!step.choices) body += dd('do', '지금 할 일', step.do) + dd('dont', '하면 안 되는 일', step.dont);
    if (step.report) {
      body += `<section class="dd note"><h3><span class="dot"></span>별지 제9호서식 기재 항목</h3>
        <div class="table-wrap"><table><tbody>${C.REPORT_FIELDS.map((f, i) => `<tr><td class="nowrap mono">${i + 1}</td><td class="nowrap"><b>${esc(f[0])}</b></td><td>${esc(f[1])}</td></tr>`).join('')}</tbody></table></div>
        <textarea class="input template-out" id="report-out" readonly aria-label="보고 초안">${esc(reportDraft())}</textarea>
        <div class="row"><button type="button" class="btn small" data-act="copy" data-target="report-out">보고 초안 복사</button><span class="small muted">앞 단계 입력값(면적·지휘권자·협조기관 등)으로 채운 초안</span></div>
      </section>`;
    }

    const nextLabel = step.id === 'complete' ? '조사·복구로 이동 →' : next ? `다음: ${next.no}. ${next.short} →` : '';
    return `
      <article class="panel lift step-card">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div class="stack" style="gap:2px">
            <span class="step-no">${step.no} / ${C.STEPS.length} · ${esc(phase.label)}</span>
            <h2>${esc(step.title)}</h2>
          </div>
          ${starBtn('step:' + step.id, step.title)}
        </div>
        <div class="cites">${rich(step.cites)}</div>
        <p class="question">${esc(step.question)}</p>
        ${body}
        <div class="step-nav">
          ${prev ? `<a class="btn small ghost" href="#/respond/${prev.id}">← 이전</a>` : '<span></span>'}
          ${isViewing() ? '' : `<button type="button" class="btn small ${doneAt ? '' : 'primary'}" data-act="step-done" data-step="${step.id}">${doneAt ? `완료됨 ${fmtStamp(doneAt)} · 취소` : '이 단계 완료'}</button>`}
          ${next ? `<a class="btn small fire" href="#/respond/${next.id}">${nextLabel}</a>` : isViewing() ? '<a class="btn small ghost" href="#/respond">대응 트리 처음 화면</a>' : `<button type="button" class="btn small fire" data-act="incident-end">대응 기록 종료</button>`}
        </div>
      </article>`;
  }

  function pageRespond(parts) {
    const sub = parts[1];
    if (sub === 'start') {
      if (!inc()) startIncident('live', ui.prevHash);
      location.replace('#/respond/' + inc().current);
      return null;
    }
    if (!inc() && !sub) {
      return {
        tab: 'respond', crumbs: [['대응 트리']], title: '대응 트리',
        html: `
          <div class="page-head"><h1>대응 트리</h1><p class="purpose">산불 인지부터 조사·복구까지 12단계 질문에 답하며 할 일과 근거를 확인합니다.</p></div>
          <section class="panel lift">
            <div class="cta-pair">
              <button type="button" class="cta respond" data-act="incident-start" data-mode="live" style="border:0;text-align:left;cursor:pointer"><b>실제 산불 — 대응 시작</b><span>인지 시각을 기록하고 1단계부터</span></button>
              <button type="button" class="cta" data-act="incident-start" data-mode="drill" style="border:1px solid var(--line);background:var(--surface-2);color:var(--ink);text-align:left;cursor:pointer"><b>훈련 모드로 시작</b><span>교육·점검용. 시각·체크를 훈련 기록으로 남깁니다</span></button>
            </div>
            <a class="btn block" href="#/respond/report">기록 없이 열람하기 — 12단계 내용만 읽기</a>
            <p class="small muted">표시: <span class="tag must">의무</span>법령상 “~하여야” · <span class="tag may">재량</span>“~할 수 있다” · <span class="tag tip">실무</span>앱이 덧붙인 현장 팁 · <span class="tag info">참고</span>알아둘 사항</p>
          </section>
          ${C.PHASES.map(p => `<section class="stack"><h2 class="section-title">${esc(p.label)}</h2><div class="list">${p.steps.map(id => { const s = STEP_BY_ID.get(id); return `<a href="#/respond/${s.id}"><div class="l"><span>${s.no}. ${esc(s.title)}</span><small>${esc(s.question)}</small></div><span class="chev">›</span></a>`; }).join('')}</div></section>`).join('')}`,
      };
    }
    const R = rec();
    const step = STEP_BY_ID.get(sub) || STEP_BY_ID.get(R.current);
    if (!STEP_BY_ID.has(sub)) { location.replace('#/respond/' + step.id); return null; }
    if (R.current !== step.id) { R.current = step.id; save(); }
    const viewing = isViewing();

    const rail = C.PHASES.map(p => `<span class="phase">${esc(p.label)}</span>${p.steps.map(id => {
      const s = STEP_BY_ID.get(id);
      return `<a href="#/respond/${id}" class="${R.done[id] ? 'done' : ''} ${id === step.id ? 'current' : ''}" ${id === step.id ? 'aria-current="step"' : ''}><span class="n">${s.no}</span>${esc(s.short)}</a>`;
    }).join('')}`).join('');

    const bar = viewing
      ? `<section class="incident-bar view">
          <div><div class="t">열람 모드</div><div class="small muted">시각·체크·입력이 저장되지 않습니다. 계산기는 써 볼 수 있습니다.</div></div>
          <div class="row"><button type="button" class="btn small fire" data-act="incident-start" data-mode="live" data-step="${step.id}">실제 산불 — 기록 시작</button><button type="button" class="btn small" data-act="incident-start" data-mode="drill" data-step="${step.id}">훈련 시작</button></div>
        </section>`
      : `<section class="incident-bar ${R.mode === 'drill' ? 'drill' : ''}">
          <div><div class="t">${esc(modeLabel())}</div><div class="small muted">시작 ${fmtStamp(R.startedAt)} · 완료 ${Object.keys(R.done).length}/${C.STEPS.length}단계</div></div>
          <div class="row"><span class="elapsed" data-elapsed="${R.startedAt}">${elapsed(R.startedAt)}</span><button type="button" class="btn small ghost" data-act="incident-end">기록 종료</button></div>
        </section>`;

    return {
      tab: 'respond', crumbs: [[viewing ? '대응 트리(열람)' : '대응 트리', '#/respond'], [`${step.no}. ${step.title}`]], title: `대응 ${step.no}. ${step.short}`,
      html: `
        ${bar}
        <nav class="rail" aria-label="대응 단계">${rail}</nav>
        ${stepCard(step)}
        <p class="small muted">표시: <span class="tag must">의무</span><span class="tag may">재량</span><span class="tag tip">실무</span><span class="tag info">참고</span> · ${viewing ? '열람 모드에서는 아무것도 저장되지 않습니다.' : '입력과 체크는 이 기기에만 저장됩니다.'}</p>`,
      after: () => { const a = document.querySelector('.rail a.current'); if (a) a.scrollIntoView({ block: 'nearest', inline: 'center' }); },
    };
  }

  // ── 참조표 ───────────────────────────────────────
  const JURIS = [
    ['중소형 산불(산림 피해면적 100만㎡ 미만) — 관할 안에서 발생', '관할 시장·군수·구청장(특별자치시장·특별자치도지사 포함) 또는 지방산림청장', '국유림 중소형 산불 지휘권은 국유림관리소장에게 위임', '[[L-34|법 제34조①]] [[D-47|영 제47조④4]]'],
    ['국유림·공유림·사유림에 걸쳐 발생', '시장·군수·구청장(특별자치시장·특별자치도지사 포함)', '“하여야 한다” — 지방산림청장이 맡지 않음', '[[L-34|법 제34조① 단서]]'],

    ['시·도 관할 안 두 곳 이상에서 대형 산불', '시·도지사', '한 곳 이상의 지휘권을 시장·군수·구청장에게 위임 가능', '[[L-34|법 제34조② 단서]] [[D-21|영 제21조③]]'],
    ['둘 이상의 시·군·구에 걸쳐 발생', '시·도지사', '중소형·동시다발 등이면 시장·군수·구청장에게 위임 가능', '[[L-34|법 제34조③]] [[D-21|영 제21조④]]'],
    ['둘 이상의 시·도에 걸쳐 발생', '산림청장', '시·도지사에게 위임 가능', '[[L-34|법 제34조③]] [[D-21|영 제21조④]]'],
    ['국가재난 확대 우려 대형 산불(특별재난지역 선포 요건 규모 피해 가능성 등)', '산림청장이 통합지휘할 수 있음', '제34조②③에도 불구하고 적용', '[[L-34|법 제34조④]] [[D-21|영 제21조⑤]]'],

          ${C.T_ALERT.map(r => `<tr><td class="nowrap"><span class="lv ${r.cls}">${r.lv}</span></td><td>${r.staff.split(' / ').map(x => `○ ${esc(x)}`).join('<br>')}</td><td>${r.other.map(x => `○ ${esc(x)}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>

          ${['인명 보호', '국가기간산업시설, 군사시설 및 국가유산의 보호', '가옥 등 재산 보호', '산림보호구역, 채종림(종자 생산을 목적으로 하는 산림), 시험림 등 중요 산림자원의 보호', '그 밖에 산림지역의 산불 확산 방지'].map((x, i) => `<tr><td class="num mono">${i + 1}</td><td>${esc(x)}</td></tr>`).join('')}</tbody></table></div>
          <div class="notes"><p>법 제31조제3항에 따라 산불을 진화할 때에는 위 순서에 따라 진화해야 한다. ${rich('[[R-19|규칙 제19조①]]')}</p></div>`;
