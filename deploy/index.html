<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e5b3a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="산불지휘">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="산림재난방지법·시행령·시행규칙에 근거한 산불 현장지휘관 행동지침">
<title>산불현장지휘 매뉴얼</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>:root {
  --ground: #edf1ec;
  --surface: #ffffff;
  --surface-2: #f5f8f4;
  --ink: #16201a;
  --ink-2: #4a574f;
  --ink-3: #6f7c74;
  --line: #d2dbd3;
  --forest: #1e5b3a;
  --forest-ink: #ffffff;
  --forest-soft: #dfece2;
  --fire: #b42318;
  --fire-ink: #ffffff;
  --fire-soft: #fbe7e4;
  --amber: #9a5200;
  --amber-soft: #fcefd8;
  --amber-line: #efcf9c;
  --focus: #2764c5;
  --lv-blue: #1d64c4;
  --lv-yellow: #b88a00;
  --lv-orange: #d35f00;
  --lv-red: #c21d2e;
  --shadow: 0 1px 2px rgba(22, 32, 26, .06), 0 4px 16px rgba(22, 32, 26, .06);
  --radius: 10px;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1310;
    --surface: #161d19;
    --surface-2: #1c2520;
    --ink: #e3eae5;
    --ink-2: #a9b6ad;
    --ink-3: #849189;
    --line: #2b3730;
    --forest: #7cc596;
    --forest-ink: #0e1310;
    --forest-soft: #1b3325;
    --fire: #ff7b6b;
    --fire-ink: #1a0c0a;
    --fire-soft: #3a1b18;
    --amber: #f0b45a;
    --amber-soft: #33270f;
    --amber-line: #5a4418;
    --focus: #7fb0ff;
    --lv-blue: #6ea6f5;
    --lv-yellow: #e6c24a;
    --lv-orange: #ff9a4d;
    --lv-red: #ff6b76;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  --ground: #0e1310;
  --surface: #161d19;
  --surface-2: #1c2520;
  --ink: #e3eae5;
  --ink-2: #a9b6ad;
  --ink-3: #849189;
  --line: #2b3730;
  --forest: #7cc596;
  --forest-ink: #0e1310;
  --forest-soft: #1b3325;
  --fire: #ff7b6b;
  --fire-ink: #1a0c0a;
  --fire-soft: #3a1b18;
  --amber: #f0b45a;
  --amber-soft: #33270f;
  --amber-line: #5a4418;
  --focus: #7fb0ff;
  --lv-blue: #6ea6f5;
  --lv-yellow: #e6c24a;
  --lv-orange: #ff9a4d;
  --lv-red: #ff6b76;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { background: var(--ground); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--forest); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.3; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }

/* ── 상단 바 ───────────────────────────── */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar-row {
  max-width: 780px;
  margin: 0 auto;
  padding: 10px 16px 6px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  background: var(--forest); color: var(--forest-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.incident-on .brand-mark { background: var(--fire); color: var(--fire-ink); }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.topbar-spacer { flex: 1; }
.chip-btn {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 4px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; color: var(--ink-2);
}
.chip-btn.override { border-color: var(--amber-line); background: var(--amber-soft); color: var(--amber); font-weight: 600; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; }
.crumbs {
  max-width: 780px; margin: 0 auto; padding: 0 16px 8px;
  font-size: 12px; color: var(--ink-3);
  display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center;
}
.crumbs .mode { font-weight: 600; color: var(--forest); }
.incident-on .crumbs .mode { color: var(--fire); }
.crumbs .sep { opacity: .6; }
.crumbs a { color: inherit; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }

/* ── 본문 ─────────────────────────────── */
main {
  max-width: 780px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.page-head { display: flex; flex-direction: column; gap: 4px; }
.page-head h1 { font-size: 22px; letter-spacing: -.02em; }
.purpose { font-size: 13px; color: var(--ink-2); }
.purpose::before { content: "이 화면은 "; color: var(--ink-3); }
.purpose.plain::before { content: ""; }
.section-title { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; margin-top: 4px; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.panel.flat { box-shadow: none; }
.panel.lift { box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ── 버튼 ─────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  padding: 9px 14px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink);
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--forest); border-color: var(--forest); color: var(--forest-ink); }
.btn.fire { background: var(--fire); border-color: var(--fire); color: var(--fire-ink); }
.btn.primary:hover, .btn.fire:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.block { width: 100%; }
.cta-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cta {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 14px; border-radius: var(--radius); text-decoration: none; border: 1px solid transparent;
}
.cta b { font-size: 16px; }
.cta span { font-size: 12px; opacity: .9; }
.cta.prevent { background: var(--forest); color: var(--forest-ink); }
.cta.respond { background: var(--fire); color: var(--fire-ink); }
@media (max-width: 420px) { .cta-pair { grid-template-columns: 1fr; } }

/* ── 근거 배지 ─────────────────────────── */
.cite {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font); font-size: 12px; font-weight: 500; line-height: 1.2;
  padding: 2px 7px; margin: 1px 2px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  cursor: pointer; white-space: nowrap; vertical-align: 1px;
}
.cite::before { content: "근거"; font-size: 10px; color: var(--ink-3); }
.cite.table::before { content: "표"; }
.cite.ext { cursor: help; border-style: dashed; }
.cite.ext::before { content: "인용"; }
.cite:hover { border-color: var(--forest); color: var(--forest); }
.cite.ext:hover { border-color: var(--line); color: var(--ink-2); }
.cites { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }

.tag {
  display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px;
  vertical-align: 1px; white-space: nowrap; margin-right: 4px;
}
.tag.must { background: var(--fire-soft); color: var(--fire); }
.tag.may { background: var(--forest-soft); color: var(--forest); }
.tag.tip { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.tag.info { background: var(--surface-2); color: var(--ink-3); }

/* ── 시행일 배너 ───────────────────────── */
.upcoming {
  border: 1px solid var(--amber-line); background: var(--amber-soft); color: var(--ink);
  border-radius: 8px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px;
}
.upcoming > b { color: var(--amber); }
.effective-now {
  border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 8px; padding: 10px 12px; font-size: 13px;
}

/* ── 온보딩 ───────────────────────────── */
.onboard { gap: 14px; }
.onboard h2 { font-size: 15px; }
.onboard ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.onboard .block { display: flex; flex-direction: column; gap: 6px; }
.onboard .lead { font-size: 15px; }
.onboard-mini { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.status-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.status-strip .cell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.status-strip .k { font-size: 11px; color: var(--ink-3); }
.status-strip .v { font-size: 15px; font-weight: 600; }
.status-strip .s { font-size: 12px; color: var(--ink-2); }
@media (max-width: 560px) { .status-strip { grid-template-columns: 1fr; } }
.laws-list { display: flex; flex-direction: column; gap: 0; }
.laws-list .law { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.laws-list .law:first-child { border-top: none; }
.laws-list .law .meta { font-size: 12px; color: var(--ink-2); }

/* ── 진행률 / 체크리스트 ───────────────── */
.progress { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--forest); border-radius: 99px; transition: width .25s; }
.progress b { font-size: 20px; font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }

.check-item {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;
}
.check-item.done { background: var(--surface-2); }
.check-item.future { border-style: dashed; }
.check-item h3 { font-size: 15px; font-weight: 600; }
.check-item .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.toggle {
  width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--ink-3); background: var(--surface);
  cursor: pointer; display: grid; place-items: center; margin-top: 1px; padding: 0;
}
.toggle svg { width: 16px; height: 16px; stroke: var(--forest-ink); stroke-width: 3; fill: none; opacity: 0; }
.toggle[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); }
.toggle[aria-pressed="true"] svg { opacity: 1; }
.fire-toggle[aria-pressed="true"] { background: var(--fire); border-color: var(--fire); }
.fire-toggle svg { stroke: var(--fire-ink); }
.action-now { font-size: 14px; }
.action-now::before { content: "지금 할 일 "; font-weight: 700; color: var(--fire); font-size: 12px; margin-right: 2px; }
.done-note { font-size: 12px; color: var(--forest); font-weight: 600; }
.auto-status { font-size: 13px; padding: 6px 10px; border-radius: 6px; background: var(--forest-soft); color: var(--ink); }
.auto-status.alert { background: var(--fire-soft); }
details.more > summary { cursor: pointer; font-size: 13px; color: var(--ink-2); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "▸ "; }
details.more[open] > summary::before { content: "▾ "; }
details.more ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.sticky-fire {
  position: sticky; bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px)); z-index: 5;
}

/* ── 대응 트리 ─────────────────────────── */
.incident-bar {
  display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  background: var(--fire-soft); border: 1px solid var(--fire); border-radius: var(--radius); padding: 10px 14px;
}
.incident-bar .t { font-weight: 700; color: var(--fire); }
.incident-bar .elapsed { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
.incident-bar.drill { background: var(--amber-soft); border-color: var(--amber-line); }
.incident-bar.drill .t { color: var(--amber); }
.incident-bar.view { background: var(--surface); border-color: var(--line); border-style: dashed; }
.incident-bar.view .t { color: var(--ink); }
.dialog-backdrop { z-index: 60; align-items: center; padding: 16px; }
.dialog {
  width: 100%; max-width: 420px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
  padding: 20px; display: flex; flex-direction: column; gap: 10px;
}
.dialog h2 { font-size: 18px; }
.dialog p { font-size: 14px; color: var(--ink-2); }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
.undo-bar {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 35;
  bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px));
  width: min(748px, calc(100% - 32px));
  display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--fire); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 10px 14px; font-size: 13px;
}
.undo-bar[hidden] { display: none; }
body.undo-on .toast { bottom: calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); }
body.undo-on .sticky-fire { visibility: hidden; }
.rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.rail a {
  flex: none; display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink-2);
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px 5px 5px; font-size: 13px;
}
.rail a .n {
  width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center;
  background: var(--surface-2); font-family: var(--mono); font-size: 12px; border: 1px solid var(--line);
}
.rail a.done .n { background: var(--forest); color: var(--forest-ink); border-color: var(--forest); }
.rail a.current { border-color: var(--fire); color: var(--ink); font-weight: 600; }
.rail a.current .n { border-color: var(--fire); }
.rail .phase { flex: none; align-self: center; font-size: 11px; color: var(--ink-3); padding: 0 4px; }
.step-card { gap: 14px; }
.step-no { font-family: var(--mono); font-size: 12px; color: var(--fire); font-weight: 600; }
.step-card h2 { font-size: 20px; letter-spacing: -.01em; }
.question { font-size: 16px; font-weight: 600; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--fire); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px;
  cursor: pointer; font-weight: 500; display: flex; gap: 10px; align-items: center;
}
.choice::before { content: ""; width: 16px; height: 16px; border-radius: 99px; border: 2px solid var(--ink-3); flex: none; }
.choice[aria-pressed="true"] { border-color: var(--fire); background: var(--fire-soft); }
.choice[aria-pressed="true"]::before { border: 5px solid var(--fire); }
.dd { display: flex; flex-direction: column; gap: 8px; }
.dd h3 { font-size: 13px; font-weight: 700; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; }
.dd h3 .dot { width: 8px; height: 8px; border-radius: 99px; }
.dd.do h3 { color: var(--forest); }
.dd.do h3 .dot { background: var(--forest); }
.dd.dont h3 { color: var(--fire); }
.dd.dont h3 .dot { background: var(--fire); }
.dd.note h3 { color: var(--ink-2); }
.dd.note h3 .dot { background: var(--ink-3); }
.dd ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.dd li { padding-left: 14px; position: relative; font-size: 14px; }
.dd li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 1.5px; background: var(--ink-3); }
.dd.dont li::before { background: var(--fire); }
.step-nav { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.check-row {
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
}
.check-row.on { background: var(--surface-2); }
.check-row .toggle { width: 24px; height: 24px; border-radius: 6px; }
.check-row .toggle svg { width: 13px; height: 13px; }
.check-row .txt { font-size: 14px; }
.check-row .when { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }

/* ── 계산기 ───────────────────────────── */
.calc { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.calc h3 { font-size: 14px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
@media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .field .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 11px; color: var(--ink-3); }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 10px; font-size: 15px;
}
textarea.input { min-height: 72px; resize: vertical; font-size: 14px; }
.input-unit { display: flex; align-items: center; gap: 6px; }
.input-unit span { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 10px; font-size: 13px; cursor: pointer;
}
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); font-weight: 600; }
.checkline { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.checkline input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--fire); flex: none; }
.verdict { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.verdict .who { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.verdict .why { font-size: 13px; color: var(--ink-2); }

림재난 위험도평가 결과와 공간정보 기술을 활용하여 산림재난 위험등급을 표현한 지도를 말한다.\n14. “산림재난정보시스템”이란 산림재난 관련 정보와 자료를 수집ㆍ가공ㆍ저장ㆍ검색, 표출, 송수신 및 활용할 수 있도록 체계적으로 구성된 기기ㆍ프로그램 및 데이터베이스 등의 결합체를 말한다."},{"from":"2027-07-08","title":"정의","body":"이 법에서 사용하는 용어의 뜻은 다음과 같다. <개정 2026. 7. 7.>\n1. “산림재난”이란 자연적 또는 인위적으로 발생하여 국민의 생명ㆍ신체ㆍ재산이나 산림 등에 피해를 줄 수 있는 산불, 산사태, 토석류 및 산림병해충을 말한다.\n2. “산불”이란 자연적 또는 인위적으로 발생한 불로 산림이 타는 것을 말한다.\n3. “산사태”란 「사방사업법」 제2조제5호에 따른 산사태를 말한다.\n4. “토석류”란 「사방사업법」 제2조제6호에 따른 토석류를 말한다.\n5. “산림병해충”이란 산림에 있는 식물과 산림이 아닌 지역에 있는 수목(「농어업재해대책법」 제2조제4호에 따른 농작물은 제외한다. 이하 같다)에 해를 끼치는 병과 해충을 말한다.\n6. “산림재난피해지”란 산림재난으로 인하여 피해가 발생한 산림 등으로서 대통령령으로 정하는 지역을 말한다.\n7. “복구”란 산림재난피해지를 인공구조물 설치와 식물의 파종ㆍ식재 등을 통하여 훼손 이전의 상태로 안정화시키는 활동을 말한다.\n8. “산림재난방지”란 산림재난으로 발생하거나 예측되는 피해의 예방ㆍ대비ㆍ대응 및 복구를 위한 다음 각 목의 활동을 말한다.\n가. 산불을 예방ㆍ대비ㆍ대응하고 산불로 발생한 피해를 복구하는 모든 활동(이하 “산불방지”라 한다)\n나. 산사태 및 토석류(이하 “산사태등”이라 한다)를 예방ㆍ대비ㆍ대응하고 산사태등으로 발생한 피해를 복구하는 모든 활동(이하 “산사태등방지”라 한다)\n다. 산림병해충이 발생할 우려가 있거나 발생한 지역에 대하여 발생 여부, 발생 정도, 피해 상황 등을 조사하거나 진단하는 모든 활동(이하 “산림병해충 예찰”이라 한다)과 산림병해충이 발생하지 아니하도록 예방하거나 이미 발생한 산림병해충을 약화시키거나 제거하는 모든 활동(이하 “산림병해충 방제”라 한다)\n9. “산사태취약지역”이란 산사태등으로 인하여 인명 및 재산 피해가 우려되는 지역으로 제22조에 따라 지정 또는 변경하여 고시한 지역을 말한다. 다만, 다음 각 목에 대하여는 적용하지 아니한다.\n가. 「급경사지 재해예방에 관한 법률」 제2조제1호에 따른 급경사지 및 같은 조 제4호에 따른 붕괴위험지역\n나. 「도로법」 제10조에 따른 도로(같은 법 제40조에 따른 접도구역을 포함한다)\n다. 「시설물의 안전 및 유지관리에 관한 특별법」 제2조제1호에 따른 시설물\n10. “산림재난방지기관”이란 산림재난방지에 관한 업무를 수행하는 기관으로서 지방자치단체 및 지방산림청을 말한다.\n11. “산림재난방지유관기관”이란 산림재난방지와 관련되는 중앙행정기관과 그 소속기관 등 대통령령으로 정하는 기관을 말한다.\n12. “산림재난 위험도평가”란 산림재난으로 인한 사회적ㆍ경제적 피해예측과 피해저감 효과를 위하여 기후ㆍ기상 등 자연 정보와 거주ㆍ교통 등 생활적 정보 및 지형ㆍ임상ㆍ토질 등 산지 정보를 활용하여 위험도를 분석ㆍ예측ㆍ평가하는 것을 말한다.\n13. “산림재난 위험지도”란 산림재난 위험도평가 결과와 공간정보 기술을 활용하여 산림재난 위험등급을 표현한 지도를 말한다.\n14. “산림재난정보시스템”이란 산림재난 관련 정보와 자료를 수집ㆍ가공ㆍ저장ㆍ검색, 표출, 송수신 및 활용할 수 있도록 체계적으로 구성된 기기ㆍ프로그램 및 데이터베이스 등의 결합체를 말한다."}]},{"id":"L-3","law":"L","no":"3","label":"제3조","title":"국가와 지방자치단체의 책무","chapter":"제1장 총칙","section":"","versions":[{"from":"2026-02-01","title":"국가와 지방자치단체의 책무","body":"① 국가와 지방자치단체는 산림재난 피해의 예측ㆍ예방ㆍ대비ㆍ대응ㆍ복구와 산림재난으로 인한 피해를 줄이기 위한 연구 및 기술개발 등에 대한 계획을 수립ㆍ시행하여야 한다.\n② 국가와 지방자치단체는 제1항에 따른 책무를 다하기 위하여 필요한 행정적ㆍ재정적 지원방안을 마련하여야 한다."}]},{"id":"L-4","law":"L","no":"4","label":"제4조","title":"적용 범위","chapter":"제1장 총칙","section":"","versions":[{"from":"2026-02-01","title":"적용 범위","body":"이 법은 다음 각 호의 구분에 따른 장소 또는 대상에 대하여 적용한다.\n1. 산불에 관한 규정: 「산림자원의 조성 및 관리에 관한 법률」 제2조제1호에 따른 산림과 산림인접지역[산림으로부터 100미터 이내에 위치한 토지(건물의 부속 토지는 제외한다)를 말한다. 이하 같다]\n2. 산사태등에 관한 규정: 제1호에 따른 산림 및 산림과 잇닿은 토지(제9조제1항에 따른 산림재난 위험도평가 등을 거쳐 산사태등의 영향이 미칠 수 있다고 인정되는 토지로서 대통령령으로 정하는 토지를 말한다. 이하 같다)\n3. 산림병해충에 관한 규정: 제1호에 따른 산림에 있는 식물과 산림이 아닌 지역의 수목"}]},{"id":"L-5","law":"L","no":"5","label":"제5조","title":"산림의 구분과 산림의 관할 행정청","chapter":"제1장 총칙","section":"","versions":[{"from":"2026-02-01","title":"산림의 구분과 산림의 관할 행정청","body":"산림의 구분과 산림별 관할 행정청에 대하여는 「산림자원의 조성 및 관리에 관한 법률」 제4조 및 제5조를 적용한다."}]},{"id":"L-6","law":"L","no":"6","label":"제6조","title":"다른 법률과의 관계","chapter":"제1장 총칙","section":"","versions":[{"from":"2026-02-01","title":"다른 법률과의 관계","body":"산림재난방지 등에 관하여 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다."}]},{"id":"L-7","law":"L","no":"7","label":"제7조","title":"산림재난방지 기본계획 등","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 기본계획 등","body":"① 산림청장은 체계적인 산림재난방지를 위하여 다음 각 호의 사항이 포함된 산림재난방지 기본계획(이하 “기본계획”이라 한다)을 5년마다 수립ㆍ시행하여야 한다. <개정 2026. 5. 12.>\n1. 산림재난방지의 목표 및 추진 방향\n2. 산림재난방지 인력ㆍ시설ㆍ장비 등의 확충에 관한 사항\n3. 산림재난방지 관련 법령의 정비 등 제도 개선에 관한 사항\n4. 산림재난방지를 위한 교육ㆍ훈련, 연구 및 협력에 관한 사항\n5. 산림재난방지 인력의 안전사고 예방에 관한 사항\n6. 그 밖에 산림재난방지에 관하여 대통령령으로 정하는 사항\n② 산림청장은 기본계획을 수립하거나 변경한 때에는 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사ㆍ특별자치도지사(이하 “시ㆍ도지사”라 한다) 및 지방산림청장, 산림재난방지유관기관의 장에게 통보하고, 국회 소관 상임위원회에 제출하여야 한다.\n③ 산림청장은 기본계획을 수립하거나 변경한 때에는 대통령령으로 정하는 바에 따라 이를 공표하여야 한다.\n④ 시ㆍ도지사 및 지방산림청장은 기본계획에 따라 관할 지역의 특성을 고려하여 산림재난방지 지역계획(이하 “지역계획”이라 한다)을 5년마다 수립ㆍ시행하여야 한다.\n⑤ 시ㆍ도지사 및 지방산림청장은 지역계획을 수립하거나 변경한 때에는 산림청장 및 관할 시장ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)에게 통보하여야 한다.\n⑥ 기본계획 및 지역계획은 산림재난별로 수립ㆍ시행할 수 있다.\n⑦ 산림청장, 시ㆍ도지사 및 지방산림청장은 산림재난방지유관기관의 장에게 기본계획 및 지역계획의 수립 또는 변경에 필요한 자료의 제출을 요청할 수 있다. 이 경우 자료의 제출을 요청받은 산림재난방지유관기관의 장은 특별한 사유가 없으면 이에 따라야 한다.\n⑧ 제1항부터 제7항까지에 따른 기본계획 및 지역계획의 수립ㆍ변경과 자료 제출 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-8","law":"L","no":"8","label":"제8조","title":"산림재난방지 시행계획 등","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 시행계획 등","body":"① 산림청장은 기본계획에 따라 매년 산림재난방지 시행계획(이하 “시행계획”이라 한다)을 수립하고 이를 산림재난방지기관의 장 및 산림재난방지유관기관의 장에게 통보하여야 한다. 시행계획을 변경한 때에도 또한 같다.\n② 산림재난방지기관의 장은 시행계획에 따라 관할 지역의 특수성을 고려하여 매년 산림재난방지 지역시행계획(이하 “지역시행계획”이라 한다)을 수립ㆍ시행하여야 한다.\n③ 시행계획 및 지역시행계획은 산림재난별로 수립ㆍ시행할 수 있다.\n④ 산림청장 또는 산림재난방지기관의 장은 산림재난방지유관기관의 장에게 시행계획 및 지역시행계획의 수립 또는 변경에 필요한 자료의 제출을 요청할 수 있다. 이 경우 자료의 제출을 요청받은 산림재난방지유관기관의 장은 특별한 사유가 없으면 이에 따라야 한다.\n⑤ 제1항부터 제4항까지에 따른 시행계획 및 지역시행계획의 수립ㆍ변경과 자료 제출 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-9","law":"L","no":"9","label":"제9조","title":"산림재난 위험도평가ㆍ위험지도","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난 위험도평가ㆍ위험지도","body":"① 산림청장은 산림재난으로 인한 피해예측과 피해저감 등을 위하여 전국을 대상으로 산림재난 위험도평가를 실시하여야 한다.\n② 산림청장은 산림재난방지에 활용할 수 있도록 산림재난 위험도평가 결과를 반영하여 산림재난 위험지도를 제작하고 이를 농림축산식품부령으로 정하는 바에 따라 산림재난방지기관의 장 및 산림재난방지유관기관의 장에게 배 포하여야 한다.\n③ 산림재난방지기관의 장 및 산림재난방지유관기관의 장은 산림재난 위험지도를 이용하여 산림재난방지에 필요한 안전조치를 취하여야 한다.\n④ 산림재난 위험도평가 및 산림재난 위험지도는 산림재난별로 실시 및 제작할 수 있다.\n⑤ 산림재난 위험도평가 및 산림재난 위험지도 제작의 기준ㆍ방법ㆍ내용 및 절차 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-9-2","law":"L","no":"9-2","label":"제9조의2","title":"산림재난 대비 주민대피계획 수립 등","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-11-13","title":"산림재난 대비 주민대피계획 수립 등","body":"① 특별자치시장ㆍ특별자치도지사(제주특별자치도지사를 말한다. 이하 같다)ㆍ시장ㆍ군수ㆍ구청장은 산림재난으로 인한 주민의 인명피해를 예방하기 위하여 관할 지역의 산림재난 위험도평가 결과가 대통령령으로 정하는 기준에 해당하는 경우 주민대피지구의 지정, 대피소 및 대피로의 정비 등 산림재난 대비 주민대피계획(이하 “산림재난 대피계획”이라 한다)을 수립ㆍ시행하여야 한다.\n② 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 산림재난 대피계획을 수립한 경우 이를 산림청장에게 제출하여야 한다.\n③ 산림청장은 산림재난 대피계획의 효율적 시행을 위하여 작성지침을 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장에게 배포할 수 있다.\n④ 그 밖에 산림재난 대피계획의 시행을 위하여 필요한 사항은 대통령령으로 정한다.\n[본조신설 2026. 5. 12.]"}]},{"id":"L-10","law":"L","no":"10","label":"제10조","title":"건축신고 등의 검토","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"건축신고 등의 검토","body":"① 산림 및 산림과 잇닿은 토지의 건축물 등의 신축ㆍ증축ㆍ개축ㆍ재축(再築)ㆍ용도변경 또는 대수선(大修繕)의 허가를 하거나 신고를 수리(受理)할 권한이 있는 행정기관의 장은 허가 신청을 받거나 신고를 받은 때에는 그 건축물 등의 시공지 또는 소재지를 관할하는 지방산림청장에게 대통령령으로 정하는 바에 따라 지체 없이 통보하여야 한다. 다만, 「산지관리법」 제14조에 따른 산지전용허가가 있는 경우는 그러하지 아니하다.\n② 지방산림청장은 제1항에 따라 허가사항이나 신고사항을 통보받은 때에는 산림재난방지를 위하여 대통령령으로 정하는 사항에 대한 검토 자료 또는 의견서를 해당 행정기관의 장에게 제출할 수 있다."}]},{"id":"L-11","law":"L","no":"11","label":"제11조","title":"산림재난정보시스템 구축ㆍ운영 및 산림재난정보 공동활용","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난정보시스템 구축ㆍ운영 및 산림재난정보 공동활용","body":"① 산림청장은 다음 각 호의 정보가 포함된 산림재난정보시스템을 구축ㆍ운영할 수 있다.\n1. 산불위험예보, 산불상황관제, 산불확산예측 등 산불 관련 정보\n2. 산사태 예측정보 등 산사태등 관련 정보\n3. 산림병해충의 발생 및 방제 정보 등 산림병해충 관련 정보\n4. 산림재난 위험지도\n5. 그 밖에 농림축산식품부령으로 정하는 산림재난 관련 정보\n② 산림청장은 산림재난정보시스템 구축을 위하여 산림재난방지기관의 장 또는 산림재난방지유관기관의 장에게 필요한 자료의 제출을 요청할 수 있다. 이 경우 자료의 제출을 요청받은 기관의 장은 특별한 사유가 없으면 이에 따라야 한다.\n③ 산림청장은 제1항 각 호에 따른 정보를 산림재난방지기관의 장에게 제공하여 공동활용하여야 하고, 산림재난방지기관의 장은 이를 산림재난방지 등에 이용ㆍ활용하여야 한다.\n④ 제1항부터 제3항까지에 따른 산림재난정보시스템의 구축ㆍ운영, 자료의 제출과 산림재난정보의 공동활용 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-12","law":"L","no":"12","label":"제12조","title":"중앙산림재난상황실","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"중앙산림재난상황실","body":"① 산림청장은 산림재난정보의 수집ㆍ전파, 상황관리, 산림재난 발생 시 초동조치 및 지휘 등의 업무를 수행하기 위하여 중앙산림재난상황실을 상시 구성ㆍ운영하여야 한다.\n② 중앙산림재난상황실의 구성ㆍ운영 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-13","law":"L","no":"13","label":"제13조","title":"산림재난대응단","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난대응단","body":"산림재난방지기관의 장은 효율적인 산림재난 피해의 예방과 대응을 위하여 필요한 경우 제37조제2항에 따른 산불예방진화대 및 산불재난특수진화대, 제41조제2항에 따른 산사태현장예방단 및 제47조제2항에 따른 산림병해충예찰방제단을 산림재난대응단으로 통합하여 구성ㆍ운영할 수 있다."}]},{"id":"L-14","law":"L","no":"14","label":"제14조","title":"산불조심기간 설정 등","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불조심기간 설정 등","body":"① 산림청장은 산림에 있는 불이 탈 가능성이 있는 물질의 상태와 기상 상태에 따라 산불 발생의 위험 정도를 나타내는 지수(이하 이 조에서 “산불위험지수”라 한다)를 계산하여 농림축산식품부령으로 정하는 바에 따라 국민에게 알려야 한다.\n② 산림청장 또는 지방자치단체의 장은 대통령령으로 정하는 바에 따라 산불위험지수가 높아 산불이 발생할 위험이 높은 기간을 산불조심기간으로 정하고, 산불조심기간 중 산불방지를 위하여 특별한 대책이 필요한 기간을 산불특별대책기간으로 정할 수 있다.\n③ 산림청장 또는 지방자치단체의 장은 제2항에 따라 산불조심기간이나 산불특별대책기간을 정하는 경우에는 그 내용을 농림축산식품부령으로 정하는 바에 따라 공고하여야 한다. 산불조심기간이나 산불특별대책기간을 변경하거나 해제하는 경우에도 또한 같다."}]},{"id":"L-15","law":"L","no":"15","label":"제15조","title":"산불방지대책본부 설치ㆍ운영 등","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불방지대책본부 설치ㆍ운영 등","body":"① 산림청장은 산불조심기간 동안 시행계획의 체계적 추진과 산불방지에 필요한 조치를 신속히 마련하기 위하여 산림청에 중앙산불방지대책본부를 설치ㆍ운영하여야 한다.\n② 산림재난방지기관의 장은 산불조심기간 동안 지역계획 및 지역시행계획의 체계적 추진과 산불방지에 필요한 조치를 신속히 마련하기 위하여 그 관할 지역에 지역산불방지대책본부를 설치ㆍ운영하여야 한다.\n③ 중앙산불방지대책본부의 장은 산림청장이 되고, 지역산불방지대책본부의 장은 산림재난방지기관의 장이 된다.\n④ 중앙산불방지대책본부의 장과 지역산불방지대책본부의 장은 농림축산식품부령으로 정하는 바에 따라 산림재난방지유관기관 소속 공무원으로 구성된 산불방지협의회를 구성ㆍ운영할 수 있다.\n⑤ 그 밖에 중앙산불방지대책본부와 지역산불방지대책본부의 설치ㆍ운영 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-16","law":"L","no":"16","label":"제16조","title":"산불 예방 등","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불 예방 등","body":"① 산림 또는 산림인접지역의 소유자ㆍ점유자 또는 관리인(국가나 지방자치단체로부터 권한이나 사무를 위탁받거나 대행하는 법인을 포함한다. 이하 같다)은 불을 피우는 행위를 금지하거나 화기(火器), 인화(引火) 물질 및 발화(發火) 물질의 제거 등 대통령령으로 정하는 산불방지에 필요한 조치를 하여야 한다.\n② 산림청장은 효율적인 산불 예방ㆍ대비 체계를 마련하여야 하며, 산림재난방지기관의 장은 이에 따라야 한다.\n③ 산림청장 또는 산림재난방지기관의 장은 산불 발생에 대비하여 산불방지에 필요한 인력, 장비 및 예산을 확보하는 등의 조치를 하여야 한다. 이 경우 산림청장은 지방자치단체가 산불 진화를 위한 헬리콥터 등 농림축산식품부령으로 정하는 산불 진화 장비를 도입하는 경우 그 비용의 일부를 지원할 수 있다.\n④ 산림청장 또는 산림재난방지기관의 장은 제3항에 따른 산불방지에 필요한 장비가 정상 가동될 수 있도록 정기적으로 점검하여야 한다.\n⑤ 산림청장 또는 산림재난방지기관의 장은 산불방지에 관한 연구ㆍ조사 등 농림축산식품부령으로 정하는 산불방지 사업을 수행할 수 있다."},{"from":"2026-11-13","title":"산불 예방 등","body":"① 산림 또는 산림인접지역의 소유자ㆍ점유자 또는 관리인(국가나 지방자치단체로부터 권한이나 사무를 위탁받거나 대행하는 법인을 포함한다. 이하 같다)은 불을 피우는 행위를 금지하거나 화기(火器), 인화(引火) 물질 및 발화(發火) 물질의 제거 등 대통령령으로 정하는 산불방지에 필요한 조치를 하여야 한다.\n② 산림청장은 효율적인 산불 예방ㆍ대비 체계를 마련하여야 하며, 산림재난방지기관의 장은 이에 따라야 한다.\n③ 산림청장 또는 산림재난방지기관의 장은 산불 발생에 대비하여 산불방지에 필요한 인력, 장비 및 예산을 확보하는 등의 조치를 하여야 한다. 이 경우 산림청장은 지방자치단체가 산불 진화를 위한 헬리콥터 등 농림축산식품부령으로 정하는 산불 진화 장비를 도입하는 경우 그 비용의 일부를 지원할 수 있다.\n④ 산림청장 또는 산림재난방지기관의 장은 제3항에 따른 산불방지에 필요한 장비가 정상 가동될 수 있도록 정기적으로 점검하여야 한다.\n⑤ 산림청장 또는 산림재난방지기관의 장은 산불방지를 위하여 필요한 경우에는 산림소유자의 동의를 받아 산불피해 발생 위험이 높은 시설물로서 대통령령으로 정하는 시설물 인근의 입목을 제거할 수 있다. 이 경우 산림소유자는 대통령령으로 정하는 정당한 사유 없이 이를 거부하거나 방해하여서는 아니 된다.<신설 2026. 5. 12.>\n⑥ 산림청장 또는 산림재난방지기관의 장은 제5항 전단에도 불구하고 산림소유자의 주소 또는 거소가 불분명하거나 그 밖의 불가피한 사유로 제5항 전단에 따른 동의를 받을 수 없을 때에는 해당 기관의 게시판 및 인터넷 홈페이지에 30일 이상 그 사실을 공고하는 것으로 동의를 갈음할 수 있다.<신설 2026. 5. 12.>\n⑦ 산림청장 또는 산림재난방지기관의 장은 산불방지에 관한 연구ㆍ조사 및 산불 예방을 위한 숲가꾸기 등 농림축산식품부령으로 정하는 산불방지 사업을 수행할 수 있다.<개정 2026. 5. 12.>"}]},{"id":"L-17","law":"L","no":"17","label":"제17조","title":"산불 발생 위험지역에 대한 실태조사","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불 발생 위험지역에 대한 실태조사","body":"① 산림재난방지기관의 장은 산림재난 위험도평가 결과에 따라 매년 산불 발생 위험지역에 대하여 실태조사를 실시하여야 한다.\n② 산림재난방지기관의 장은 제1항에 따른 실태조사 결과를 기초로 다음 각 호의 어느 하나에 해당하는 산불 예방에 필요한 조치를 하여야 한다. 다만, 제1호의 조치는 특별자치시장ㆍ특별자치도지사(제주특별자치도지사를 말한다. 이하 같다)ㆍ시장ㆍ군수ㆍ구청장 또는 지방산림청장에 한정한다.\n1. 「산림보호법」 제15조에 따른 입산통제구역의 지정 및 지정해제\n2. 「산림자원의 조성 및 관리에 관한 법률」 제9조에 따른 임도와 산불예방ㆍ진화시설의 설치\n3. 그 밖에 농림축산식품부령으로 정하는 산불 예방에 필요한 조치\n③ 제1항에 따른 실태조사의 내용ㆍ방법이나 그 밖에 필요한 사항은 농림축산식품부령으로 정한다."},{"from":"2026-11-13","title":"산불 발생 위험지역에 대한 실태조사","body":"① 산림재난방지기관의 장은 산림재난 위험도평가 결과에 따라 매년 산불 발생 위험지역에 대하여 실태조사를 실시하여야 한다.\n② 산림재난방지기관의 장은 제1항에 따른 실태조사 결과를 기초로 다음 각 호의 어느 하나에 해당하는 산불 예방에 필요한 조치를 하여야 한다. 다만, 제1호의 조치는 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 지방산림청장에 한정한다.<개정 2026. 5. 12.>\n1. 「산림보호법」 제15조에 따른 입산통제구역의 지정 및 지정해제\n2. 「산림자원의 조성 및 관리에 관한 법률」 제9조에 따른 임도와 산불예방ㆍ진화시설의 설치\n3. 그 밖에 농림축산식품부령으로 정하는 산불 예방에 필요한 조치\n③ 제1항에 따른 실태조사의 내용ㆍ방법이나 그 밖에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-18","law":"L","no":"18","label":"제18조","title":"산불 예방을 위한 행위 제한","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불 예방을 위한 행위 제한","body":"① 누구든지 산림 또는 산림인접지역에서 다음 각 호의 행위를 하여서는 아니 된다.\n1. 불을 피우거나 불을 가지고 들어가는 행위\n2. 담배를 피우거나 담배꽁초를 버리는 행위\n3. 농림축산식품부령으로 정하는 기간에 풍등 등 소형열기구를 날리는 행위\n② 제1항에도 불구하고 다음 각 호의 경우에는 제1항제1호의 행위를 할 수 있다.\n1. 산불확산을 방지하기 위하여 불이 탈 가능성이 있는 물질을 제거하는 등 대통령령으로 정하는 경우로서 농림축산식품부령으로 정하는 바에 따라 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 지방산림청장의 허가를 받은 경우\n2. 야영이 허가된 야영장 등 대통령령으로 정하는 지역인 경우\n③ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 지방산림청장은 제2항제1호에 따른 허가를 할 때 산불 예방에 필요한 조치를 할 것을 조건으로 허가할 수 있으며, 허가를 받은 사람은 불을 피우기 전에 관할 소방본부장 또는 소방서장 및 인접한 산림의 소유자ㆍ점유자 또는 관리인에게 그 사실을 알려야 한다.\n④ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 지방산림청장은 산불 예방을 위하여 필요한 때에는 산림에 들어가는 사람이 화기, 인화 물질 및 발화 물질 등을 지니는 것을 금지하여야 한다."}]},{"id":"L-19","law":"L","no":"19","label":"제19조","title":"산사태예방지원본부 설치ㆍ운영","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태예방지원본부 설치ㆍ운영","body":"① 산림청장은 「재난 및 안전관리 기본법」 제14조에 따른 중앙재난안전대책본부에서 정하는 여름철 재해대책기간 동안 시행계획의 체계적 추진과 산사태등 발생 위험 정보의 수집ㆍ전파, 신속한 대응 및 상황관리 등을 위하여 산림청장 소속으로 산사태예방지원본부를 설치ㆍ운영하여야 한다.\n② 산사태예방지원본부의 장은 산림청장이 된다.\n③ 그 밖에 산사태예방지원본부의 운영 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-20","law":"L","no":"20","label":"제20조","title":"산사태등 예방","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태등 예방","body":"① 산림 및 산림과 잇닿은 토지의 소유자ㆍ점유자 또는 관리인은 재해예방시설의 설치 등 산사태등 예방ㆍ대비에 필요한 조치를 하여야 한다.\n② 산림청장은 효율적인 산사태등 예방 체계를 구축하여야 하고, 산림재난방지기관의 장은 이에 따라 산사태등 예방에 필요한 조치를 하여야 한다.\n③ 산림청장 또는 산림재난방지기관의 장은 산사태등 발생에 대비하여 필요한 인력, 장비 및 예산을 확보하는 등의 조치를 하여야 한다. 이 경우 산림청장은 지방자치단체에 예산의 범위에서 조치에 필요한 비용의 일부를 지원할 수 있다."}]},{"id":"L-21","law":"L","no":"21","label":"제21조","title":"산사태등 발생 우려지역 조사","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태등 발생 우려지역 조사","body":"① 산림청장은 산림재난 위험도평가 결과 등에 따라 5년마다 산사태등의 발생 우려지역에 대한 기초조사를 실시하고 그 결과를 산림재난방지기관의 장 등에게 통보하여야 한다.\n② 산림재난방지기관의 장은 제1항에 따른 기초조사 결과에 따라 산사태등 발생 위험성에 대한 추가적인 조사가 필요한 지역에 대하여 실태조사를 실시하여야 한다.\n③ 산림재난방지기관의 장은 제2항에 따른 실태조사 결과를 기초로 다음 각 호의 어느 하나에 해당하는 산사태등 예방에 필요한 조치를 하여야 한다. 다만, 제2호의 조치는 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 지방산림청장에 한정한다.\n1. 제22조에 따른 산사태취약지역의 지정ㆍ변경ㆍ고시 및 해제\n2. 「산림보호법」 제15조에 따른 입산통제구역의 지정 및 지정해제\n3. 「사방사업법」 제2조제3호에 따른 사방시설의 설치\n4. 그 밖에 농림축산식품부령으로 정하는 산사태등 예방에 필요한 조치\n④ 제1항 및 제2항에 따른 기초조사 및 실태조사의 내용ㆍ방법이나 그 밖에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-22","law":"L","no":"22","label":"제22조","title":"산사태취약지역 지정 및 해제 등","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태취약지역 지정 및 해제 등","body":"① 산림재난방지기관의 장(국유림의 경우 지방산림청장을 말하며, 공유림ㆍ사유림의 경우 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장을 말한다. 이하 이 조 및 제23조에서 같다)은 제21조제2항에 따른 실태조사 결과 붕괴ㆍ침식ㆍ균열 등으로 산사태등 발생 위험성이 높다고 인정되는 지역을 산사태취약지역으로 지정할 수 있다.\n② 산림재난방지기관의 장은 제1항에 따라 산사태취약지역을 지정하려면 지정예정지에 대하여 다음 각 호의 사항을 공고하고, 이를 농림축산식품부령으로 정하는 바에 따라 해당 토지의 소유자ㆍ점유자 또는 관리인에게 알려야 한다.\n1. 지정사유\n2. 지정예정지의 소재와 면적\n3. 지정에 관한 이의신청기간\n4. 그 밖에 농림축산식품부령으로 정하는 사항\n③ 제1항에 따른 산사태취약지역의 지정과 관련하여 해당 토지의 소유자ㆍ점유자 또는 관리인은 제2항제3호에 따른 이의신청기간에 농림축산식품부령으로 정하는 바에 따라 이의신청을 할 수 있다.\n④ 산림재난방지기관의 장은 제3항에 따른 이의신청을 받은 날부터 20일 이내에 그 이의신청에 대하여 결정을 하고 지체 없이 그 결과를 신청인에게 알려야 한다.\n⑤ 산림재난방지기관의 장은 제3항에 따른 이의신청이 없거나 이의신청의 이유가 없다고 인정하면 산사태취약지역으로 지정ㆍ고시하고, 해당 토지의 소유자ㆍ점유자 또는 관리인 및 관할 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 지방산림청장에게 통보하여야 한다. 다만, 해당 토지의 소유자ㆍ점유자 또는 관리인의 주소ㆍ거소가 분명하지 아니한 때에는 해당 기관의 게시판 및 인터넷 홈페이지에 30일 이상 그 사실을 공고하는 것으로 이를 갈음한다.\n⑥ 산림재난방지기관의 장이 산지의 이용이나 사방시설의 설치 등으로 산사태취약지역으로 지정한 범위를 변경하여 확대하거나 축소하는 경우에도 제1항부터 제5항까지에 따른다.\n⑦ 산사태취약지역의 지정ㆍ변경은 고시한 날부터 그 효력이 발생한다.\n⑧ 산림재난방지기관의 장은 제1항ㆍ제6항에 따라 지정ㆍ변경된 산사태취약지역이 사방댐 설치사업 등 「사방사업법」 제3조에 따른 사방사업의 시행 등으로 인하여 그 지정 목적이 달성되었을 경우에는 이를 해제할 수 있다.\n⑨ 산림재난방지기관의 장은 제1항ㆍ제5항ㆍ제6항 또는 제8항에 따라 산사태취약지역을 지정ㆍ변경하거나 해제한 경우에는 관할 시ㆍ도지사를 거쳐(공유림ㆍ사유림의 경우에 한정한다) 산림청장에게 보고하여야 한다.\n⑩ 산림재난방지기관의 장은 산사태등 발생 시 지역주민의 안전을 확보하기 위하여 필요하다고 인정되는 곳에 대 피소를 지정하고 이를 표시하는 표지판(이하 “대피소 표지판”이라 한다)을 설치하여야 한다.\n⑪ 산림재난방지기관의 장은 산사태취약지역에 위험 및 대피소 위치를 안내하는 표지판(이하 “산사태취약지역 표지판”이라 한다)을 설치하고 그 관리 상태를 연 2회 이상 점검하여야 한다.\n⑫ 누구든지 대피소 표지판 또는 산사태취약지역 표지판을 설치한 자의 허락 없이 이를 이전하거나 훼손하여서는 아니 된다.\n⑬ 산림청장 또는 시ㆍ도지사는 제1항에 따른 산사태취약지역의 지정이 필요함에도 불구하고 산림재난방지기관의 장이 산사태취약지역으로 지정하지 아니한 해당 지역을 산사태취약지역으로 지정ㆍ고시하도록 통보할 수 있다. 이 경우 산림재난방지기관의 장은 특별한 사유가 없으면 이에 따라야 한다.\n⑭ 그 밖에 산사태취약지역 지정예정지 공고, 산사태취약지역의 지정ㆍ고시ㆍ변경 및 해제, 대피소 지정, 대피소 표지판 및 산사태취약지역 표지판의 설치 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-23","law":"L","no":"23","label":"제23조","title":"산사태취약지역 지정위원회","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태취약지역 지정위원회","body":"산림재난방지기관의 장은 제22조에 따른 산사태취약지역의 지정 또는 변경을 심의하기 위하여 산림재난방지기관의 장 소속으로 산사태취약지역 지정위원회를 구성ㆍ운영하여야 한다. 이 경우 지방산림청장 소속은 대통령령으로 정하고, 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 소속은 해당 지방자치단체의 조례로 정한다."}]},{"id":"L-24","law":"L","no":"24","label":"제24조","title":"산사태취약지역에서 행위 제한 등","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태취약지역에서 행위 제한 등","body":"누구든지 산사태취약지역에서는 다음 각 호의 행위를 하여서는 아니 된다.\n1. 「사방사업법」 제2조제3호에 따른 사방시설을 설치하는 것을 거부 또는 방해하는 행위\n2. 「사방사업법」 제2조제3호에 따른 사방시설을 훼손하거나 관리하는 것을 거부 또는 방해하는 행위"}]},{"id":"L-25","law":"L","no":"25","label":"제25조","title":"산사태취약지역 및 대피소 관리 등","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태취약지역 및 대피소 관리 등","body":"① 산림재난방지기관의 장은 산사태취약지역에 「사방사업법」 제5조 및 제6조에 따른 사방사업을 다른 지역에 우선하여 시행하여야 한다.\n② 산림재난방지기관의 장은 산사태취약지역 및 대피소에 대하여 연 2회 이상 현지점검을 실시하여야 한다.\n③ 산림재난방지기관의 장은 제2항에 따른 현지점검을 실시한 결과 산사태등 발생 위험성이 있다고 인정하는 때에는 대통령령으로 정하는 바에 따라 해당 토지의 소유자ㆍ점유자 또는 관리인에게 관련 시설ㆍ토지 등의 사용을 제한ㆍ금지하거나 보수ㆍ보강 또는 제거 등 안전조치를 명령할 수 있다. 이 경우 안전조치 명령을 받은 자는 특별한 사유가 없으면 이에 따라야 한다.\n④ 제3항에 따라 안전조치 명령을 받은 자는 안전조치를 이행하고 농림축산식품부령으로 정하는 바에 따라 그 결과를 관할 산림재난방지기관의 장에게 통보하여야 한다.\n⑤ 산림재난방지기관의 장은 제3항에 따라 안전조치 명령을 받은 자가 그 명령을 이행하지 아니한 경우 「행정대집행법」에 따라 대집행하고, 대집행에 소요된 비용을 명령을 이행하지 아니한 자로부터 징수할 수 있다."}]},{"id":"L-26","law":"L","no":"26","label":"제26조","title":"산사태취약지역의 토지 등 매수ㆍ교환","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태취약지역의 토지 등 매수ㆍ교환","body":"① 산림재난방지기관의 장은 산사태취약지역의 지정 목적을 달성하기 위하여 필요하면 토지소유자와 협의하거나 토지소유자의 신청을 받아 산사태취약지역의 토지(산지의 입목ㆍ죽을 포함한다)나 산사태취약지역과 연접한 토지 등 대통령령으로 정하는 산사태취약지역 인근의 토지를 예산의 범위에서 매수하거나 국유림 또는 공유림과 교환할 수 있다. 이 경우 매수ㆍ교환의 가격은 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 따라 산정된 가격으로 한다. <개정 2026. 5. 12.>\n② 제1항에 따른 토지 등의 매수ㆍ교환의 절차, 그 밖에 필요한 사항은 「국유재산법」, 「국유림의 경영 및 관리에 관한 법률」 또는 「공유재산 및 물품 관리법」을 준용한다."}]},{"id":"L-27","law":"L","no":"27","label":"제27조","title":"산림병해충예찰ㆍ방제대책본부 설치ㆍ운영","chapter":"제3장 산림재난 예방","section":"제3절 산림병해충 예찰","versions":[{"from":"2026-02-01","title":"산림병해충예찰ㆍ방제대책본부 설치ㆍ운영","body":"① 산림청장은 산림병해충 예찰ㆍ방제에 필요한 지원을 하기 위하여 산림청에 중앙산림병해충예찰ㆍ방제대책본부를 설치ㆍ운영하여야 한다.\n② 산림재난방지기관의 장은 산림병해충 예찰ㆍ방제를 효율적으로 추진하기 위하여 그 관할 지역에 지역산림병해충예찰ㆍ방제대책본부를 설치ㆍ운영하여야 한다.\n③ 중앙산림병해충예찰ㆍ방제대책본부의 장은 산림청장이 되고, 지역산림병해충예찰ㆍ방제대책본부의 장은 산림재난방지기관의 장이 된다.\n④ 중앙산림병해충예찰ㆍ방제대책본부와 지역산림병해충예찰ㆍ방제대책본부의 설치 및 운영과 그 밖에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-28","law":"L","no":"28","label":"제28조","title":"산림병해충 예찰 등","chapter":"제3장 산림재난 예방","section":"제3절 산림병해충 예찰","versions":[{"from":"2026-02-01","title":"산림병해충 예찰 등","body":"① 산림에 있는 식물과 산림이 아닌 지역에 있는 수목의 소유자ㆍ점유자ㆍ관리인, 판매자 또는 산림사업 종사자 등(이하 “산림소유자등”이라 한다)은 산림병해충 예찰ㆍ방제에 필요한 조치를 하여야 한다.\n② 산림청장은 효율적인 산림병해충 예찰ㆍ방제체계를 구축하여야 하며, 산림재난방지기관의 장은 이에 따라 산림병해충을 예찰하고 산림병해충이 발생하면 신속히 방제하여야 한다.\n③ 산림청장 또는 산림재난방지기관의 장은 산림병해충 예찰ㆍ방제에 필요한 인력, 장비 및 예산을 확보하는 등의 조치를 하여야 한다. 이 경우 산림청장은 지방자치단체에 예산의 범위에서 필요한 비용의 일부를 지원할 수 있다.\n④ 제1항 및 제2항에 따른 산림병해충 예찰의 방법ㆍ시기와 예찰 결과에 대한 조치사항 등은 농림축산식품부령으로 정한다."}]},{"id":"L-29","law":"L","no":"29","label":"제29조","title":"산림병해충 발생 위험지역 실태조사","chapter":"제3장 산림재난 예방","section":"제3절 산림병해충 예찰","versions":[{"from":"2026-02-01","title":"산림병해충 발생 위험지역 실태조사","body":"① 산림재난방지기관의 장은 산림재난 위험도평가 결과에 따라 매년 산림병해충 발생 위험지역에 대한 실태조사를 실시하여야 한다.\n② 산림재난방지기관의 장은 실태조사 결과를 기초로 긴급하게 산림병해충 예찰ㆍ방제를 할 필요가 있는 지역에 대하여 산림청장에게 제46조에 따른 산림병해충 특별방제구역으로 지정하여 줄 것을 요청할 수 있다.\n③ 제1항에 따른 실태조사의 내용, 방법 및 그 밖에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-30","law":"L","no":"30","label":"제30조","title":"산불경보 발령 및 조치","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불경보 발령 및 조치","body":"① 산림청장은 「재난 및 안전관리 기본법」 제38조제1항 본문에 따라 산불재난 국가위기경보(이하 이 조에서 “산불경보”라 한다)를 발령할 수 있다.\n② 산림재난방지기관의 장 및 「국립공원공단법」에 따른 공원사무소의 장은 산불경보가 발령되면 대통령령으로 정하는 산불경보별 조치기준에 따라 입산 통제 등 필요한 조치를 하여야 한다.\n③ 제1항 및 제2항에 따른 산불경보의 발령기준 및 조치 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-31","law":"L","no":"31","label":"제31조","title":"산불 신고","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불 신고","body":"① 산림이나 산림인접지역에서 불씨를 보거나 산불을 발견한 사람은 지체 없이 산림청, 산림재난방지기관 또는 산림재난방지유관기관에 신고하여야 한다.\n② 산림청 또는 산림재난방지유관기관이 산불 발생 신고를 접수하였을 때에는 지체 없이 관할 산림재난방지기관에 통보하여야 한다.\n③ 제1항 및 제2항에 따라 산불 발생 신고를 받은 관할 산림재난방지기관은 현장에 신속하게 출동하여 산불 진화에 필요한 활동을 하여야 한다.\n④ 그 밖에 산불 신고에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-32","law":"L","no":"32","label":"제32조","title":"산불대응 단계 발령","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불대응 단계 발령","body":"① 산림청장은 산불 진화를 위한 인력 및 장비(이하 이 조에서 “산불진화자원”이라 한다)의 신속한 동원을 위하여 발생한 산불의 피해 면적, 기상 상태 등 대통령령으로 정하는 기준에 따라 산불대응 단계를 발령하고, 해당 및 인접 지역의 산림재난방지기관의 장에게 산불진화자원을 동원할 것을 요청할 수 있다. 이 경우 산림청장은 발령 사항을 국민에게 알려야 한다.\n② 제1항에 따라 동원 요청을 받은 산림재난방지기관의 장은 정당한 사유 없이 그 요청을 거절하여서는 아니 된다.\n③ 제1항에 따른 산불대응 단계의 발령 방법, 산불진화자원의 동원 기준, 발령 사항의 대국민 알림 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-33","law":"L","no":"33","label":"제33조","title":"대피명령 및 강제대피조치 요청","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"대피명령 및 강제대피조치 요청","body":"산림청장 또는 지방산림청장 은 산불이 발생하거나 발생할 우려가 있는 경우에 해당 지역 내 사람의 생명 또는 신체나 재산에 대한 위해를 방지하기 위하여 필요하면 관할 시장ㆍ군수ㆍ구청장 또는 「재난 및 안전관리 기본법」 제50조제2항에 따른 지역통제단의 단장에게 같은 법 제40조 및 제42조에 따른 대피명령 및 강제대피조치를 요청할 수 있다. 이 경우 요청을 받은 관할 시장ㆍ군수ㆍ구청장 또는 지역통제단의 단장은 특별한 사유가 없으면 이에 따라야 한다."}]},{"id":"L-34","law":"L","no":"34","label":"제34조","title":"산불 진화 통합지휘","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불 진화 통합지휘","body":"① 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장 또는 지방산림청장은 그 관할 지역에서 대통령령으로 정하는 기준에 해당하는 중소형 산불이 발생하면 그 산불의 진화를 통합적으로 지휘(이하 “통합지휘”라 한다)한다. 다만, 산불이 국유림ㆍ공유림 또는 사유림에 걸쳐 발생하면 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장이 통합지휘하여야 한다.\n② 시ㆍ도지사는 산불이 대통령령으로 정하는 기준에 해당하는 대형 산불로 확산되면 그 산불의 진화를 통합지휘하여야 한다. 다만, 관할 지역 중 두 군데 이상에서 대형 산불이 발생한 경우에는 대통령령으로 정하는 바에 따라 한 군데 이상의 통합지휘권을 시장ㆍ군수ㆍ구청장에게 위임할 수 있다.\n③ 산불이 둘 이상의 시ㆍ군ㆍ구에 걸쳐 발생하면 시ㆍ도지사가 통합지휘하고, 둘 이상의 특별시ㆍ광역시ㆍ특별자치시ㆍ도ㆍ특별자치도에 걸쳐 발생하면 산림청장이 통합지휘한다. 이 경우 시ㆍ도지사 또는 산림청장은 대통령령으로 정하는 바에 따라 통합지휘권을 시장ㆍ군수ㆍ구청장 또는 시ㆍ도지사에게 위임할 수 있다.\n④ 산불이 대통령령으로 정하는 기준에 해당하는 산불로 확산되어 국가재난으로 확대될 우려가 있는 대형 산불이 발생한 경우에는 제2항 및 제3항에도 불구하고 산림청장이 그 산불의 진화를 통합지휘할 수 있다."}]},{"id":"L-35","law":"L","no":"35","label":"제35조","title":"산불현장 통합지휘본부 설치ㆍ운영 등","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불현장 통합지휘본부 설치ㆍ운영 등","body":"① 제34조에 따라 산불 진화를 통합지휘하는 산림청장 또는 산림재난방지기관의 장은 산불이 발생한 현장에 산불현장 통합지휘본부를 설치하여 산불 진화를 지휘하고 진화인력에 대하여 진화에 필요한 명령을 할 수 있다.\n② 산불현장 통합지휘본부의 장(이하 “산불현장 통합지휘본부장”이라 한다)은 산불현장에 지원된 산림재난방지유관기관과의 통합지휘체계를 구축하기 위하여 산림재난방지유관기관 소속 공무원 또는 임직원을 소집하여 산불현 장대책회의를 개최하고 기관별 임무를 부여하여야 한다.\n③ 산불현장 통합지휘본부장(산불현장 통합지휘본부장이 산림재난 방지기관의 장인 경우를 말한다)은 산불 발생ㆍ진화ㆍ피해 상황 등을 파악하여 산림청장에게 보고하여야 한다.\n④ 산림청장은 대형 산불이 발생하였거나 대형 산불로 확산이 우려되는 산불(지방자치단체의 장이 산불현장 통합지휘본부장인 경우를 말한다)에 대해서는 국가와 지방자치단체가 공동으로 대응하기 위하여 지방산림청장 또는 국 유림관리소장을 산불현장 통합지휘본부장의 보좌관으로 지정할 수 있다.\n⑤ 제1항부터 제3항까지에 따른 산불현장 통합지휘본부의 구성, 임무, 보고, 그 밖에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-36","law":"L","no":"36","label":"제36조","title":"협조","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"협조","body":"① 산불현장 통합지휘본부장은 산불 진화와 관련하여 필요하면 다음 각 호의 기관 또는 단체의 장에게 산불 진화, 현장 통제 등에 필요한 장비 및 인력의 협조를 요청할 수 있으며, 요청을 받은 기관 및 단체의 장은 특별한 사유가 없으면 이에 적극 협조하여야 한다.\n1. 소방관서(「소방기본법」 제16조의2제1항에 따른 소방지원활동에 한정한다)\n2. 경찰관서(지구대, 파출소 및 출장소를 포함한다)\n3. 군부대\n4. 국가유산청 및 그 소속기관\n5. 기상청 및 지방기상청\n6. 「국립공원공단법」에 따른 국립공원공단 및 그 소속 공원사무소(하부조직을 포함한다)\n7. 그 밖에 대통령령으로 정하는 산림재난 관련 기관 및 단체\n② 제1항에 따라 산불현장에 파견된 사람은 산불현장 통합지휘본부장의 지휘에 따라 주어진 임무를 수행하여야 한다.\n③ 제1항에 따라 산불현장 통합지휘본부장이 협조를 요청하는 대상ㆍ방법ㆍ절차ㆍ규모 및 경비의 부담, 그 밖에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-37","law":"L","no":"37","label":"제37조","title":"산불진화단 등 구성ㆍ운영","chapter":"제4장 산림재난 대응 등","section":"제1절 산불 대응 등","versions":[{"from":"2026-02-01","title":"산불진화단 등 구성ㆍ운영","body":"① 산림청장 및 산림재난방지기관의 장은 제56조에 따른 산림재난방지 교육을 이수한 공무원(「청원산림보호직원 배치에 관한 법률」에 따른 청원산림보호직원을 포함한다)으로 조직된 산불진화단을 설치하여 다음 각 호의 업무를 수행하게 할 수 있다.\n1. 산불의 진화\n2. 제2항에 따른 산불예방진화대 및 산불재난특수진화대 대원의 지휘ㆍ통솔\n3. 산불현장 통합지휘본부장의 지휘 보좌\n4. 산불진화전략 수립을 위한 기초정보 수집과 전달\n5. 산불의 예방과 진화에 대한 대국민 홍보\n② 산림재난방지기관의 장은 산불방지를 위하여 농림축산식품부령으로 정하는 산불진화 교육과 훈련을 받은 사람으로 산불예방진화대 및 산불재난특수진화대를 구성ㆍ운영할 수 있다.\n③ 제1항 및 제2항에 따른 산불진화단, 산불예방진화대 및 산불재난특수진화대의 구성ㆍ운영 등 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-38","law":"L","no":"38","label":"제38조","title":"산사태등 신고 및 안전조치","chapter":"제4장 산림재난 대응 등","section":"제2절 산사태등 대응","versions":[{"from":"2026-02-01","title":"산사태등 신고 및 안전조치","body":"① 산사태등을 보거나 산사태등의 징후를 감지한 사람은 지체 없이 산림청, 산림재난방지기관 또는 산림재난방지유관기관에 신고하여야 한다.\n② 산림청 또는 산림재난방지유관기관이 산사태등 신고를 접수한 때에는 지체 없이 관할 산림재난방지기관에 통보하여야 한다.\n③ 관할 산림재난방지기관은 산사태등 발생 상황을 신속하게 파악하고 추가 피해를 방지하기 위하여 응급복구 등 안전조치를 하여야 한다.\n④ 누구든지 정당한 사유 없이 관할 산림재난방지기관의 안전조치를 방해하여서는 아니 된다.\n⑤ 그 밖에 산사태등 발생 상황 파악 및 안전조치 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-39","law":"L","no":"39","label":"제39조","title":"산사태 위기경보의 발령 등","chapter":"제4장 산림재난 대응 등","section":"제2절 산사태등 대응","versions":[{"from":"2026-02-01","title":"산사태 위기경보의 발령 등","body":"① 산림청장은 「재난 및 안전관리 기본법」 제38조제1항 본문에 따라 산사태재난 국가위기경보(이하 “산사태 위기경보”라 한다)를 발령할 수 있다.\n② 산림재난방지기관 및 산림재난방지유관기관의 장은 산사태 위기경보가 발령되면 대통령령으로 정하는 바에 따라 입산 통제, 대피명령 등 필요한 조치를 하여야 한다.\n③ 산림청장 또는 지방산림청장은 산사태등이 발생하거나 발생할 우려가 있는 경우에 해당 지역 내 사람의 생명 또는 신체나 재산에 대한 위해를 방지하기 위하여 필요하면 관할 시장ㆍ군수ㆍ구청장 또는 「재난 및 안전관리 기본법」 제50조제2항에 따른 지역통제단의 단장에게 같은 법 제40조 및 제42조에 따른 대피명령 및 강제대피조치를 요청할 수 있다. 이 경우 요청을 받은 시장ㆍ군수ㆍ구청장 또는 지역통제단의 단장은 특별한 사유가 없으면 이에 따라야 한다.\n④ 제1항 및 제2항에 따른 산사태 위기경보의 발령기준 및 조치 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-40","law":"L","no":"40","label":"제40조","title":"산사태등 긴급점검","chapter":"제4장 산림재난 대응 등","section":"제2절 산사태등 대응","versions":[{"from":"2026-02-01","title":"산사태등 긴급점검","body":"① 산림청장 또는 산림재난방지기관의 장은 대통령령으로 정하는 시설 및 지역에 산사태등이 발생할 우려가 있거나 발생하였을 때에는 해당 시설 및 지역을 관리하는 관계 중앙행정기관(「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관을 포함한다. 이하 이 조에서 “관계 행정기관등”이라 한다)의 장에게 소속 공무원 또는 직원으로 하여금 산사태등 긴급점검(이하 이 조에서 “긴급점검”이라 한다)을 하도록 요청할 수 있다. 이 경우 요청을 받은 관계 행정기관등의 장은 특별한 사유가 없으면 이에 따라야 한다.\n② 제1항 전단에 따라 긴급점검을 하는 공무원 또는 직원은 관계인에게 필요한 질문을 하거나 관계 서류 등을 열람할 수 있다.\n③ 제1항 전단에 따라 긴급점검을 하는 공무원 또는 직원은 그 권한을 표시하는 증표를 지니고 이를 관계인에게 보 여주어야 한다.\n④ 제1항 전단에 따라 긴급점검을 하도록 요청받은 관계 행정기관등의 장은 긴급점검을 실시하고 그 결과를 산림청장 또는 산림재난방지기관의 장에게 통보하여야 한다.\n⑤ 제1항에 따른 긴급점검의 절차 및 방법과 제4항에 따른 긴급점검 결과의 통보 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-41","law":"L","no":"41","label":"제41조","title":"산사태대응팀 등 구성ㆍ운영","chapter":"제4장 산림재난 대응 등","section":"제2절 산사태등 대응","versions":[{"from":"2026-02-01","title":"산사태대응팀 등 구성ㆍ운영","body":"① 산림청장 및 산림재난방지기관의 장은 제56조에 따른 산림재난방지 교육을 이수한 공무원(「청원산림보호직원 배치에 관한 법률」에 따른 청원산림보호직원을 포함한다)으로 조직된 산사태대응팀을 구성하고, 다음 각 호의 업무를 수행하게 할 수 있다.\n1. 산사태등의 예방 및 대응\n2. 「사방사업법」 제2조제3호에 따른 사방시설의 설치 및 관리\n3. 산사태취약지역의 지정 및 관리\n4. 제2항에 따른 산사태현장예방단의 지휘ㆍ통솔\n5. 산사태등방지 대책의 수립을 위한 기초정보 수집과 전달\n6. 산사태등방지에 관한 지역주민 홍보\n② 산림재난방지기관의 장은 산사태등방지를 위하여 농림축산식품부령으로 정하는 산사태등에 관한 교육 및 훈련을 받은 사람으로 산사태현장예방단을 구성ㆍ운영할 수 있다.\n③ 산사태대응팀 및 산사태현장예방단의 구성ㆍ운영에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-42","law":"L","no":"42","label":"제42조","title":"산림병해충 신고 및 조치","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 신고 및 조치","body":"① 산림병해충을 발견한 사람은 지체 없이 산림청, 산림재난방지기관 또는 산림재난방지유관기관에 신고하여야 한다.\n② 산림청 또는 산림재난방지유관기관이 산림병해충 신고를 접수하였을 때에는 지체 없이 관할 산림재난방지기관에 통보하여야 한다.\n③ 관할 산림재난방지기관은 현장 상황을 신속하게 파악하고 추가 피해를 방지하기 위하여 필요한 조치를 하여야 한다.\n④ 그 밖에 산림병해충 발생 상황 파악 및 조치 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-43","law":"L","no":"43","label":"제43조","title":"산림병해충 방제명령","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 방제명령","body":"① 산림재난방지기관의 장은 산림병해충이 발생할 우려가 있거나 발생하였을 때에는 산림소유자등에게 다음 각 호의 조치를 하도록 명할 수 있다. 이 경우 명령을 받은 자는 특별한 사유가 없으면 그 명령에 따라야 한다.\n1. 산림병해충이 있는 수목이나 가지 또는 뿌리 등의 제거\n2. 산림병해충이 발생할 우려가 있거나 발생한 산림용 종묘, 베어낸 나무, 조경용 수목, 떼, 토석 등의 이동 제한이나 사용 금지\n3. 산림병해충을 옮기거나 피해를 일으키는 곤충 등 동물의 방제나 이동 제한 또는 유통ㆍ판매 제한\n4. 산림병해충의 피해를 확산시키는 식물의 제거\n5. 산림병해충이 발생할 우려가 있거나 발생한 종묘ㆍ토양의 소독\n② 산림재난방지기관의 장은 제1항제2호 또는 제3호에 따른 조치를 명한 경우에는 그 내용을 해당 기관의 게시판 및 인터넷 홈페이지 등을 통하여 10일 이상 공고하여야 한다.\n③ 제1항에 따른 조치 명령을 받은 산림소유자등은 농림축산식품부령으로 정하는 바에 따라 방제계획을 수립하여 산림재난방지기관의 장에게 제출하여야 하고, 그 승인을 받아야 한다. 이 경우 산림재난방지기관의 장은 제출된 방제계획의 적정성을 검토하여 승인 여부를 산림소유자등에게 알려야 한다.\n④ 산림재난방지기관의 장은 제3항 전단에 따라 승인한 방제계획의 이행결과를 확인하여야 한다.\n⑤ 제1항제2호 또는 제3호에 따른 조치 명령을 받은 산림소유자등은 제3항 전단에 따라 승인을 받은 방제계획을 이행한 때에는 산림재난방지기관에 해당 명령의 해제를 신청할 수 있다. 이 경우 산림재난방지기관의 장은 산림소유자등의 이행결과로 제1항제2호 또는 제3호에 따른 명령을 한 사유가 없어지고 방제가 완료되었다고 인정할 때에는 지체 없이 그 명령을 해제하여야 한다.\n⑥ 산림재난방지기관의 장은 제1항에 따른 조치 명령을 받은 산림소유자등에게 그 명령을 이행하는 데에 발생한 비용을 대통령령으로 정하는 바에 따라 지원할 수 있다.\n⑦ 제6항을 적용할 때 제1항에 따른 조치 명령을 받은 산림소유자등이 농림축산식품부령으로 정하는 기한까지 명령을 이행하지 아니할 경우에는 산림재난방지기관의 장이 「행정대집행법」에 따라 대집행하고, 대집행에 소요된 비용을 명령을 이행하지 아니한 산림소유자등으로부터 징수할 수 있다.\n⑧ 제1항에 따른 조치 명령, 제3항에 따른 방제계획의 승인 및 승인 여부 통보, 제4항에 따른 이행결과 확인, 제5항에 따른 명령 해제 신청과 방제 완료 인정 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-44","law":"L","no":"44","label":"제44조","title":"산림병해충 방제","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 방제","body":"① 산림재난방지기관의 장이 방제를 하려면 사업 시작 14일 전까지 다음 각 호의 사항을 공고하여야 한다. 다만, 긴급하게 방제할 필요가 있는 경우에는 방제를 실시한 후에 공고할 수 있다.\n1. 방제 일시 및 대상 지역\n2. 방제 대상 병해충의 종류\n3. 방제의 방법과 내용\n4. 그 밖에 방제와 관련하여 필요한 사항\n② 제1항에 따른 방제작업 결과에 대한 점검과 조치에 필요한 세부 사항은 농림축산식품부령으로 정한다.\n③ 방제의 방법에 관하여 필요한 사항은 산림청장이 정하여 고시한다."}]},{"id":"L-45","law":"L","no":"45","label":"제45조","title":"방제사업 설계ㆍ감리","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"방제사업 설계ㆍ감리","body":"① 산림재난방지기관의 장이 대통령령으로 정하는 규모의 방제사업을 시행하려는 경우에는 설계ㆍ감리를 하여야 한다.\n② 제1항에 따른 설계ㆍ감리는 다음 각 호의 어느 하나에 해당하는 자가 할 수 있다.\n1. 「기술사법」에 따라 산림 분야 사무소를 개설한 기술사\n2. 「엔지니어링산업 진흥법」에 따른 산림전문분야 엔지니어링사업자\n3. 그 밖에 대통령령으로 정하는 자\n③ 방제사업을 설계하거나 감리하는 자는 제43조제3항에 따라 산림재난방지기관의 장이 승인한 방제계획과 그 밖의 관계 법령에 맞게 설계ㆍ감리하여야 한다.\n④ 방제사업의 감리자는 제43조제3항에 따라 산림재난방지기관의 장이 승인한 방제계획과 그 밖의 관계 법령을 위반한 사항을 발견하거나 방제사업 시공자가 설계대로 방제사업을 하지 아니하면 방제사업 시공자에게 시정하거나 재시공하도록 요청하여야 한다.\n⑤ 방제사업의 감리자는 방제사업 시공자가 제4항의 요청에 따르지 아니하면 서면 또는 전자적 방식으로 그 방제사업을 중지하도록 요청할 수 있다. 이 경우 공사 중지를 요청받은 방제사업 시공자는 정당한 사유가 없으면 즉시 공사를 중지하여야 한다.\n⑥ 방제사업의 설계ㆍ감리의 기준 및 절차, 그 밖에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-46","law":"L","no":"46","label":"제46조","title":"산림병해충 특별방제구역 지정ㆍ해제 등","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충 특별방제구역 지정ㆍ해제 등","body":"① 산림청장은 산림병해충의 확산을 방지하기 위하여 긴급하게 예찰ㆍ방제할 필요가 있는 지역을 산림병해충 특별방제구역(이하 “특별방제구역”이라 한다)으로 지정할 수 있다.\n② 산림청장은 제1항에 따라 특별방제구역을 지정하면 그 지정 내용을 고시하고, 이를 관할 산림재난방지기관의 장에게 통보하여야 한다.\n③ 관할 산림재난방지기관의 장은 고시된 사항을 농림축산식품부령으로 정하는 바에 따라 해당 산림소유자등에게 알릴 수 있다.\n④ 산림재난방지기관의 장은 특별방제구역에서 신속하게 예찰ㆍ방제하기 위하여 산림병해충에 감염된 나무를 긴급하게 베어내는 등 대통령령으로 정하는 바에 따라 예찰ㆍ방제에 필요한 조치를 할 수 있다.\n⑤ 산림청장은 특별방제구역의 지정 목적이 달성되었거나 계속 지정할 필요가 없다고 인정하면 그 지정을 해제하고 그 사실을 고시하여야 한다.\n⑥ 특별방제구역의 지정ㆍ해제 및 관리, 고시의 방법ㆍ절차 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-47","law":"L","no":"47","label":"제47조","title":"산림병해충대응팀 구성 등","chapter":"제4장 산림재난 대응 등","section":"제3절 산림병해충 방제","versions":[{"from":"2026-02-01","title":"산림병해충대응팀 구성 등","body":"① 산림청장 및 산림재난방지기관의 장은 제56조에 따른 산림재난방지 교육을 이수한 공무원(「청원산림보호직원 배치에 관한 법률」에 따른 청원산림보호직원을 포함한다)으로 조직된 산림병해충대응팀을 구성하고, 다음 각 호의 업무를 수행하게 할 수 있다.\n1. 산림병해충의 예찰 및 방제 활동\n2. 산림병해충의 예찰ㆍ방제 사업의 현장지도\n3. 제2항에 따른 산림병해충예찰방제단의 구성 및 운영\n4. 산림병해충의 예찰ㆍ방제 대책의 수립을 위한 기초정보 수집과 전달\n5. 산림병해충의 예찰ㆍ방제를 위한 대국민 홍보\n② 산림재난방지기관의 장은 신속한 산림병해충의 예찰ㆍ방제를 위하여 대통령령으로 정하는 바에 따라 산림병해충예찰방제단을 구성ㆍ운영할 수 있다."}]},{"id":"L-48","law":"L","no":"48","label":"제48조","title":"산불 조사","chapter":"제5장 산림재난 조사 및 복구","section":"제1절 산불 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산불 조사","body":"① 산림청장 또는 산림재난방지기관의 장은 산불로 피해가 발생한 산림에 대하여 산불 원인과 산불피해 현황 등을 파악하기 위하여 자료의 수집, 관계인 등에 대한 질문, 현장 확인, 실험, 대응 분석ㆍ평가 등(이하 “산불 조사”라 한다)을 실시하여야 한다.\n② 제1항에 따른 관계인은 다음 각 호의 사람을 말한다.\n1. 산불로 피해를 입은 산림의 소유자ㆍ점유자 또는 관리인\n2. 산불을 발견하거나 신고한 사람\n3. 산불 진화에 관계된 사람\n4. 산불을 발생시키거나 산불 발생과 관계된 사람\n③ 산림청장 또는 산림재난방지기관의 장은 산불 조사를 실시하기 위하여 대통령령으로 정하는 바에 따라 산불전문조사반을 구성ㆍ운영할 수 있다.\n④ 산림청장은 산불 발생 시 대응과정을 대통령령으로 정하는 바에 따라 분석ㆍ평가하여 그 결과를 산림재난방지기관의 장에게 통보하고 다음 연도 시행계획에 반영하여야 한다.\n⑤ 산불 조사의 범위 및 내용과 절차, 그 밖에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-49","law":"L","no":"49","label":"제49조","title":"산불피해 복구 등","chapter":"제5장 산림재난 조사 및 복구","section":"제1절 산불 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산불피해 복구 등","body":"① 산림청장 또는 산림재난방지기관의 장은 농림축산식품부령으로 정하는 바에 따라 산불로 피해가 발생한 산림재난피해지를 복구하여야 한다.\n② 산림청장 또는 산림재난방지기관의 장은 산불 조사 결과 산불 발생의 원인을 제공한 자가 따로 있는 경우에는그 원인제공자에게 산불 진화에 소요된 비용 및 산불피해 복구에 필요한 비용의 전부 또는 일부를 청구할 수 있다.\n<개정 2026. 5. 12.>"}]},{"id":"L-50","law":"L","no":"50","label":"제50조","title":"산사태등 조사","chapter":"제5장 산림재난 조사 및 복구","section":"제2절 산사태등 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산사태등 조사","body":"① 산림청장 또는 산림재난방지기관의 장은 산사태등의 발생 원인 및 피해 현황 등에 관한 조사를 실시하여야 한다.\n② 산림청장은 산사태등 발생 시 대응과정을 대통령령으로 정하는 바에 따라 분석ㆍ평가하여 그 결과를 산림재난방지기관의 장에게 통보하고 다음 연도 시행계획에 반영하여야 한다.\n③ 제1항에 따른 조사의 실시 절차 및 방법 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-51","law":"L","no":"51","label":"제51조","title":"산사태등 피해 복구","chapter":"제5장 산림재난 조사 및 복구","section":"제2절 산사태등 조사ㆍ복구","versions":[{"from":"2026-02-01","title":"산사태등 피해 복구","body":"① 산림청장 또는 산림재난방지기관의 장은 산사태등으로 피해가 발생한 산림재난피해지를 복구하여야 한다.\n② 산림청장 또는 산림재난방지기관의 장은 제1항에 따른 복구를 하려는 경우에는 해당 토지의 소유자ㆍ점유자 또는 관리인에게 대통령령으로 정하는 바에 따라 복구 일시ㆍ방법 등을 사전에 통지하여야 하며, 그 동의를 받아야 한\n다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다.\n1. 산림재난피해지가 산사태취약지역에 있는 경우\n2. 해당 토지의 소유자ㆍ점유자 또는 관리인이 대통령령으로 정하는 정당한 사유 없이 제1항에 따른 복구를 거부하거나 방해하는 경우\n③ 산림청장 또는 산림재난방지기관의 장은 제2항 본문에도 불구하고 토지의 소유자ㆍ점유자 또는 관리인의 주소 또는 거소가 불분명하거나 그 밖의 불가피한 사유로 제2항 본문에 따른 동의를 받을 수 없을 때에는 해당 기관의 게시판 및 인터넷 홈페이지에 30일 이상 그 사실을 공고하는 것으로 동의를 갈음할 수 있다.\n④ 그 밖에 사전 통지ㆍ동의 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-52","law":"L","no":"52","label":"제52조","title":"산림병해충 조사","chapter":"제5장 산림재난 조사 및 복구","section":"제3절 산림병해충 조사","versions":[{"from":"2026-02-01","title":"산림병해충 조사","body":"① 산림청장 또는 산림재난방지기관의 장은 산림병해충 피해가 발생한 경우에 산림병해충의 종류별ㆍ지역별ㆍ피해도별 조사를 실시하여야 한다.\n② 산림청장은 산림병해충이 발생한 지역의 산림병해충 대응과정을 대통령령으로 정하는 바에 따라 분석ㆍ평가하여 그 결과를 산림재난방지기관의 장에게 통보하고 다음 연도 시행계획에 반영하여야 한다.\n③ 제1항에 따른 산림병해충 조사 방법 및 제2항에 따른 통보 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-53","law":"L","no":"53","label":"제53조","title":"산림병해충 방제효과의 조사","chapter":"제5장 산림재난 조사 및 복구","section":"제3절 산림병해충 조사","versions":[{"from":"2026-02-01","title":"산림병해충 방제효과의 조사","body":"① 산림청장 또는 산림재난방지기관의 장은 효과적인 산림병해충 방제의 방법을 검증ㆍ평가하기 위하여 필요한 경우에는 방제를 완료한 후 방제효과를 조사할 수 있다.\n② 제1항에 따른 방제효과 조사의 시기 및 내용 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-54","law":"L","no":"54","label":"제54조","title":"산악기상관측망 구축ㆍ운영","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"산악기상관측망 구축ㆍ운영","body":"① 산림청장은 산림재난방지 등에 활용하기 위하여 전국 산지의 온도ㆍ기압ㆍ풍향ㆍ풍속ㆍ강수량 등을 관찰ㆍ측정하는 시설(이하 이 조에서 “산악기상관측망”이라 한다)을 구축ㆍ운영하여야 한다.이 경우 산림청장은 기상청장과 미리 협의하여야 한다.\n② 산림청장은 산림재난에 체계적ㆍ효율적으로 대응하기 위하여 산악기상관측망 구축ㆍ운영 등에 관한 기본계획을 5년마다 수립ㆍ시행하여야 한다.\n③ 산악기상관측망 구축 내용ㆍ방법 및 운영, 그 밖에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-55","law":"L","no":"55","label":"제55조","title":"산림항공기 운용","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"산림항공기 운용","body":"① 산림청장은 다음 각 호에 따른 산림재난 방지 및 구조ㆍ구호 활동 등을 수행하기 위하여 산림항공기(「항공안전법」 제2조제1호부터 제3호까지에 따른 항공기, 경량항공기, 초경량비행장치를 말한다)를 운영하여야 한다.\n1. 산림재난 예방ㆍ대비ㆍ대응ㆍ조사ㆍ복구\n2. 재난 또는 사고 발생 시 인명 구조 및 구호 활동\n3. 산불진화훈련 또는 헬기의 기능시험ㆍ이동ㆍ조종기술 훈련 등을 위한 비행\n4. 그 밖에 산림행정을 위하여 농림축산식품부령으로 정하는 사항\n② 제1항에 따른 산림항공기의 운영에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"L-56","law":"L","no":"56","label":"제56조","title":"산림재난방지 교육","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 교육","body":"① 산림청장은 산림재난방지 분야의 전문인력을 양성하고 국민의 산림재난에 대한 인식을 높이기 위하여 다음 각 호의 사항이 포함된 산림재난방지 교육계획을 농림축산식품부령으로 정하는 바에 따라 수립ㆍ실시하여야 한다.\n1. 교육의 목표 및 운영 방향\n2. 교육의 내용ㆍ방법ㆍ대상ㆍ기간 등\n② 산림청장 또는 산림재난방지기관의 장은 다음 각 호에 해당하는 사람에게 산림재난방지 교육을 실시하여야 한다.\n1. 산림재난방지 담당 공무원\n2. 산불예방진화대 및 산불재난특수진화대의 대원\n3. 산사태현장예방단의 단원\n4. 산림병해충예찰방제단의 단원\n5. 그 밖에 국민 또는 산림재난방지 업무 수행을 위하여 산림재난방지기관 및 산림재난방지유관기관에 고용된 사람으로서 농림축산식품부령으로 정하는 사람\n③ 산림청장 또는 산림재난방지기관의 장은 산림재난방지 교육을 제58조에 따른 한국산림재난안전기술공단 등 농림축산식품부령으로 정하는 기관에 위탁할 수 있다.\n④ 제2항에 따라 실시하는 산림재난방지 교육의 내용ㆍ기간ㆍ방법 등에 필요한 사항은 농림축산식품부령으로 정한다."},{"from":"2026-11-13","title":"산림재난방지 교육","body":"① 산림청장은 산림재난방지 분야의 전문인력을 양성하고 국민의 산림재난에 대한 인식을 높이기 위하여 다음 각 호의 사항이 포함된 산림재난방지 교육계획을 농림축산식품부령으로 정하는 바에 따라 수립ㆍ실시하여야 한다.\n1. 교육의 목표 및 운영 방향\n2. 교육의 내용ㆍ방법ㆍ대상ㆍ기간 등\n② 산림청장 또는 산림재난방지기관의 장은 다음 각 호에 해당하는 사람에게 산림재난방지 교육을 실시하여야 한다.\n1. 산림재난방지 담당 공무원\n2. 산불예방진화대 및 산불재난특수진화대의 대원\n3. 산사태현장예방단의 단원\n4. 산림병해충예찰방제단의 단원\n5. 그 밖에 국민 또는 산림재난방지 업무 수행을 위하여 산림재난방지기관 및 산림재난방지유관기관에 고용된 사람으로서 농림축산식품부령으로 정하는 사람\n③ 지방자치단체의 장은 대통령령으로 정하는 바에 따라 산림청장이 실시하는 산림재난방지에 관한 교육을 받아야 한다.<신설 2026. 5. 12.>\n④ 산림청장 또는 산림재난방지기관의 장은 산림재난방지 교육을 제58조에 따른 한국산림재난안전기술공단 등 농림축산식품부령으로 정하는 기관에 위탁할 수 있다.<개정 2026. 5. 12.>\n⑤ 제2항에 따라 실시하는 산림재난방지 교육의 내용ㆍ기간ㆍ방법 등에 필요한 사항은 농림축산식품부령으로 정한다.<개정 2026. 5. 12.>"}]},{"id":"L-57","law":"L","no":"57","label":"제57조","title":"산림재난방지 연구사업 및 국제협력","chapter":"제6장 산림재난방지 기반조성","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 연구사업 및 국제협력","body":"① 산림청장은 산림재난방지 및 피해경감을 위한 조사ㆍ연구ㆍ개발사업(이하 “산림재난방지 연구사업”이라 한다)을 실시할 수 있다.\n② 산림청장은 산림재난방지 연구사업과 관련된 공공기관ㆍ법인ㆍ단체ㆍ대학(이들의 부설연구소 등을 포함한다. 이하 “산림재난방지 연구기관”이라 한다)의 인력ㆍ자금ㆍ시험시설 및 기술정보를 활용하는 공동연구를 추진할 수 있다.\n③ 산림청장은 산림재난방지 연구기관에 대하여 예산의 범위에서 산림재난방지 연구사업에 필요한 경비의 전부 또는 일부를 지원할 수 있다.\n④ 산림청장 또는 지방자치단체의 장은 산림재난과 관련한 국제협력을 강화하기 위하여 기술 및 정보의 교류, 홍보, 조사 등에 대한 시책을 수립ㆍ시행할 수 있다. 이 경우 시책과 관련된 사업에 참여하는 학계ㆍ연구기관 및 기업체 등에 대하여 대통령령으로 정하는 바에 따라 예산의 범위에서 그 추진에 필요한 경비의 전부 또는 일부를 지원할 수 있다.\n⑤ 산림청장 또는 지방자치단체의 장은 산림재난방지와 관련된 국제협력의 효율적 추진을 위하여 필요한 때에는 대통령령으로 정하는 기관에 산림재난방지와 관련된 정보의 수집ㆍ분석 및 제공에 관한 업무를 위탁할 수 있다. 이 경우 위탁받은 기관에 대하여 대통령령으로 정하는 바에 따라 그 위탁업무의 수행에 필요한 비용의 전부 또는 일부를 예산의 범위에서 보조할 수 있다."}]},{"id":"L-58","law":"L","no":"58","label":"제58조","title":"한국산림재난안전기술공단 설립 등","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"한국산림재난안전기술공단 설립 등","body":"① 산림청장은 산림재난방지를 위한 연구ㆍ조사, 교육ㆍ훈련 및 기술ㆍ정보의 국제교류 등의 업무를 수행하게 하기 위하여 한국산림재난안전기술공단(이하 “공단”이라 한다)을 설립할 수 있다.\n② 공단은 법인으로 하고, 주된 사무소의 소재지에서 설립등기를 함으로써 성립한다.\n③ 이 법에 따른 공단이 아닌 자는 한국산림재난안전기술공단 또는 이와 유사한 명칭을 사용하지 못한다.\n④ 그 밖에 공단의 설립인가 기준ㆍ절차 및 감독 등에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-59","law":"L","no":"59","label":"제59조","title":"정관","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"정관","body":"① 공단의 정관에는 다음 각 호의 사항이 포함되어야 한다.\n1. 목적\n2. 명칭\n3. 주된 사무소, 지부, 그 밖의 사무소에 관한 사항\n4. 임직원에 관한 사항\n5. 이사회에 관한 사항\n6. 사업 및 그 집행에 관한 사항\n7. 자산 및 그 회계에 관한 사항\n8. 정관변경에 관한 사항\n9. 공고의 방법\n10. 내부규정의 제정ㆍ개정 및 폐지에 관한 사항\n11. 그 밖에 공단의 운영에 관한 사항으로서 대통령령으로 정하는 사항\n② 공단이 정관을 제정ㆍ변경하려면 산림청장의 인가를 받아야 한다."}]},{"id":"L-60","law":"L","no":"60","label":"제60조","title":"임직원","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"임직원","body":"① 공단에는 정관으로 정하는 바에 따라 임원과 필요한 직원을 둔다.\n② 임원의 임명 및 임기에 대하여는 「공공기관의 운영에 관한 법률」 제26조 및 제28조를 준용하고, 직원은 이사장이 임면한다."}]},{"id":"L-61","law":"L","no":"61","label":"제61조","title":"임원의 결격사유","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"임원의 결격사유","body":"「공공기관의 운영에 관한 법률」 제34조제1항 각 호 및 같은 조 제2항 각 호의 어느 하나에 해당하는 사람은 공단의 임원이 될 수 없다."}]},{"id":"L-62","law":"L","no":"62","label":"제62조","title":"사업 등","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"사업 등","body":"① 공단은 다음 각 호의 사업을 수행한다.\n1. 기본계획 및 시행계획 수립 지원\n2. 산림재난 조사ㆍ예찰ㆍ점검 및 산림재난방지에 관한 연구\n3. 산림재난 피해조사 및 복구계획 수립 지원\n4. 산림재난방지에 관한 교육ㆍ훈련\n5. 산림재난방지 기술ㆍ정보에 관한 국제교류\n6. 행정기관의 산림재난방지에 관한 위탁사업\n7. 제56조제2항에 따른 산림재난방지 교육과 홍보 지원\n8. 산림재난방지 관련 단체와의 교류 및 협력\n9. 임도, 산불예방ㆍ진화시설 및 사방시설에 관한 조사ㆍ연구ㆍ평가ㆍ점검 및 안전진단\n10. 제1호부터 제9호까지에 부대되는 사업으로서 공단의 규정으로 정하는 사업\n11. 그 밖에 공단의 목적을 달성하기 위하여 필요한 사업으로서 정관으로 정하는 사업\n② 산림청장 또는 산림재난방지기관의 장은 제1항 각 호의 사업을 공단에 위탁하거나 대행하게 할 수 있다."}]},{"id":"L-63","law":"L","no":"63","label":"제63조","title":"공단의 운영비","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"공단의 운영비","body":"공단의 운영에 필요한 비용은 다음 각 호의 재원으로 충당한다.\n1. 정부의 보조금\n2. 제62조제1항 각 호에 따른 사업의 수입금\n3. 자산의 관리ㆍ운용에 따른 수익금\n4. 정부 외의 자의 출연금, 보조금 또는 기부금\n5. 그 밖의 수입금"}]},{"id":"L-64","law":"L","no":"64","label":"제64조","title":"예산과 결산","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"예산과 결산","body":"① 공단은 사업연도마다 총수입과 총지출을 예산으로 편성하여 산림청장의 승인을 받아야 한다. 이를 변경하려는 경우에도 또한 같다.\n② 공단이 제1항에 따른 승인을 받으려는 경우에는 예산안을 회계연도 개시 20일 전까지 산림청장에게 제출하여야 한다.\n③ 공단은 매 회계연도가 끝난 후 3개월 이내에 다음 각 호의 서류를 첨부한 결산서를 산림청장에게 제출하고 그 승인을 받아 결산을 확정하여야 한다.\n1. 재무제표(공인회계사나 회계법인의 감사의견서를 포함한다)와 그 부속서류\n2. 그 밖에 결산의 내용을 명확하게 하기 위하여 농림축산식품부령으로 정하는 서류\n④ 공단은 매 회계연도의 결산 결과 이익금이 생겼을 때에는 이월손실금의 보전에 우선 충당하고, 남은 이익금은 다음 회계연도로 이월하거나 산림청장의 승인을 받아 공단의 사업 수행을 위하여 사용할 수 있다."}]},{"id":"L-65","law":"L","no":"65","label":"제65조","title":"지도ㆍ감독","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"지도ㆍ감독","body":"① 산림청장은 다음 각 호의 사항에 대하여 공단을 지도ㆍ감독한다.\n1. 제62조제1항 각 호에 따른 사업의 수행\n2. 연간 사업계획 및 예산안 편성에 관한 사항\n3. 그 밖에 대통령령으로 정하는 사항\n② 산림청장은 필요하면 제1항 각 호의 사항을 보고하게 하거나, 소속 공무원에게 공단의 장부ㆍ서류ㆍ시설과 그 밖의 물건을 검사하게 할 수 있다. 이 경우 검사를 하는 공무원은 그 권한을 나타내는 증표를 지니고 이를 관계인에게 내보여야 한다.\n③ 산림청장은 제1항 및 제2항에 따른 지도ㆍ감독 또는 검사 결과 위법하거나 부당한 사실을 발견한 경우에는 그 시정을 명할 수 있다.\n④ 그 밖에 공단에 대한 산림청장의 지도ㆍ감독에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-66","law":"L","no":"66","label":"제66조","title":"「민법」의 준용","chapter":"제7장 한국산림재난안전기술공단","section":"","versions":[{"from":"2026-02-01","title":"「민법」의 준용","body":"공단에 관하여 이 법에 규정된 것을 제외하고는 「민법」 중 재단법인에 관한 규정을 준용한다."}]},{"id":"L-67","law":"L","no":"67","label":"제67조","title":"사상자에 대한 보상","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"사상자에 대한 보상","body":"산림청장 또는 산림재난방지기관의 장은 산림재난방지 또는 인명구조작업으로 사망하거나 부상을 입은 사람에게 대통령령으로 정하는 바에 따라 보상금을 지급할 수 있다. 다만, 보상금 지급의 원인이 되는 산림재난의 발생에 직접 책임이 있는 사람에게는 보상금을 지급하지 아니할 수 있다."}]},{"id":"L-68","law":"L","no":"68","label":"제68조","title":"산림재난 관련 보험ㆍ공제의 가입권장","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"산림재난 관련 보험ㆍ공제의 가입권장","body":"산림청장은 산림소유자가 산림재난 등으로 손해를 입을 경우 이를 보전 (補塡)할 수 있도록 산림소유자에게 다음 각 호의 보험 또는 공제에 가입하도록 권장할 수 있다.\n1. 「농어업재해보험법」에 따른 보험\n2. 「농어업인의 안전보험 및 안전재해예방에 관한 법률」에 따른 보험\n3. 「산림조합법」에 따른 산림공제"}]},{"id":"L-69","law":"L","no":"69","label":"제69조","title":"포상","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"포상","body":"산림청장 및 산림재난방지기관의 장은 다음 각 호의 사람 또는 기관ㆍ단체에 대하여 대통령령으로 정하는 바에 따라 포상하거나 포상금을 지급할 수 있다.\n1. 산불방지, 산불 발생의 신고 및 산불 관련 범법자의 신고ㆍ검거에 공로가 있는 사람이나 기관ㆍ단체\n2. 산사태등 피해나 발생 징후를 신고한 사람\n3. 산림병해충의 피해나 발생 징후를 신고한 사람\n4. 그 밖에 산림재난방지 및 산림재난피해지 복구에 기여한 사람이나 기관ㆍ단체"}]},{"id":"L-70","law":"L","no":"70","label":"제70조","title":"다른 사람의 토지 등에 출입 등","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"다른 사람의 토지 등에 출입 등","body":"① 산림청장 및 산림재난방지기관의 장은 산림재난방지를 위하여 필요하면 관계 공무원 또는 산림재난방지유관기관의 관계 직원에게 타인의 토지나 이에 붙어 있는 건물, 그 밖의 인공구조물에 출입하거나 이를 잠시 사용하게 할 수 있으며, 부득이한 경우에는 식물 등을 옮기거나 제거하게 할 수 있다.\n② 제1항 외에 토지의 출입 등에 관하여는 「산지관리법」 제47조제2항부터 제5항까지 및 같은 법 제48조를 준용한다."}]},{"id":"L-71","law":"L","no":"71","label":"제71조","title":"산림재난방지 영상정보처리기기의 설치ㆍ운영","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 영상정보처리기기의 설치ㆍ운영","body":"① 산림청장 및 산림재난방지기관의 장은 산림재난방지를 위하여 영상정보처리기기(「개인정보 보호법」 제2조제7호 및 제7호의2에 따른 고정형 영상정보처리기기 및 이동형 영상정보처리기기를 말한다. 이하 “산림재난방지 영상정보처리기기”라 한다)를 설치ㆍ운영할 수 있다. 이 경우 필요한 범위에서 최소한의 개인정보만을 처리하여야 하며, 그 목적 외의 용도로 활용하여서는 아니 된다.\n② 산림청장은 다음 각 호의 기관이 개별적으로 설치ㆍ운영하고 있는 영상정보처리기기를 산림재난방지 및 산림의 보호를 위하여 연계ㆍ통합하여 활용할 수 있다.\n1. 지방자치단체\n2. 공단\n3. 「국립공원공단법」에 따른 국립공원공단\n4. 「산림문화ㆍ휴양에 관한 법률」 제27조의2에 따른 한국등산ㆍ트레킹지원센터\n5. 「산림복지 진흥에 관한 법률」 제49조에 따른 한국산림복지진흥원\n6. 「수목원ㆍ정원의 조성 및 진흥에 관한 법률」 제18조의19에 따른 한국수목원정원관리원\n7. 「임업 및 산촌 진흥촉진에 관한 법률」 제29조의2에 따른 한국임업진흥원\n8. 「전기안전관리법」 제30조에 따른 한국전기안전공사\n9. 그 밖에 「공공기관의 운영에 관한 법률」에 따른 공공기관으로서 대통령령으로 정하는 기관\n③ 산림재난방지 영상정보처리기기 설치ㆍ운영에 관하여 이 법에서 규정한 것을 제외하고는 「개인정보 보호법」을 적용한다."}]},{"id":"L-72","law":"L","no":"72","label":"제72조","title":"권리ㆍ의무 등 승계","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"권리ㆍ의무 등 승계","body":"① 이 법이나 이 법에 따른 명령에 따라 산림소유자ㆍ점유자 또는 관리인, 산림 외의 토지소유자 등에게 한 처분은 그 승계인에 대하여도 효력이 있다.\n② 이 법이나 이 법에 따른 명령에 따라 산림소유자ㆍ점유자 또는 관리인이나 산림 외의 토지소유자 등이 한 신청ㆍ신고 및 그 밖의 행위는 그 승계인에 대하여도 효력이 있다."}]},{"id":"L-73","law":"L","no":"73","label":"제73조","title":"권한 등 위임 및 위탁","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"권한 등 위임 및 위탁","body":"① 이 법에 따른 산림청장의 권한은 그 일부를 대통령령으로 정하는 바에 따라 소속 기관의 장 또는 지방자치단체의 장에게 위임할 수 있다.\n② 이 법에 따른 시ㆍ도지사의 권한은 그 일부를 대통령령으로 정하는 바에 따라 시장(「제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법」에 따른 행정시장을 포함한다)ㆍ군수ㆍ구청장에게 위임할 수 있다.\n③ 이 법에 따른 지방산림청장의 권한은 그 일부를 대통령령으로 정하는 바에 따라 국유림관리소장에게 위임할 수 있다.\n④ 다음 각 호에 해당하는 산림청장 또는 산림재난방지기관의 장의 업무는 그 일부를 대통령령으로 정하는 바에 따라 관련 기관 또는 단체에 위탁할 수 있다.\n1. 제25조에 따른 산사태취약지역 현지점검\n2. 제48조에 따른 산불 조사\n3. 제50조에 따른 산사태등 조사\n4. 제52조에 따른 산림병해충 조사\n5. 제53조에 따른 산림병해충 방제효과의 조사"}]},{"id":"L-74","law":"L","no":"74","label":"제74조","title":"산림재난방지 지시 위반 등에 대한 징계 요구 등","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 지시 위반 등에 대한 징계 요구 등","body":"① 산림청장 및 산림재난방지기관의 장은 이 법에 따른 산림재난 예방ㆍ대비ㆍ대응ㆍ조사ㆍ복구 등의 업무를 수행할 때 지시를 위반하거나 주어진 임무를 게을리한 산림재난방지기관 또는 산림재난방지유관기관 소속의 공무원이나 직원의 명단을 해당 공무원 또는 직원의 소속기관의 장에게 통보하고, 그 소속기관의 장에게 해당 공무원 또는 직원의 징계 등을 요구할 수 있다. 이 경우 그 사실을 증명할 수 있는 관계 자료를 그 소속기관의 장에게 함께 통보하여야 한다.\n② 제1항에 따라 통보를 받은 산림재난방지기관 또는 산림재난방지유관기관의 장은 해당 공무원이나 직원에 대한 징계 등 적절한 조치를 하고 그 결과를 명단을 통보한 기관의 장에게 알려야 한다.\n③ 산림청장 및 산림재난방지기관의 장은 소속 공무원으로 하여금 제1항에 따른 사실의 증명에 필요한 조사를 하게할 수 있다. 이 경우 조사를 하는 공무원은 그 권한을 표시하는 증표를 지니고 이를 관계인에게 내보여야 한다.\n④ 제1항에 따른 통보 및 제3항에 따른 조사에 필요한 사항은 대통령령으로 정한다."}]},{"id":"L-75","law":"L","no":"75","label":"제75조","title":"벌칙 적용에서 공무원 의제","chapter":"제8장 보칙","section":"","versions":[{"from":"2026-02-01","title":"벌칙 적용에서 공무원 의제","body":"공단의 임직원과 제73조제4항에 따라 위탁받은 업무를 수행하는 관련 기관 또는 단체의 임직원은 「형법」 제127조 및 제129조부터 제132조까지를 적용할 때에는 공무원으로 본다."}]},{"id":"L-76","law":"L","no":"76","label":"제76조","title":"벌칙","chapter":"제9장 벌칙","section":"","versions":[{"from":"2026-02-01","title":"벌칙","body":"① 타인 소유의 산림에 불을 지른 사람은 5년 이상 15년 이하의 징역에 처한다.\n② 자기 소유의 산림에 불을 지른 사람은 1년 이상 10년 이하의 징역에 처한다.\n③ 제2항의 경우 불이 타인의 산림에까지 번져 피해를 입혔을 때에는 3년 이상 10년 이하의 징역에 처한다.\n④ 과실로 인하여 타인 또는 자신의 산림을 불에 태워 공공을 위험에 빠뜨린 사람은 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.\n⑤ 제1항부터 제3항까지의 미수범은 처벌한다."},{"from":"2026-11-13","title":"벌칙","body":"① 타인 소유의 산림에 불을 지른 사람은 5년 이상 15년 이하의 징역에 처한다.\n② 자기 소유의 산림에 불을 지른 사람은 2년 이상 10년 이하의 징역에 처한다.<개정 2026. 5. 12.>\n③ 제2항의 경우 불이 타인의 산림에까지 번져 피해를 입혔을 때에는 3년 이상 10년 이하의 징역에 처한다.\n④ 과실로 인하여 타인 또는 자신의 산림을 불에 태워 공공을 위험에 빠뜨린 사람은 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.<개정 2026. 5. 12.>\n⑤ 제1항부터 제3항까지의 미수범은 처벌한다."}]},{"id":"L-77","law":"L","no":"77","label":"제77조","title":"벌칙","chapter":"제9장 벌칙","section":"","versions":[{"from":"2026-02-01","title":"벌칙","body":"① 제24조를 위반하여 산사태취약지역에서 사방시설을 훼손하거나 사방시설을 설치ㆍ관리하는 것을 거부 또는 방해한 사람은 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.\n② 다음 각 호의 어느 하나에 해당하는 자는 1천만원 이하의 벌금에 처한다.\n1. 제25조제3항에 따른 안전조치 명령을 위반한 자\n2. 제38조제4항을 위반하여 산림재난방지기관의 안전조치를 방해한 자"}]},{"id":"L-78","law":"L","no":"78","label":"제78조","title":"벌칙","chapter":"제9장 벌칙","section":"","versions":[{"from":"2026-02-01","title":"벌칙","body":"① 제43조제1항제2호에 따른 이동 제한이나 사용 금지 명령을 위반한 자는 1천만원 이하의 벌금에 처한다.\n② 다음 각 호의 어느 하나에 해당하는 자는 500만원 이하의 벌금에 처한다.\n1. 제43조제1항제1호 또는 제3호부터 제5호까지에 따른 명령을 위반한 자\n2. 제45조제3항을 위반하여 설계하거나 감리한 자"}]},{"id":"L-79","law":"L","no":"79","label":"제79조","title":"과태료","chapter":"제9장 벌칙","section":"","versions":[{"from":"2026-02-01","title":"과태료","body":"① 제58조제3항을 위반하여 한국산림재난안전기술공단 또는 이와 유사한 명칭을 사용한 자에게는 500만원 이하의 과태료를 부과한다.\n② 다음 각 호의 어느 하나에 해당하는 사람에게는 200만원 이하의 과태료를 부과한다.\n1. 제18조제1항제1호를 위반하여 산림 또는 산림인접지역에서 불을 피우거나 불을 가지고 들어간 사람(같은 조 제2항의 허가를 받은 사람은 제외한다)\n2. 제18조제1항제3호를 위반하여 산림 또는 산림인접지역에서 농림축산식품부령으로 정하는 기간에 풍등 등 소형열기구를 날린 사람\n3. 제22조제12항을 위반하여 대피소 표지판 또는 산사태취약지역 표지판을 이전하거나 훼손한 사람\n③ 제18조제1항제2호를 위반하여 산림에서 담배를 피우거나 담배꽁초를 버린 사람에게는 70만원 이하의 과태료를 부과한다.\n④ 다음 각 호의 어느 하나에 해당하는 사람에게는 30만원 이하의 과태료를 부과한다.\n1. 제18조제3항을 위반하여 관할 소방본부장 또는 소방서장 및 인접한 산림의 소유자ㆍ점유자 또는 관리인에게 알 리지 아니하고 불을 피운 사람\n2. 제18조제4항의 금지명령을 위반하여 화기, 인화 물질 또는 발화 물질을 지니고 산림에 들어간 사람\n⑤ 제1항부터 제4항까지에 따른 과태료는 대통령령으로 정하는 바에 따라 산림청장, 시ㆍ도지사, 시장ㆍ군수ㆍ구청장, 지방산림청장이 부과ㆍ징수한다."},{"from":"2026-11-13","title":"과태료","body":"① 제58조제3항을 위반하여 한국산림재난안전기술공단 또는 이와 유사한 명칭을 사용한 자에게는 500만원 이하의 과태료를 부과한다.\n② 다음 각 호의 어느 하나에 해당하는 사람에게는 300만원 이하의 과태료를 부과한다.<개정 2026. 5. 12.>\n1. 제18조제1항제1호를 위반하여 산림 또는 산림인접지역에서 불을 피우거나 불을 가지고 들어간 사람(같은 조 제2항의 허가를 받은 사람은 제외한다)\n2. 제18조제1항제3호를 위반하여 산림 또는 산림인접지역에서 농림축산식품부령으로 정하는 기간에 풍등 등 소형열기구를 날린 사람\n3. 삭제<2026. 5. 12.>\n③ 제22조제12항을 위반하여 대피소 표지판 또는 산사태취약지역 표지판을 이전하거나 훼손한 사람에게는 200만원 이하의 과태료를 부과한다.<신설 2026. 5. 12.>\n④ 제18조제1항제2호를 위반하여 산림에서 담배를 피우거나 담배꽁초를 버린 사람에게는 100만원 이하의 과태료를 부과한다.<개정 2026. 5. 12.>\n⑤ 다음 각 호의 어느 하나에 해당하는 사람에게는 70만원 이하의 과태료를 부과한다.<개정 2026. 5. 12.>\n1. 제18조제3항을 위반하여 관할 소방본부장 또는 소방서장 및 인접한 산림의 소유자ㆍ점유자 또는 관리인에게 알 리지 아니하고 불을 피운 사람\n2. 제18조제4항의 금지명령을 위반하여 화기, 인화 물질 또는 발화 물질을 지니고 산림에 들어간 사람\n⑥ 제1항부터 제5항까지에 따른 과태료는 대통령령으로 정하는 바에 따라 산림청장, 시ㆍ도지사, 시장ㆍ군수ㆍ구청장, 지방산림청장이 부과ㆍ징수한다.<개정 2026. 5. 12.>"}]},{"id":"L-80","law":"L","no":"80","label":"제80조","title":"가중죄","chapter":"제9장 벌칙","section":"","versions":[{"from":"2026-11-13","title":"가중죄","body":"제76조제1항부터 제4항까지의 죄를 저질러 사람을 사망에 이르게 한 자는 각 해당 항에서 정한 형(刑)의 2분의 1까지 가중할 수 있다.\n[본조신설 2026. 5. 12.]"}]},{"id":"L-A1","law":"L","no":"1","label":"부칙 제1조","title":"시행일","chapter":"부칙 <제21622호,2026. 5. 12.>","section":"","versions":[{"from":"2026-02-01","title":"시행일","body":"이 법은 공포한 날부터 시행한다. 다만, 제9조의2, 제16조, 제17조, 제56조, 제76조, 제79조 및 제80조의 개정규정은 공포 후 6개월이 경과한 날부터 시행한다."}]},{"id":"L-A2","law":"L","no":"2","label":"부칙 제2조","title":"비용의 청구에 관한 적용례","chapter":"부칙 <제21622호,2026. 5. 12.>","section":"","versions":[{"from":"2026-02-01","title":"비용의 청구에 관한 적용례","body":"제49조제2항의 개정규정은 이 법 시행 이후 산불이 발생한 경우부터 적용한다."}]},{"id":"D-1","law":"D","no":"1","label":"제1조","title":"목적","chapter":"제1장 총칙","section":"","versions":[{"from":"2026-02-01","title":"목적","body":"이 영은 「산림재난방지법」에서 위임한 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다."}]},{"id":"D-2","law":"D","no":"2","label":"제2조","title":"정의","chapter":"제1장 총칙","section":"","versions":[{"from":"2026-02-01","title":"정의","body":"① 「산림재난방지법」(이하 “법”이라 한다) 제2조제6호에서 “대통령령으로 정하는 지역”이란 법 제4조 각 호의 구분에 따른 지역을 말한다.\n② 법 제2조제11호에서 “중앙행정기관과 그 소속기관 등 대통령령으로 정하는 기관”이란 다음 각 호의 기관을 말한다.\n1. 「정부조직법」에 따른 행정각부, 기획예산처 및 국무조정실\n2. 대검찰청, 경찰청, 소방청, 국가유산청, 농촌진흥청, 기상청 및 해양경찰청\n3. 육군본부, 해군본부 및 공군본부\n4. 다음 각 목의 기관\n가. 법 제58조에 따른 한국산림재난안전기술공단\n나. 「국립공원공단법」에 따른 국립공원공단\n다. 「한국농어촌공사 및 농지관리기금법」에 따른 한국농어촌공사\n라. 「한국수자원공사법」에 따른 한국수자원공사\n마. 「한국전력공사법」에 따른 한국전력공사\n바. 「한국도로공사법」에 따른 한국도로공사\n사. 「한국철도공사법」에 따른 한국철도공사\n5. 「산림조합법」 제2조제2호에 따른 지역조합 및 같은 조 제4호에 따른 중앙회\n6. 그 밖에 산림청장이 산림재난방지를 위하여 특별히 필요하다고 인정하여 고시하는 기관ㆍ단체"}]},{"id":"D-3","law":"D","no":"3","label":"제3조","title":"적용 장소 또는 대상","chapter":"제1장 총칙","section":"","versions":[{"from":"2026-02-01","title":"적용 장소 또는 대상","body":"법 제4조제2호에서 “대통령령으로 정하는 토지”란 「산지관리법」 제2조제1호에 따른 산지로부터 50미터 이내의 토지를 말한다."}]},{"id":"D-4","law":"D","no":"4","label":"제4조","title":"산림재난방지 기본계획 등","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 기본계획 등","body":"① 법 제7조제1항제5호에서 “대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다.\n1. 산림재난방지의 홍보에 관한 사항\n2. 산림재난방지 관련 민간단체의 참여ㆍ육성에 관한 사항\n3. 그 밖에 산림재난방지를 위하여 산림청장이 필요하다고 인정하는 사항\n② 산림청장은 법 제7조제1항에 따른 산림재난방지 기본계획(이하 “기본계획”이라 한다)을 수립하거나 변경한 때에는 같은 조 제3항에 따라 국민들이 그 내용을 알 수 있도록 산림청의 인터넷 홈페이지 등에 공고해야 한다.\n③ 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사ㆍ특별자치도지사(이하 “시ㆍ도지사”라 한다) 및 지방산림청장은 법 제7조제4항에 따른 산림재난방지 지역계획(이하 “지역계획”이라 한다)을 수립하거나 변경한 때에는 주민들이 그 내용을 알 수 있도록 해당 기관의 인터넷 홈페이지 등에 공고해야 한다.\n④ 산림청장, 시ㆍ도지사 및 지방산림청장은 다음 각 호의 어느 하나에 해당하는 경우에는 기본계획 또는 지역계획을 변경할 수 있다.\n1. 산림재난방지에 관한 조직ㆍ인력, 재정에 변화가 있는 경우\n2. 산림재난방지 정책에 뚜렷한 변경이 있는 경우\n3. 그 밖에 산림청장, 시ㆍ도지사 및 지방산림청장이 체계적인 산림재난방지를 위하여 변경이 필요하다고 인정하는 경우\n⑤ 법 제7조제7항에 따라 산림청장, 시ㆍ도지사 및 지방산림청장은 산림재난방지유관기관의 장에게 다음 각 호의 자료 제출을 요청할 수 있다.\n1. 산림재난방지에 필요한 인력ㆍ장비 및 시설의 확보 현황에 관한 자료\n2. 산림재난방지에 필요한 기상정보 등에 관한 자료\n3. 산림재난 발생 시 주민 대피 및 응급복구ㆍ지원 대책에 관한 자료\n4. 그 밖에 산림청장, 시ㆍ도지사 및 지방산림청장이 기본계획 및 지역계획을 수립 또는 변경하기 위해 필요하다고 인정하는 자료"}]},{"id":"D-5","law":"D","no":"5","label":"제5조","title":"산림재난방지 시행계획의 수립ㆍ시행","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난방지 시행계획의 수립ㆍ시행","body":"① 법 제8조제1항에 따른 산림재난방지 시행계획(이하 “시행계획”이라 한다) 및 같은 조 제2항에 따른 산림재난방지 지역시행계획(이하 “지역시행계획”이라 한다)에는 다음 각 호의 사항이 포함되어야 한다.\n1. 해당 연도의 산림재난방지 추진 목표와 전략\n2. 주요 산림재난방지 세부 추진계획\n3. 산림재난방지 홍보에 관한 사항\n4. 산림재난방지 교육 및 훈련에 관한 사항\n5. 산림재난방지유관기관 협조에 관한 사항\n6. 그 밖에 산림재난방지를 위하여 산림청장 또는 산림재난방지기관의 장이 필요하다고 인정하는 사항\n② 산림청장은 다음 각 호의 구분에 따른 시기까지 시행계획을 분야별로 수립해야 한다.\n1. 산불ㆍ산림병해충 분야: 1월 10일\n2. 산사태 및 토석류(이하 “산사태등”이라 한다) 분야: 3월 31일\n③ 산림재난방지기관의 장은 다음 각 호의 구분에 따른 시기까지 지역시행계획을 분야별로 수립해야 한다.\n1. 산불ㆍ산림병해충 분야: 1월 25일\n2. 산사태등 분야: 4월 30일\n④ 산림재난방지기관의 장은 해당 연도의 지역시행계획 추진실적을 해당 연도 12월 31일까지 산림청장에게 제출해야 한다.\n⑤ 산림청장 또는 산림재난방지기관의 장은 다음 각 호의 어느 하나에 해당하는 경우에는 시행계획 또는 지역시행계획을 변경할 수 있다.\n1. 산림재난방지에 관한 조직ㆍ인력, 재정에 변화가 있는 경우\n2. 산림재난방지 정책에 뚜렷한 변경이 있는 경우\n3. 그 밖에 산림청장 또는 산림재난방지기관의 장이 필요하다고 인정하는 경우\n⑥ 법 제8조제4항에 따른 자료 제출에 관해서는 제4조제5항을 준용한다."}]},{"id":"D-6","law":"D","no":"6","label":"제6조","title":"건축신고 등의 검토","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"건축신고 등의 검토","body":"① 법 제10조제1항에 따른 통보에는 농림축산식품부령으로 정하는 서류를 첨부해야 한다.\n② 법 제10조제2항에서 “대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다.\n1. 건축물 등이 있는 토지 주변의 산림재난 위험성에 관한 사항\n2. 옹벽, 사방댐 등 재해예방시설에 관한 사항\n3. 그 밖에 산림재난방지를 위하여 산림청장이 필요하다고 인정하는 사항"}]},{"id":"D-7","law":"D","no":"7","label":"제7조","title":"산림재난정보시스템의 구축ㆍ운영 등","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"산림재난정보시스템의 구축ㆍ운영 등","body":"① 산림청장은 법 제11조제1항에 따라 산림재난정보시스템을 구축ㆍ운영하는 경우 산림청과 산림재난방지기관이 산림재난에 공동으로 대응할 수 있도록 데이터베이스 전달체계를 갖추고, 산림청과 산림재난방지기관이 다음 각 호의 업무에 활용할 수 있도록 구축ㆍ운영해야 한다.\n1. 산림재난 예방ㆍ대응 및 복구에 필요한 정보 수집ㆍ제공\n2. 산림재난 위험 지역 등 산림재난 관련 정보 대국민 알림\n3. 산지개발에 따른 재해위험성 평가 및 재해예방시설 설치에 필요한 정보 수집ㆍ제공\n② 산림청장은 법 제11조제2항에 따라 자료의 제출을 요청하는 경우에는 다음 각 호의 사항을 포함한 서면(전자문서를 포함한다. 이하 같다)으로 통보해야 한다.\n1. 제출요청 사유\n2. 제출기한\n3. 제출자료\n4. 제출 방식 및 형태\n③ 제1항 및 제2항에서 규정한 사항 외에 산림재난정보시스템 구축ㆍ운영 등에 필요한 세부 사항은 산림청장이 정 한다."}]},{"id":"D-8","law":"D","no":"8","label":"제8조","title":"중앙산림재난상황실의 구성ㆍ운영","chapter":"제2장 계획 수립 및 대비","section":"","versions":[{"from":"2026-02-01","title":"중앙산림재난상황실의 구성ㆍ운영","body":"① 법 제12조에 따른 중앙산림재난상황실은 상황실장, 상황반장(교대근무 상황반원 중 최상급자를 말한다), 상황반원 및 통신요원 등으로 구성한다.\n② 중앙산림재난상황실의 상황실장은 중앙산림재난상황실 업무를 총괄ㆍ조정하며, 상황반장은 실시간 재난상황 관리 업무를 총괄하고 상황실장을 보좌한다.\n③ 중앙산림재난상황실은 연중 24시간 상시 운영한다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 중앙산림재난상황실의 구성ㆍ운영에 필요한 사항은 산림청장이 정 한다."}]},{"id":"D-9","law":"D","no":"9","label":"제9조","title":"산불조심기간","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불조심기간","body":"산림청장 또는 지방자치단체의 장은 기상 상태 및 지역 여건을 고려하여 법 제14조제2항에 따른 산불조심기간을 정해야 한다. 다만, 산림청장 또는 지방자치단체의 장이 산불조심기간을 별도로 정하지 않은 경우 산불조심기간은 다음 각 호와 같다.\n1. 봄철 산불조심기간: 매년 2월 1일부터 5월 15일까지\n2. 가을철 산불조심기간: 매년 11월 1일부터 12월 15일까지"}]},{"id":"D-10","law":"D","no":"10","label":"제10조","title":"산불방지대책본부의 설치ㆍ운영","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불방지대책본부의 설치ㆍ운영","body":"① 법 제15조제1항에 따른 중앙산불방지대책본부의 장을 보좌하기 위하여 부본부장을 두며, 부본부장은 산림청 차장이 된다.\n② 법 제15조제2항에 따른 지역산불방지대책본부의 장을 보좌하기 위하여 부본부장을 두며, 부본부장은 산림재난방지기관의 부기관장이 된다.\n③ 중앙산불방지대책본부의 장 또는 지역산불방지대책본부의 장은 해당 산불방지대책본부의 업무를 총괄ㆍ조정한다.\n④ 중앙산불방지대책본부는 다음 각 호의 임무를 수행한다.\n1. 전국 산불방지(산불을 예방ㆍ대비ㆍ대응하고 산불로 발생한 피해를 복구하는 모든 활동을 말한다. 이하 같다) 총괄 지휘\n2. 관계 중앙행정기관과의 협조체계 구축\n3. 지역산불방지대책본부 운영 상황 점검 및 지도\n4. 산불 진화계획 수립, 법 제55조에 따른 산림항공기 운용, 공중 진화를 위한 통신체계 구축\n5. 관계 중앙행정기관의 장에 대한 인력 및 진화 자원 등의 지원 요청\n⑤ 지역산불방지대책본부는 다음 각 호의 임무를 수행한다.\n1. 지역 산불방지 업무 총괄\n2. 관련 예산 및 인력 운용\n3. 지역 산림재난방지유관기관과의 협조체계 구축\n4. 주민에 대한 산불방지 관련 홍보\n5. 산불방지 사업 실시\n6. 산불 신고 접수, 진화 상황 및 진화 결과 보고 등\n⑥ 제1항부터 제5항까지에서 규정한 사항 외에 중앙산불방지대책본부 및 지역산불방지대책본부의 구성ㆍ운영 등에 필요한 사항은 산림청장 또는 산림재난방지기관의 장이 정한다."}]},{"id":"D-11","law":"D","no":"11","label":"제11조","title":"산불 방지 조치","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불 방지 조치","body":"법 제16조제1항에서 “불을 피우는 행위를 금지하거나 화기(火器), 인화(引火) 물질 및 발화(發火) 물질의 제거 등 대통령령으로 정하는 산불방지에 필요한 조치”란 다음 각 호의 조치를 말한다.\n1. 불을 피우는 행위의 금지\n2. 화기, 인화 물질 및 발화 물질의 제거\n3. 법 제31조제1항에 따른 산불 신고\n4. 그 밖에 산불의 발생ㆍ확산 방지를 위하여 필요한 조치"}]},{"id":"D-12","law":"D","no":"12","label":"제12조","title":"산불 예방을 위한 행위 제한의 예외","chapter":"제3장 산림재난 예방","section":"제1절 산불 예방","versions":[{"from":"2026-02-01","title":"산불 예방을 위한 행위 제한의 예외","body":"① 법 제18조제2항제1호에서 “불이 탈 가능성이 있는 물질을 제거하는 등 대통령령으로 정하는 경우”란 다음 각 호의 행위를 하는 경우를 말한다.\n1. 불이 탈 가능성이 있는 물질의 제거\n2. 산림병해충 방제\n3. 학술연구조사\n4. 그 밖에 산불의 발생ㆍ확산 방지를 위하여 필요한 행위\n② 제1항에도 불구하고 「자연공원법」에 따른 공원구역에서 불을 피우거나 불을 가지고 들어가는 행위에 관하여는 「자연공원법」에서 정하는 바에 따른다.\n③ 법 제18조제2항제2호에서 “야영이 허가된 야영장 등 대통령령으로 정하는 지역”이란 다음 각 호의 장소를 말한다.\n1. 「청소년활동 진흥법」 제10조제1호마목에 따른 청소년야영장\n2. 「관광진흥법 시행령」 별표 1 제4호다목에 따른 야영장\n3. 「산림문화ㆍ휴양에 관한 법률 시행령」 제7조제1항, 제9조의3제1항 및 제9조의8에 따른 다음 각 목의 시설\n가. 자연휴양림에 설치된 숲속의 집, 산림휴양관, 야영장(야영데크를 포함한다), 오토캠핑장, 취사장\n나. 숲속야영장 및 숲경영체험림에 설치된 일반야영장(야영데크를 포함한다), 자동차야영장, 숲속의 집, 취사장"}]},{"id":"D-13","law":"D","no":"13","label":"제13조","title":"산사태예방지원본부의 구성ㆍ운영","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태예방지원본부의 구성ㆍ운영","body":"① 법 제19조제1항에 따른 산사태예방지원본부(이하 이 조에서 “산사태예방지원본부”라 한다)의 장을 보좌하기 위하여 부본부장을 두며, 부본부장은 산림청 차장이 된다.\n② 제1항에서 규정한 사항 외에 산사태예방지원본부의 운영 등에 필요한 사항은 산사태예방지원본부의 장이 정한다."}]},{"id":"D-14","law":"D","no":"14","label":"제14조","title":"산사태취약지역 지정위원회의 구성 등","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"산사태취약지역 지정위원회의 구성 등","body":"① 법 제23조에 따른 지방산림청장 소속 산사태취약지역 지정위원회(이하 이 조에서 “지정위원회”라 한다)는 위원장과 부위원장 각 1명을 포함한 10명 이내의 위원으로 성별을 고려하여 구성한다.\n② 지정위원회의 위원은 다음 각 호의 사람이 된다.\n1. 지방산림청 소속 공무원 중에서 지방산림청장이 지명하는 사람\n2. 다음 각 목의 어느 하나에 해당하는 사람 중에서 지방산림청장이 위촉하는 사람\n가. 산사태ㆍ사방ㆍ지질 또는 재난 분야에 학식과 경험이 풍부한 사람\n나. 산사태ㆍ사방ㆍ지질 또는 재난 관련 기관ㆍ단체의 임직원\n다. 관할 지역의 주민\n③ 지정위원회의 위원장은 위원 중에서 호선(互選)하고, 부위원장은 위원장이 지명한다.\n④ 제2항제2호에 따라 위촉하는 위원의 임기는 2년으로 한다.\n⑤ 지정위원회에 간사 1명을 두며, 간사는 지방산림청 소속 공무원 중에서 지방산림청장이 임명한다.\n⑥ 제1항부터 제5항까지에서 규정한 사항 외에 지정위원회 운영 등에 필요한 사항은 농림축산식품부령으로 정한다."}]},{"id":"D-15","law":"D","no":"15","label":"제15조","title":"안전조치 명령","chapter":"제3장 산림재난 예방","section":"제2절 산사태등 예방","versions":[{"from":"2026-02-01","title":"안전조치 명령","body":"산림재난방지기관의 장은 법 제25조제3항에 따라
